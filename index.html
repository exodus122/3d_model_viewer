<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>3D Model Viewer</title>
  <style>
    :root{--sidebar-w:320px}
    html,body{height:100%;margin:0;font-family:Inter,Segoe UI,Roboto,Helvetica,Arial}
    #app{display:flex;height:100vh;overflow:hidden}
    #canvas-wrap{flex:1;position:relative;background:#111}
    canvas{display:block;width:100%;height:100%}
    #sidebar{width:var(--sidebar-w);background:#0f1720;color:#e6eef6;padding:12px;box-sizing:border-box;overflow:auto}
    h2{margin:4px 0 10px;font-size:16px}
    h3 {margin: 4px 0;padding: 0}
    label{display:block;margin-top:8px;font-size:13px}
    .row{display:flex;gap:8px;align-items:center}
    input[type=range]{width:100%}
    input[type=number]{background-color: #1e1e1e;color: #efefef;border: 1px solid #555;border-radius: 6px;padding: 6px;font-family: monospace;font-size: 13px;resize: vertical;width: 100%;box-sizing: border-box;margin-top: 6px;margin-bottom: 8px;width: 70px;}
    select, button{margin-top:8px;padding:8px;border-radius:6px;border:none;background:#2563eb;color:white;cursor:pointer}
    .muted{color:#9fb0c8;font-size:13px}
    .info{background:#071624;padding:8px;border-radius:6px;margin-top:8px;font-family:monospace;font-size:13px}
    .controls{margin-top:6px}
    .section{margin-bottom:12px}
    .select-info{background:#071624;padding:2px;border-radius:6px;font-size:13px}
    a.download-link{color:#9fe7ff;display:inline-block;margin-top:6px}
    .footer{margin-top:12px;font-size:12px;color:#9fb0c8}
    .sel-verts{overflow-wrap: anywhere;}
    #status{margin-top:8px;padding:8px;border-radius:6px;background:#221a11;color:#ffd;}
    #crosshair {position: absolute;left: 50%;top: 50%;width: 16px;height: 16px;margin-left: -8px;margin-top: -8px;pointer-events: none;z-index: 10;}
    #crosshair::before, #crosshair::after {content: '';position: absolute;background: white;}
    #crosshair::before {left: 7px;top: 0;width: 2px;height: 16px;}
    #crosshair::after {top: 7px;left: 0;width: 16px;height: 2px;}
    #mapDropdown {min-width: 200px;max-width: 250px;box-sizing: border-box;}
    #file {border-radius: 6px;padding-top: 8px;font-family: monospace;font-size: 13px;}
    #file::file-selector-button {background-color: #2564eb; /* button background */color: #fff; /* button text */border: none;border-radius: 4px;padding: 6px 10px;margin-right: 8px;cursor: pointer;transition: background-color 0.2s ease;}
    #selectionListEl {background-color: #1e1e1e;color: #efefef;border: 1px solid #555;border-radius: 6px;padding: 6px;font-family: monospace;font-size: 13px;resize: vertical;width: 100%;box-sizing: border-box;margin-top: 6px;margin-bottom: 8px;}
  </style>
</head>
<body>
  <div id="app">
    <div id="canvas-wrap">
      <canvas id="gl"></canvas>
      <div id="crosshair"></div>
      <div id="hint" style="position:absolute;left:10px;top:10px;background:rgba(0,0,0,0.4);padding:6px;border-radius:6px;color:#dbeafe;font-family:monospace;font-size:13px">Click canvas to lock mouse &amp; fly (WASD + SPACE/C to move up/down). Press Esc to unlock pointer</div>
    </div>

    <div id="sidebar">
      <h2>3D Model Viewer</h2>

      <div class="section">
        <!--<div class="muted">Game:</div>-->
        <select id="selected-game">
            <option value="BK">Banjo-Kazooie</option>
            <option value="BT">Banjo-Tooie</option>
            <option value="OOT">OOT</option>
            <option value="OOT3D">OOT3D</option>
            <option value="MM">MM</option>
            <option value="MM3D">MM3D</option>
            <!--<option value="Default">Default</option>-->
        </select>
        <select id="mapDropdown"></select>
        <!--<label>Load model file (binary or text). Supported binary format:
          <div class="muted">[uint16 vertexCount][uint16 triCount][int16 x,y,z ...][uint16 i,j,k ...]</div>-->
        </label>
        <button id="loadMap">Load Map</button>
        <input id="file" type="file" accept="*/*" />
      </div>

      <div class="section controls">
        <h3>Options</h3>
        <!--<div class="muted">Control mode:</div>-->
        <select id="control-mode">
          <!--<option value="auto">Auto (try Pointer Lock, fallback to Orbit)</option>-->
          <option value="pointer">Fly Mode (WASD)</option>
          <option value="orbit">Orbit (mouse drag + wheel)</option>
        </select>
        <div id="status" role="status" aria-live="polite">Status: starting...</div>
        <label>Flying Speed <input id="movementSpeedSlider" type="range" min="200" max="4200" step="200" value="1500"></label>
        <label id="display_fwc_label" style="display:none;"><input id="display_fwc" type="checkbox"> Display floors/walls/ceilings on load</label>
        <label><input id="wireframe" type="checkbox" checked> Draw triangle edges</label>
        <label><input id="backface" type="checkbox"> Double-sided</label>
        <div style="display: flex; align-items: center; margin-bottom: 4px; gap: 8px;" id="flatGroundContainer"><label id="flatGroundLabel"><input type="checkbox" id="flatGroundCheckbox">Flat Ground Clips</label><input type="color" id="flatGroundColorPicker" value="#00FFFF"></div>
        <div style="display: flex; align-items: center; margin-bottom: 4px; gap: 8px;" id="specialNormalContainer"><label id="specialNormalLabel"><input type="checkbox" id="specialNormalCheckbox">Special Normal</label><input type="color" id="specialNormalColorPicker" value="#00FFFF"></div>
        <div style="display: flex; align-items: center; margin-bottom: 4px; gap: 8px;" id="samplePointsContainer"><label id="samplePointsLabel"><input type="checkbox" id="samplePointsCheckbox">Sample Standable Points</label><input type="range" id="samplePointsResolution" value="0.1" min="0.001" max="0.12" step="0.01"></div>
        <label style="display:none;"><input id="translucent" type="checkbox" checked> Translucent (opacity)</label>
        <label style="display:none;">Opacity <input id="opacity" type="range" min="0" max="1" step="0.01" value="1.0"></label>
        <label style="display:none;"><input id="grid" type="checkbox"> Draw grid</label>
      </div>
      
      <div class="section">
        <h3>Selected Triangles</h3>
        <div class="select-info">
          <label><input id="multiSelect" type="checkbox"> Multi-select</label>
          <textarea id="selectionListEl" rows="6" cols="40" readonly></textarea>
        </div>
      </div>

      <div class="section">
        <h3>Camera</h3>
        <div class="info">
          <div>pos: <span id="cam-pos">0,0,0</span></div>
          <div>rot (deg): <span id="cam-rot">0,0,0</span></div>
        </div>
      </div>

      <!--<div class="section footer muted">
      </div>-->
    </div>
  </div>  
  <!-- Import map to allow bare "three" imports from example modules. -->
  <script type="importmap">
  {
    "imports": {
        "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/"
    }
  }
  </script>
  <script type="text/javascript"  src="model_list.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-delaunay@6.0.4/dist/d3-delaunay.min.js"></script>
  <script type="module">
    
    ////////////////////////////////////////
    // Known Issues:
    // - subdivisions are not accounted for, which can make some seams, points, or standable surfaces not actually standable
    // - poly exclusion flags (xpflags) were not accounted for when generating the green line seams, 
    // so some are fake in lost woods and kokiri
	// - Some OoT3D Death mountain crater polys are showing as red standable surfances instead of blue
    ////////////////////////////////////////
    
    ////////////////////////////////////////
    // Imports
    ////////////////////////////////////////
    
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
    import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
    import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
    import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
    
    ////////////////////////////////////////
    // System: DOM / Static UI Elements
    ////////////////////////////////////////
    
    const canvas = document.getElementById('gl');
    const mapDropdown = document.getElementById("mapDropdown");
    const fileInput = document.getElementById('file');
    const loadMapButton = document.getElementById('loadMap');
    const wireframeCheckbox = document.getElementById('wireframe');
    const gridCheckbox = document.getElementById('grid');
    const translucentCheckbox = document.getElementById('translucent');
    const opacitySlider = document.getElementById('opacity');
    const movementSpeedSlider = document.getElementById('movementSpeedSlider');
    const backfaceCheckbox = document.getElementById('backface');
    const camPosEl = document.getElementById('cam-pos');
    const camRotEl = document.getElementById('cam-rot');
    const statusEl = document.getElementById('status');
    const controlModeSel = document.getElementById('control-mode');
    const gameSel = document.getElementById('selected-game');
    const display_fwc = document.getElementById('display_fwc');
    const display_fwc_label = document.getElementById('display_fwc_label');
    
    
    const samplePointsContainer = document.getElementById("samplePointsContainer"); 
    const samplePointsCheckbox  = document.getElementById("samplePointsCheckbox");
    const samplePointsResolution  = document.getElementById("samplePointsResolution");
    
    const multiSelectCheckbox = document.getElementById('multiSelect');
    const selectionListEl = document.getElementById('selectionListEl');
	
	let specialNormalEnabled = false;
	let specialNormalColor = 0x00ffff;   // default
	let specialNormalMarkers = [];

	const specialNormalContainer    = document.getElementById("specialNormalContainer");
	const specialNormalCheckbox     = document.getElementById("specialNormalCheckbox");
	const specialNormalColorPicker  = document.getElementById("specialNormalColorPicker");
    
    ////////////////////////////////////////
    // System: Scene, Renderer, Camera, Lights
    ////////////////////////////////////////

    const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = false;
    
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1220);

    const camera = new THREE.PerspectiveCamera(60,2,0.1,100000);
    camera.position.set(0,100,400);

    // Lights
    const hemi = new THREE.HemisphereLight(0xaaaaee,0xaaaaee,0.8); // 0x9696fa
    scene.add(hemi);
    const dir = new THREE.DirectionalLight(0xffffff,0.7);
    dir.position.set(100,200,100);
    scene.add(dir);
    
    ////////////////////////////////////////
    // System: Shared State
    ////////////////////////////////////////
    
    // Map each game to its data array
    const GAME_MAPS = {
        BK: BK_Maps,
        BT: BT_Maps,
        OOT: OOT_Maps,
        MM: MM_Maps,
        OOT3D: OOT3D_Maps,
        MM3D: MM3D_Maps,
    };
    
    let game = gameSel.value;
    let controlMode = 'pointer'; // State regarding which control mode is active: 'pointer' | 'orbit' | 'auto'
    let pointerLockBlocked = false; // whether requestPointerLock is blocked (sandboxed iframe)
    let loadedModels = []; // { name, mesh, edges }
    let loadedModels2 = []; // { name, mesh, edges }
    let mesh = null;
    let edges = null;
    let selectedTriangles = []; // Store multiple selections
    const pointerControls = new PointerLockControls(camera, renderer.domElement);
    let orbitControls = null; // lazy-created when needed
    let speed = 1500; // movement units per second
	
	// Constants for zelda collision
    let EPS = 0.008; // used for zelda collision
    const COLPOLY_NORMAL_FRAC = 1.0 / 32767.0; // used for zelda collision
    
    // Material used as base for clones per mesh
    const material = new THREE.MeshStandardMaterial({color:0x3aa6ff,side:THREE.FrontSide,transparent:true,opacity:1.0,flatShading:true});
    const material2 = new THREE.MeshStandardMaterial({color:0xf56342,side:THREE.FrontSide,transparent:true,opacity:1.0,flatShading:true});
    const material3 = new THREE.MeshStandardMaterial({color:0xe1eb34,side:THREE.FrontSide,transparent:true,opacity:1.0,flatShading:true});
    
    // Raycaster for selection
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    
    // Movement state (applies only in pointer-lock / fly mode)
    const move = {forward:false,back:false,left:false,right:false,up:false,down:false};
    
    ////////////////////////////////////////
    // System: UI wiring (material/grid/wireframe/pointer status/etc)
    ////////////////////////////////////////
    
    const grid = new THREE.GridHelper(8000, 80, '#1c2a3a', '#0f1720');
    grid.material.opacity = 0.25;
    grid.material.transparent = true;
    grid.visible = gridCheckbox.checked;
    scene.add(grid);
    
    function setStatus(msg, level='info'){
      statusEl.textContent = `Status: ${msg}`;
      if(level==='warn') statusEl.style.background = '#40230b';
      else if(level==='error') statusEl.style.background = '#4b0b0b';
      else statusEl.style.background = '#221a11';
    }

    function setMaterialProps() {
        loadedModels.forEach(m => {
            if (m.mesh && m.mesh.material) {
                m.mesh.material.transparent = translucentCheckbox.checked;
                m.mesh.material.opacity = parseFloat(opacitySlider.value);
                m.mesh.material.side = backfaceCheckbox.checked
                    ? THREE.DoubleSide
                    : THREE.FrontSide;
                m.mesh.material.needsUpdate = true;
            }
        });
    }
    
    translucentCheckbox.addEventListener('change', setMaterialProps);
    opacitySlider.addEventListener('input', setMaterialProps);
    backfaceCheckbox.addEventListener('change', setMaterialProps);
    
    movementSpeedSlider.addEventListener('input', () => {speed = movementSpeedSlider.value;});
    
    wireframeCheckbox.addEventListener('change', () => {
        loadedModels.forEach(m => {
            if (m.edges) {
                m.edges.visible = m.mesh.visible && wireframeCheckbox.checked;
            }
        });
    });

    gridCheckbox.addEventListener('change', () => {
        grid.visible = gridCheckbox.checked;
    });
    
    
    // Listen for changes to multi-select checkbox
    multiSelectCheckbox.addEventListener('change', () => {
        if (!multiSelectCheckbox.checked) {
            clearSelection(); // clears all yellow triangles & selection info
        }
    });
    
    
    ////////////////////////////////////////
    // System: Dropdown population (initial)
    ////////////////////////////////////////
    
    BK_Maps.forEach(map => {
        const option = document.createElement("option");
        option.value = map.name; // This will be the value when selected
        option.textContent = map.name; // This is what’s shown to the user
        mapDropdown.appendChild(option);
    });
    
    ////////////////////////////////////////
    // System: Game selector
    ////////////////////////////////////////
    
    gameSel.addEventListener('change',(e)=>{
      game = e.target.value;
      mapDropdown.options.length = 0;
      
      let maps = GAME_MAPS[game]
      
      if(game == "OOT" || game == "MM") {
          EPS = 0.008;
      }
      else if(game == "OOT3D" || game == "MM3D") {
          EPS = 0.00008;
      }
      
      maps.forEach(map => {
        const option = document.createElement("option");
        option.value = map.name; // This will be the value when selected
        option.textContent = map.name; // This is what’s shown to the user
        mapDropdown.appendChild(option);
      });
      
      if (game == "BK" || game == "BT")
        display_fwc_label.style.display = "none";
      else
        display_fwc_label.style.display = "block";
        
    });
    
    ////////////////////////////////////////
    // System: Load Map button
    ////////////////////////////////////////

    // Get map property
    function getMapProperty(game, mapName, prop) {
        const maps = GAME_MAPS[game];
        if (!maps) return null;

        const found = maps.find(map => map.name === mapName);
        return found ? found[prop] ?? null : null;
    }
    
    // Load selected map
    loadMap.addEventListener('click', async (e) => {
        const game = document.getElementById("selected-game").value;
        
        if (game == "BK" || game == "BT"){
            
            const mapName = document.getElementById("mapDropdown").value;
            let mapFilename = getMapProperty(game, mapName, "modelAPointer");
            let mapFilename2 = getMapProperty(game, mapName, "modelBPointer");

            try {
                const res1 = await fetch('./' + game + '/' + mapFilename);
                const buffer1 = await res1.arrayBuffer();
                console.log(mapFilename+": Binary file length:", buffer1.byteLength);
                parseBKModelBinary(buffer1, true);

                if (mapFilename2 === undefined) {
                
                }
                else {
                    const res2 = await fetch('./' + game + '/' + mapFilename2);
                    const buffer2 = await res2.arrayBuffer();
                    console.log(mapFilename2+": Binary file length:", buffer2.byteLength);
                    parseBKModelBinary(buffer2, false);
                }
            } catch (err) {
                console.error(err);
            }
        }
        else if (game == "OOT" || game == "MM" || game == "OOT3D" || game == "MM3D"){
            const mapName = document.getElementById("mapDropdown").value;
            let mapFilename = getMapProperty(game, mapName, "file");

            try {
                const res1 = await fetch('./' + game + '/' + mapFilename);
                const buffer1 = await res1.arrayBuffer();
                console.log(mapFilename+": Binary file length:", buffer1.byteLength);
                parseZeldaModelBinary(buffer1, true, mapName);
                
                if (game == "OOT" || game == "MM" || game == "OOT3D" || game == "MM3D") {
                    let mapFilename2 = getMapProperty(game, mapName, "seams");
                    if (mapFilename2 === undefined) {
                    
                    }
                    else {
                        let seams_path = "seams";
                        if (game == "OOT3D" || game == "MM3D" || game == "MM" || game == "OOT")
                            seams_path = "seams2";
                        const res2 = await fetch('./' + game + '/' + seams_path + '/' + mapFilename2);
                        //const res2 = await fetch('./' + game + '/' + seams_path + '/' + "test.txt");
                            
                        const buffer2 = await res2.arrayBuffer();
                        console.log(mapFilename2+": Binary file length:", buffer2.byteLength);
                        
                        //parseInvisibleSeams2D(new TextDecoder().decode(buffer2));
                        parseInvisibleSeams1D(new TextDecoder().decode(buffer2));
                    }
                }
            } catch (err) {
                console.error(err);
            }
        }
    });

    ////////////////////////////////////////
    // System: File input (user-supplied file)
    ////////////////////////////////////////

    // File parsing
    fileInput.addEventListener('change', async (ev)=>{
      const f = ev.target.files[0];
      if(!f) return;
      const buf = await f.arrayBuffer();
      parseModel(buf);
    });
    
    ////////////////////////////////////////
    // System: Model Parsing (text vs binary dispatch)
    ////////////////////////////////////////

    // Detect binary vs text simple heuristic
    function parseModel(buffer){
      if(typeof buffer === 'string') { parseInvisibleSeams1D(buffer); return; }
      const uint8 = new Uint8Array(buffer);
      let isText = true;
      for(let i=0;i<Math.min(64,uint8.length);i++){
        const c = uint8[i];
        if(c===9||c===10||c===13) continue;
        if(c<32 || c>126){ isText=false; break; }
      }
      if(isText && (game == "OOT" || game == "MM")) parseZeldaModelTextTriangles(new TextDecoder().decode(buffer), true);
      else if(isText) parseInvisibleSeams1D(new TextDecoder().decode(buffer));
      else {
        if(game == "BK" || game == "BT")
            parseBKModelBinary(buffer, true);
        else if (game == "OOT" || game == "MM" || game == "OOT3D" || game == "MM3D")
            parseZeldaModelBinary(buffer, true, "");
        else
            parseModelBinary(buffer);
      }
    }

    // Text format: lines with "v x y z" and "f i j k" (1-based or 0-based)
    function parseModelText(text){
      const lines = text.split(/\r?\n/).map(s=>s.trim()).filter(s=>s&&s[0]!="#");
      const verts = [];
      const tris = [];
      for(const l of lines){
        const parts = l.split(/\s+/);
        if(parts[0].toLowerCase()==='v' && parts.length>=4){
          verts.push( [parseInt(parts[1],10),parseInt(parts[2],10),parseInt(parts[3],10)] );
        } else if((parts[0].toLowerCase()==='f'||parts[0].toLowerCase()==='t') && parts.length>=4){
          const a = parseInt(parts[1],10);
          const b = parseInt(parts[2],10);
          const c = parseInt(parts[3],10);
          tris.push([a,b,c]);
        }
      }
      if(verts.length>0 && tris.length>0){
        const allIdx = [].concat(...tris);
        const maxIdx = Math.max(...allIdx);
        const minIdx = Math.min(...allIdx);
        if(minIdx>=1 && maxIdx<=verts.length) {
          for(let i=0;i<tris.length;i++) tris[i]=tris[i].map(x=>x-1);
        }
      }
      buildGeometry(verts, tris, null, "Main Model", true);
    }

    // Binary format: [uint16 vertexCount][uint16 triCount] then vertexCount*(int16 x,y,z) then triCount*(uint16 a,b,c)
    function parseModelBinary(buffer){
      const dv = new DataView(buffer);
      if(dv.byteLength<4){ alert('binary too small'); return; }
      let offset = 0;
      const vertexCount = dv.getUint16(offset,true); offset+=2;
      const triCount = dv.getUint16(offset,true); offset+=2;
      const verts = [];
      for(let i=0;i<vertexCount;i++){
        if(offset+6>dv.byteLength) break;
        const x = dv.getInt16(offset,true); offset+=2;
        const y = dv.getInt16(offset,true); offset+=2;
        const z = dv.getInt16(offset,true); offset+=2;
        verts.push([x,y,z]);
      }
      //console.log(verts)
      const tris = [];
      for(let i=0;i<triCount;i++){
        if(offset+6>dv.byteLength) break;
        const a = dv.getUint16(offset,true); offset+=2;
        const b = dv.getUint16(offset,true); offset+=2;
        const c = dv.getUint16(offset,true); offset+=2;
        tris.push([a,b,c]);
      }
      //console.log(tris)
      const allIdx = [].concat(...tris);
      const maxIdx = Math.max(...allIdx);
      const minIdx = Math.min(...allIdx);
      if(minIdx>=1 && maxIdx<=verts.length) {
        for(let i=0;i<tris.length;i++) tris[i]=tris[i].map(x=>x-1);
      }
      buildGeometry(verts, tris, null, "Main Model", true);
    }
    
    function parseBKModelBinary(buffer, fresh){
      const dv = new DataView(buffer);
      if (dv.byteLength < 4) {
        alert('binary too small');
        return;
      }

      let vtx_list_offset = dv.getUint32(0x10, false);
      //console.log("vtx_list_offset is " + vtx_list_offset.toString(16));

      // original vertexCount is ignored now
      // const vertexCount = dv.getInt16(vtx_list_offset + 0x14, false);
      // console.log("vertexCount is " + vertexCount.toString(16));

      let offset = vtx_list_offset + 0x18;

      const verts = [];
      while (offset + 0x10 <= dv.byteLength) {
        const x = dv.getInt16(offset, false); offset += 2;
        const y = dv.getInt16(offset, false); offset += 2;
        const z = dv.getInt16(offset, false); offset += 2;

        // skip the remaining 10 bytes of this vertex record
        offset += 10;

        verts.push([x, y, z]);
      }

      //console.log(verts);
      
      let collision_list_offset = dv.getUint32(0x1C,false);
      //console.log("collision_list_offset is "+collision_list_offset.toString(16))
      const geoCount = dv.getInt16(collision_list_offset+0x10,false);
      //console.log("geoCount is "+geoCount.toString(16))
      const triCount = dv.getInt16(collision_list_offset+0x14,false);
      //console.log("triCount is "+triCount.toString(16))
      
      
      offset = collision_list_offset + 0x18 + geoCount * 4;
      //console.log("startTriList is "+offset.toString(16))
      const tris = [];
      for(let i=0;i<triCount;i++){
        if(offset+0xC>dv.byteLength) break;
        const a = dv.getInt16(offset,false)+1; offset+=2;
        const b = dv.getInt16(offset,false)+1; offset+=2;
        const c = dv.getInt16(offset,false)+1; offset+=2;
        offset+=6;
        tris.push([a,b,c]);
      }
      
      //console.log(tris);
      
      const allIdx = [].concat(...tris);
      const maxIdx = Math.max(...allIdx);
      const minIdx = Math.min(...allIdx);
      if(minIdx>=1 && maxIdx<=verts.length) {

    function parseInvisibleSeams1D(text) {
        const lines = text.split(/\r?\n/).map(s => s.trim()).filter(s => s && s[0] !== "#");

        const verts = [];      // unique vertices
        const vertMap = new Map(); // map "x,y,z" -> index
        const edges = [];      // pairs of vertex indices

        function getVertIndex(v) {
            const key = v.join(",");
            if (vertMap.has(key)) return vertMap.get(key);
            const idx = verts.length;
            verts.push(v);
            vertMap.set(key, idx);
            return idx;
        }

        for (const l of lines) {
            const parts = l.split(",").map(Number);
            if (parts.length === 6) {
                const v1 = parts.slice(0, 3);
                const v2 = parts.slice(3, 6);
                const i1 = getVertIndex(v1);
                const i2 = getVertIndex(v2);
                edges.push([i1, i2]);
            }
        }

        //console.log(`Model "${name}": ${verts.length} verts, ${edges.length} edges`);
        buildGeometryEdges(verts, edges, "Seams Model", false);
    }
    
    function parseInvisibleSeams2D(text) {
        const lines = text
            .split(/\r?\n/)
            .map(s => s.trim())
            .filter(s => s && s[0] !== "#");

        const verts = [];
        const vertMap = new Map();
        const tris = [];
        const quadEdges = []; // store edges for each quad

        function getVertIndex(v) {
            const key = v.join(",");
            if (vertMap.has(key)) return vertMap.get(key);
            const idx = verts.length;
            verts.push(v);
            vertMap.set(key, idx);
            return idx;
        }

        for (let i = 0; i < lines.length; i += 3) {
            const edges = [];

            for (let j = 0; j < 3; j++) {
                const parts = lines[i + j].split(",").map(Number);
                const bottom = parts.slice(0, 3);
                const top = parts.slice(3, 6);
                const iBottom = getVertIndex(bottom);
                const iTop = getVertIndex(top);
                edges.push([iBottom, iTop]); // [[A,A2],[B,B2],[C,C2]]
            }

            // Build 1 quad per edge (2 triangles each)
            function addQuad(edge) {
                const idx = edges.indexOf(edge);
                const [b, t] = edge; // bottom, top
                const nextEdge = edges[(idx + 1) % 3];
                const [bNext, tNext] = nextEdge;

                // Add triangles for this quad
                tris.push([b, tNext, t]);
                tris.push([b, bNext, tNext]);

                // Store edges for this quad (4 sides)
                quadEdges.push([b, t]);       // left vertical
                quadEdges.push([t, tNext]);   // top
                quadEdges.push([tNext, bNext]); // right vertical
                quadEdges.push([bNext, b]);   // bottom
            }

            edges.forEach(addQuad);
        }

        // -----------------------
        // Build mesh geometry
        // -----------------------
        const positions = new Float32Array(verts.length * 3);
        for (let i = 0; i < verts.length; i++) positions.set(verts[i], i * 3);

        const indices = new (verts.length > 65535 ? Uint32Array : Uint16Array)(tris.length * 3);
        tris.forEach((t, i) => indices.set(t, i * 3));

        const geom = new THREE.BufferGeometry();
        geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geom.setIndex(new THREE.BufferAttribute(indices, 1));
        geom.computeVertexNormals();

        const mat = new THREE.MeshBasicMaterial({
            color: 0x5cff90, // 0x00ff00,
            side: THREE.DoubleSide,
            polygonOffset: true,
            polygonOffsetFactor: 4,
            polygonOffsetUnits: 4
        });

        const mesh = new THREE.Mesh(geom, mat);
        scene.add(mesh);

        // -----------------------
        // Build edges for each quad
        // -----------------------
        const edgeMap = new Map(); // deduplicate edges
        for (const [i1, i2] of quadEdges) {
            const key = i1 < i2 ? `${i1},${i2}` : `${i2},${i1}`;
            edgeMap.set(key, [i1, i2]);
        }

        const edgePositions = [];
        for (const [i1, i2] of edgeMap.values()) {
            const v1 = verts[i1];
            const v2 = verts[i2];
            edgePositions.push(v1[0], v1[1], v1[2]);
            edgePositions.push(v2[0], v2[1], v2[2]);
        }

        const edgeGeom = new THREE.BufferGeometry();
        edgeGeom.setAttribute('position', new THREE.Float32BufferAttribute(edgePositions, 3));

        const edgeMaterial = new THREE.LineBasicMaterial({
            color: 0x3240a8,
            transparent: true,
            opacity: 1.0,
            depthTest: true
        });

        const edgesObj = new THREE.LineSegments(edgeGeom, edgeMaterial);
        scene.add(edgesObj);

        loadedModels.push({ name: "Invis Seams", mesh, edges: edgesObj });
        addModelCheckbox("Invis Seams", mesh, edgesObj, false, true);
    }

    function buildGeometry(verts, tris, allTriangleData, name = "Main Model", clearFirst = true) {
        
        if ((!verts || !tris || verts.length === 0 || tris.length === 0) && clearFirst) { 
            alert('No valid vertices or triangles found'); 
            return; 
        }

        // Optionally clear all existing models
        if (clearFirst) {
            loadedModels.forEach(m => {
                scene.remove(m.mesh);
                scene.remove(m.edges);
            });
            loadedModels = [];
            loadedModels2.forEach(m => {
                scene.remove(m.mesh);
                scene.remove(m.edges);
            });
            loadedModels2 = [];

            // Remove all model checkboxes
            removeAllModelCheckboxes();
            
            // Clear selection
            clearSelection();
        }

        // Create vertex positions
        const positions = new Float32Array(verts.length * 3);
        for (let i = 0; i < verts.length; i++) {
            positions[3 * i]     = verts[i][0];
            positions[3 * i + 1] = verts[i][1];
            positions[3 * i + 2] = verts[i][2];
        }

        // Create triangle indices
        const indices = new (verts.length > 65535 ? Uint32Array : Uint16Array)(tris.length * 3);
        for (let i = 0; i < tris.length; i++) {
            indices[3 * i]     = tris[i][0];
            indices[3 * i + 1] = tris[i][1];
            indices[3 * i + 2] = tris[i][2];
        }

        // Build geometry and mesh
        const geom = new THREE.BufferGeometry();
        geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geom.setIndex(new THREE.BufferAttribute(indices, 1));
        
        const meshObj = new THREE.Mesh(geom, material.clone());
        meshObj.material.polygonOffset = true;
        meshObj.material.polygonOffsetFactor = 1;
        meshObj.material.polygonOffsetUnits = 1;
        meshObj.userData.triangles = allTriangleData;  // Store metadata
        if(!clearFirst)
            meshObj.material.color.set(0x3aff78);
        scene.add(meshObj);

        // Build wireframe edges
        const edgePositions = [];
        for (let i = 0; i < indices.length; i += 3) {
            const a = indices[i], b = indices[i + 1], c = indices[i + 2];
            const va = verts[a], vb = verts[b], vc = verts[c];
            edgePositions.push(
                va[0], va[1], va[2], vb[0], vb[1], vb[2],
                vb[0], vb[1], vb[2], vc[0], vc[1], vc[2],
                vc[0], vc[1], vc[2], va[0], va[1], va[2]
            );
        }
        const edgeGeom = new THREE.BufferGeometry();
        edgeGeom.setAttribute('position', new THREE.Float32BufferAttribute(edgePositions, 3));
        const edgesObj = new THREE.LineSegments(
            edgeGeom,
            new THREE.LineBasicMaterial({ color: 0x3240a8, linewidth: 1, opacity: 0.8, transparent: true }) // 3240a8
        );
        edgesObj.visible = wireframeCheckbox.checked;
        scene.add(edgesObj);

        // Store and register in UI
        loadedModels.push({ name, mesh: meshObj, edges: edgesObj });
        //console.log(loadedModels);
        addModelCheckbox(name, meshObj, edgesObj, clearFirst, true);
        
        // After loading model
        scanAndBuildFlatGroundMarkers();
		scanAndBuildSpecialNormalMarkers();
        updateFlatGroundUIVisibility();
        updateSamplePointsUIVisibility();
		updateSpecialNormalUIVisibility();
    }
    
    function buildGeometry_fwc(verts, tris, name = "Main Model", clearFirst = true) {

        if ((!verts || !tris || verts.length === 0 || tris.length === 0) && clearFirst) {
            alert('No valid vertices or triangles found');
            return;
        }

        // Clear existing models
        if (clearFirst) {
            loadedModels.forEach(m => {
                scene.remove(m.mesh);
                scene.remove(m.edges);
            });
            loadedModels = [];

            loadedModels2.forEach(m => {
                scene.remove(m.mesh);
                scene.remove(m.edges);
            });
            loadedModels2 = [];

            removeAllModelCheckboxes();
            clearSelection();
        }

        // Build vertex buffer
        const positions = new Float32Array(verts.length * 3);
        for (let i = 0; i < verts.length; i++) {
            positions[i * 3 + 0] = verts[i][0];
            positions[i * 3 + 1] = verts[i][1];
            positions[i * 3 + 2] = verts[i][2];
        }

        // Build index buffer
        const indices = new (verts.length > 65535 ? Uint32Array : Uint16Array)(tris.length * 3);
        for (let i = 0; i < tris.length; i++) {
            indices[i * 3 + 0] = tris[i][0];
            indices[i * 3 + 1] = tris[i][1];
            indices[i * 3 + 2] = tris[i][2];
        }

        const geom = new THREE.BufferGeometry();
        geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geom.setIndex(new THREE.BufferAttribute(indices, 1));
        geom.clearGroups();

        // --- normal.y helper ---
        function triangleNormalY(a, b, c) {
            const ax = b[0] - a[0];
            const ay = b[1] - a[1];
            const az = b[2] - a[2];

            const bx = c[0] - a[0];
            const by = c[1] - a[1];
            const bz = c[2] - a[2];

            const nx = ay * bz - az * by;
            const ny = az * bx - ax * bz;
            const nz = ax * by - ay * bx;

            const len = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
            return ny / len;
        }

        // --- build geometry groups ---
        let groupStart = 0;
        let currentGroup = null;

        for (let i = 0; i < tris.length; i++) {
            const [ia, ib, ic] = tris[i];
            const ny = triangleNormalY(verts[ia], verts[ib], verts[ic]);

            let group;
            if (ny > 0.5) {
                group = 0;          // floor
            } else if (ny < -0.8) {
                group = 2;          // ceiling
            } else {
                group = 1;          // wall
            }

            if (currentGroup === null) {
                currentGroup = group;
                groupStart = i * 3;
            }

            if (group !== currentGroup) {
                geom.addGroup(groupStart, (i * 3) - groupStart, currentGroup);
                groupStart = i * 3;
                currentGroup = group;
            }
        }

        // flush final group
        geom.addGroup(groupStart, tris.length * 3 - groupStart, currentGroup);

        // --- mesh ---
        const meshObj = new THREE.Mesh(
            geom,
            [
                material.clone(),   // group 0
                material2.clone(),  // group 1
                material3.clone()   // group 2
            ]
        );

        meshObj.material.forEach(m => {
            m.polygonOffset = true;
            m.polygonOffsetFactor = 1;
            m.polygonOffsetUnits = 1;
        });

    function buildGeometryFromTriangles(allTriangleData, name = "Main Model", clearFirst = true) {

        if ((!allTriangleData || allTriangleData.length === 0) && clearFirst) {
            alert("No triangle data found");
            return;
        }

        // ---------------------
        // Optional: Clear scene
        // ---------------------
        if (clearFirst) {
            loadedModels.forEach(m => {
                scene.remove(m.mesh);
                scene.remove(m.edges);
            });
            loadedModels = [];

            loadedModels2.forEach(m => {
                scene.remove(m.mesh);
                scene.remove(m.edges);
            });
            loadedModels2 = [];

            removeAllModelCheckboxes();
            clearSelection();
        }

        // ---------------------
        // Build position buffer
        // ---------------------
        const positions = new Float32Array(allTriangleData.length * 9); // 3 verts × 3 floats
        const indices   = new (allTriangleData.length > 21845 ? Uint32Array : Uint16Array)(allTriangleData.length * 3);

        let pi = 0;
        for (let i = 0; i < allTriangleData.length; i++) {
            const tri = allTriangleData[i];
            const v0 = tri.vtxs[0], v1 = tri.vtxs[1], v2 = tri.vtxs[2];

            positions[pi++] = v0.x; positions[pi++] = v0.y; positions[pi++] = v0.z;
            positions[pi++] = v1.x; positions[pi++] = v1.y; positions[pi++] = v1.z;
            positions[pi++] = v2.x; positions[pi++] = v2.y; positions[pi++] = v2.z;

            const base = i * 3;
            indices[base]     = base;
            indices[base + 1] = base + 1;
            indices[base + 2] = base + 2;
        }

        // ---------------------
        // Build geometry object
        // ---------------------
        const geom = new THREE.BufferGeometry();
        geom.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        geom.setIndex(new THREE.BufferAttribute(indices, 1));

        // Three’s normals are lighting normals. Not what you want for OOT plane normals.
        // But we let Three compute them anyway for shading.
        geom.computeVertexNormals();

        const meshObj = new THREE.Mesh(geom, material.clone());
        meshObj.material.polygonOffset = true;
        meshObj.material.polygonOffsetFactor = 1;
        meshObj.material.polygonOffsetUnits = 1;
        if (!clearFirst)
            meshObj.material.color.set(0x3aff78);

        // Store original triangle metadata here
        meshObj.userData.allTriangleData = allTriangleData;

        scene.add(meshObj);

        // ---------------------
        // Wireframe edges
        // ---------------------
        const edgePositions = [];
        for (let i = 0; i < indices.length; i += 3) {
            const a = indices[i], b = indices[i+1], c = indices[i+2];
            const pa = new THREE.Vector3(
                positions[3*a], positions[3*a+1], positions[3*a+2]
            );
            const pb = new THREE.Vector3(
                positions[3*b], positions[3*b+1], positions[3*b+2]
            );
            const pc = new THREE.Vector3(
                positions[3*c], positions[3*c+1], positions[3*c+2]
            );

            edgePositions.push(
                pa.x, pa.y, pa.z, pb.x, pb.y, pb.z,
                pb.x, pb.y, pb.z, pc.x, pc.y, pc.z,
                pc.x, pc.y, pc.z, pa.x, pa.y, pa.z
            );
        }

        const edgeGeom = new THREE.BufferGeometry();
        edgeGeom.setAttribute('position', new THREE.Float32BufferAttribute(edgePositions, 3));
        const edgesObj = new THREE.LineSegments(
            edgeGeom,
            new THREE.LineBasicMaterial({
                color: 0x3240a8,
                linewidth: 1,
                opacity: 0.8,
                transparent: true
            })
        );
        edgesObj.visible = wireframeCheckbox.checked;
        scene.add(edgesObj);

        // Register in UI
        loadedModels.push({ name, mesh: meshObj, edges: edgesObj });
        addModelCheckbox(name, meshObj, edgesObj, clearFirst, true);

        scanAndBuildFlatGroundMarkers();
		scanAndBuildSpecialNormalMarkers();
        updateFlatGroundUIVisibility();
        updateSamplePointsUIVisibility();
		updateSpecialNormalUIVisibility();
    }

    function clipTriangleByMinY(verts, minY) {
        // verts = [{x,y,z}, ... 3 items]

        const out = [];

        for (let i = 0; i < 3; i++) {
            const a = verts[i];
            const b = verts[(i + 1) % 3];

            const aAbove = a.y >= minY;
            const bAbove = b.y >= minY;

            // Case 1: A is above → keep A
            if (aAbove) out.push(a);

            // Case 2: Edge AB crosses the minY plane → add intersection
            if (aAbove !== bAbove) {
                const t = (minY - a.y) / (b.y - a.y);  // param along AB
                out.push({
                    x: a.x + (b.x - a.x) * t,
                    y: minY,
                    z: a.z + (b.z - a.z) * t,
                });
            }
        }

        return out;
    }
    
    // Helper: compute vertices below minY (clipped slice)
    function getClippedBelowTriangle(rawVerts, minY) {
        const belowVerts = [];

        for (let i = 0; i < 3; i++) {
            const curr = rawVerts[i];
            const next = rawVerts[(i + 1) % 3];

            const currBelow = curr.y < minY;
            const nextBelow = next.y < minY;

            if (currBelow) belowVerts.push(curr);

            // Edge crosses minY plane
            if (currBelow !== nextBelow) {
                const t = (minY - curr.y) / (next.y - curr.y);
                const intersect = {
                    x: f32(curr.x + t * (next.x - curr.x)),
                    y: f32(minY),
                    z: f32(curr.z + t * (next.z - curr.z))
                };
                belowVerts.push(intersect);
            }
        }

        return belowVerts;
    }

    function renderStandableSurfaceWithEdges(allTriangleData) {
        const f32 = Math.fround;

        const positionsNormal = [];
        const indicesNormal = [];
        let vertexOffsetNormal = 0;

        const positionsSpecial = [];
        const indicesSpecial = [];
        let vertexOffsetSpecial = 0;

        allTriangleData.forEach(tri => {
            const vtxs = tri.vtxs;
            const normals = tri.normals;
            const D = f32(tri.d);

            const Nx = f32(normals[0] * COLPOLY_NORMAL_FRAC);
            const Ny = f32(normals[1] * COLPOLY_NORMAL_FRAC);
            const Nz = f32(normals[2] * COLPOLY_NORMAL_FRAC);

            if (Ny < f32(0.0) || isZero(Ny)) return;

            const originalMinY = Math.min(vtxs[0].y, vtxs[1].y, vtxs[2].y);

            function liftVertex(x, z) {
				// f32 comparison threshold
				if (Math.abs(Ny) < f32(1e-12)) return f32(0.0);

				// dot = Nx*x + Nz*z + D   (all f32)
				const dot = f32(
					f32(f32(Nx * x) + f32(Nz * z)) + D
				);

				// -(dot) / Ny    (all f32)
				return f32(f32(-dot) / Ny);
			}
			
			if (vtxs[0].x == 485 && vtxs[0].y == 1233 && vtxs[0].z == 1764 && 
			vtxs[1].x == -69 && vtxs[1].y == 1233 && vtxs[1].z == 1487 && 
			vtxs[2].x == -291 && vtxs[2].y == 1233 && vtxs[2].z == 1875)
				console.log("hi")

            // Expand triangle
            let expandedVertices = vtxs.map(v => ({ x: f32(v.x), z: f32(v.z) }));
            if (Math.abs(Ny) > f32(0.5)) {

				// Compute centroid in f32
				const centroidX = f32(
					f32(expandedVertices[0].x + expandedVertices[1].x + expandedVertices[2].x) / f32(3.0)
				);
				const centroidZ = f32(
					f32(expandedVertices[0].z + expandedVertices[1].z + expandedVertices[2].z) / f32(3.0)
				);

				expandedVertices = expandedVertices.map(v => {

					const dx = f32(v.x - centroidX);
					const dz = f32(v.z - centroidZ);

					// len = sqrt(dx*dx + dz*dz) in f32
					const len = f32(Math.sqrt(f32(f32(dx * dx) + f32(dz * dz))));

					// factor = (len + 1) / len   (all f32)
					let factor = f32(1.0);
					if (len > f32(0.0)) {
						factor = f32(f32(len + f32(1.0)) / len);
					}

					return {
						x: f32(centroidX + f32(dx * factor)),
						z: f32(centroidZ + f32(dz * factor))
					};
				});
			}

            // Compute rawVerts
            const rawVerts = [];
            for (let i = 0; i < 3; i++) {
                const vx = expandedVertices[i].x;
                const vz = expandedVertices[i].z;
                const vy = liftVertex(vx, vz);
                rawVerts.push({ x: vx, y: vy, z: vz });
            }

            // Check if ALL rawVerts are below original triangle, and it's relatively flat
            let allBelowOriginal = rawVerts.every(v => v.y < originalMinY);

            let clippedAbove;
            if (!allBelowOriginal) {
                clippedAbove = clipTriangleByMinY(rawVerts, originalMinY);
                if (clippedAbove.length < 3) return;
            }

            // Triangulate above-plane portion
            if (!allBelowOriginal) {
                for (let i = 1; i < clippedAbove.length - 1; i++) {
                    const v0 = clippedAbove[0], v1 = clippedAbove[i], v2 = clippedAbove[i+1];
                    positionsNormal.push(v0.x,v0.y,v0.z, v1.x,v1.y,v1.z, v2.x,v2.y,v2.z);
                    indicesNormal.push(vertexOffsetNormal, vertexOffsetNormal+1, vertexOffsetNormal+2);
                    vertexOffsetNormal += 3;
                }
            }

            // Triangulate clipped/below-plane portion (special color)
            if(Ny > 0.5) {
                
                let clippedBelow;
                if (allBelowOriginal) {
                    clippedBelow = rawVerts;
                } else {
                    clippedBelow = getClippedBelowTriangle(rawVerts, originalMinY);
                }

                if (clippedBelow.length >= 3) {
                    for (let i = 1; i < clippedBelow.length - 1; i++) {
                        const v0 = clippedBelow[0], v1 = clippedBelow[i], v2 = clippedBelow[i+1];
                        positionsSpecial.push(v0.x,v0.y,v0.z, v1.x,v1.y,v1.z, v2.x,v2.y,v2.z);
                        indicesSpecial.push(vertexOffsetSpecial, vertexOffsetSpecial+1, vertexOffsetSpecial+2);
                        vertexOffsetSpecial += 3;
                    }
                }
            }
        });

        // Build meshes
        const group = new THREE.Group();

        if (positionsNormal.length > 0) {
            const geometryN = new THREE.BufferGeometry();
            geometryN.setAttribute('position', new THREE.Float32BufferAttribute(positionsNormal, 3));
            geometryN.setIndex(indicesNormal);
            geometryN.computeVertexNormals();

            const meshN = new THREE.Mesh(
                geometryN,
                new THREE.MeshStandardMaterial({
                    color: 0xff0000,
                    side: THREE.DoubleSide,
                    flatShading: true,
                    polygonOffset: true,
                    polygonOffsetFactor: 4,
                    polygonOffsetUnits: 4
                })
            );

            const edgesN = new THREE.LineSegments(
                new THREE.EdgesGeometry(geometryN),
                new THREE.LineBasicMaterial({ color: 0x000000 })
            );

            group.add(meshN);
            group.add(edgesN);
        }

        if (positionsSpecial.length > 0) {
            const geometryS = new THREE.BufferGeometry();
            geometryS.setAttribute('position', new THREE.Float32BufferAttribute(positionsSpecial, 3));
            geometryS.setIndex(indicesSpecial);
            geometryS.computeVertexNormals();

            const meshS = new THREE.Mesh(
                geometryS,
                new THREE.MeshStandardMaterial({
                    color: 0x0000ff,
                    side: THREE.DoubleSide,
                    flatShading: true,
                    polygonOffset: true,
                    polygonOffsetFactor: 4,
                    polygonOffsetUnits: 4
                })
            );

            const edgesS = new THREE.LineSegments(
                new THREE.EdgesGeometry(geometryS),
                new THREE.LineBasicMaterial({ color: 0x000000 })
            );

            group.add(meshS);
            group.add(edgesS);
        }

        return group;
    }

    function removeAllModelCheckboxes() {
        const section = document.querySelector('.controls');
        // Remove all containers that hold the model checkbox + color picker
        section.querySelectorAll('div').forEach(container => {
            const label = container.querySelector('label');
            if (label && label.textContent.trim().startsWith('Show ')) {
                container.remove();

        });

    function addModelCheckbox(name, meshObj, edgesObj, clearFirst, checked, color = null, deleteButton = false) {
        const section = document.querySelector('.controls');

        // Container
        const container = document.createElement('div');
        container.style.display = 'flex';
        container.style.alignItems = 'center';
        container.style.marginBottom = '4px';
        container.style.gap = '8px'; // space between checkbox+label and color picker
        container.dataset.modelName = name;

        // Visibility checkbox + label
        const label = document.createElement('label');
        label.style.display = 'flex';
        label.style.alignItems = 'center';
        const chk = document.createElement('input');
        chk.type = 'checkbox';
        chk.checked = checked;
        if (meshObj != null)
            meshObj.visible = checked;
        if (edgesObj != null)
            edgesObj.visible = checked;
        chk.addEventListener('change', () => {
            if (meshObj != null)
                meshObj.visible = chk.checked;
            if (edgesObj != null)
                edgesObj.visible = chk.checked && wireframeCheckbox.checked;
            clearSelection();
        });
        label.appendChild(chk);
        const labelText = document.createTextNode(` Show ${name}`);
        label.appendChild(labelText);
        
        // ----- DELETE BUTTON -----
        const del = document.createElement('button');
        del.textContent = "×";
        del.style.marginLeft = "4px";
        del.style.cursor = "pointer";
        del.style.padding = "0 4px";
        del.style.border = "1px solid #888";
        del.style.borderRadius = "3px";
        del.style.background = "#333";
        del.style.color = "#f55";
        del.title = "Remove this model";
        del.classList.add("delete-btn");
        
        del.addEventListener('click', () => {
            // Remove from scene
            if (meshObj) scene.remove(meshObj);
            if (edgesObj) scene.remove(edgesObj);

            // Dispose
            if (meshObj?.geometry) meshObj.geometry.dispose();
            if (meshObj?.material) meshObj.material.dispose();
            if (edgesObj?.geometry) edgesObj.geometry.dispose();
            if (edgesObj?.material) edgesObj.material.dispose();

            // Remove from loadedModels
            const idx = loadedModels.findIndex(m => m.name === name);
            if (idx !== -1) loadedModels.splice(idx, 1);

            // Remove UI
            container.remove();

            clearSelection();
            updateSelectionUI();
        });

        // Color picker
        const colorInput = document.createElement('input');
        colorInput.type = 'color';
        if (color != null)
            colorInput.value = color;
        else
            colorInput.value = clearFirst ? '#3aa6ff' : '#3aff78';
        colorInput.addEventListener('input', () => {
            if (meshObj != null && meshObj.material) {
                meshObj.material.color.set(colorInput.value);
                meshObj.material.needsUpdate = true;
            }
            else if (meshObj != null && meshObj.children) {
                meshObj.children[0].material.color.set(colorInput.value);
                meshObj.children[0].material.needsUpdate = true;    
            }
            else if (edgesObj != null && edgesObj.material) {
                edgesObj.material.color.set(colorInput.value);
                edgesObj.material.needsUpdate = true;
            }
        });

        // Assemble
        container.appendChild(label);
        container.appendChild(colorInput);
        if(deleteButton) {
            container.appendChild(del);
        }
        section.appendChild(container);
    }

                `EDGE ${e.index}:  ` +
                `${a.x.toFixed(7)}, ${a.y.toFixed(7)}, ${a.z.toFixed(7)},  ` +
                `${b.x.toFixed(7)}, ${b.y.toFixed(7)}, ${b.z.toFixed(7)}`

        for (const p of selectedPoints) {
            const v = p.pos;
            lines.push(`PT:  ${formatNumber(v.x)}, ${formatNumber(v.y)}, ${formatNumber(v.z)}`);
        }

        selectionListEl.value = lines.join("\n");

    // Clear selection
    function clearSelection() {
        // Triangles
        selectedTriangles.forEach(sel => {
            const markerName = `selectionMarker_${sel.modelName}_${sel.index}`;
            const marker = scene.getObjectByName(markerName);
            if (marker) {
                scene.remove(marker);
                if (marker.geometry) marker.geometry.dispose();
                if (marker.material) marker.material.dispose();

        });
        selectedTriangles.length = 0;

        // Points
        selectedPoints.forEach(p => removePointMarker(p));
        selectedPoints.length = 0;
        
        // Edges

    function addSelectionMarker(tri) {
        const selGeom = new THREE.BufferGeometry();
        const arr = new Float32Array([
            tri.verts[0].x, tri.verts[0].y, tri.verts[0].z,
            tri.verts[1].x, tri.verts[1].y, tri.verts[1].z,
            tri.verts[2].x, tri.verts[2].y, tri.verts[2].z
        ]);
        selGeom.setAttribute('position', new THREE.BufferAttribute(arr, 3));
        selGeom.setIndex([0, 1, 2]);

        const selMat = new THREE.MeshBasicMaterial({
            color: 0xffff66,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 1.0,
            polygonOffset: true,
            polygonOffsetFactor: -1,
            polygonOffsetUnits: -1
        });

        const selMesh = new THREE.Mesh(selGeom, selMat);
        selMesh.name = `selectionMarker_${tri.modelName}_${tri.index}`;
        scene.add(selMesh);
    }

    function removeSelectionMarker(tri) {
        const markerName = `selectionMarker_${tri.modelName}_${tri.index}`;
        const marker = scene.getObjectByName(markerName);

    function addPointMarker(pointObj) {
        const geo = new THREE.SphereGeometry(0.08, 12, 12);
        const mat = new THREE.MeshBasicMaterial({
            color: 0x44ff44,
            transparent: true,
            opacity: 1.0
        });

        mesh.name = `pointMarker_${pointObj.modelName}_${pointObj.index}_${pointObj.vertex}`;

    function removePointMarker(pointObj) {
        const name = `pointMarker_${pointObj.modelName}_${pointObj.index}_${pointObj.vertex}`;
        const m = scene.getObjectByName(name);
        if (m) {
            scene.remove(m);
            m.geometry.dispose();
            m.material.dispose();
        }

    function addEdgeMarker(edge) {
        const geom = new THREE.BufferGeometry();
        geom.setAttribute('position', new THREE.Float32BufferAttribute([
            edge.a.x, edge.a.y, edge.a.z,
            edge.b.x, edge.b.y, edge.b.z
        ], 3));

        const mat = new THREE.LineBasicMaterial({
            color: 0xffff00,

        const line = new THREE.LineSegments(geom, mat);
        line.name = `edgeMarker_${edge.modelName}_${edge.index}`;

    function removeEdgeMarker(edge) {
        const name = `edgeMarker_${edge.modelName}_${edge.index}`;
        const m = scene.getObjectByName(name);

            m.geometry.dispose();

    // Handle triangle/point selection
    function performSelection(ev) {
        if (!loadedModels.length) return;

        if (document.pointerLockElement === renderer.domElement) {
            mouse.x = 0;
            mouse.y = 0;
        } else {
            const rect = renderer.domElement.getBoundingClientRect();
            const x = ev.clientX - rect.left;
            const y = ev.clientY - rect.top;
            mouse.x = (x / rect.width) * 2 - 1;
            mouse.y = -(y / rect.height) * 2 + 1;
        }

        raycaster.setFromCamera(mouse, camera);
        
        // ----- POINT SELECTION PASS -----
        // Collect every visible vertex of every model
        const pointHits = [];

        for (const m of loadedModels) {
            if (!m.mesh || !m.mesh.visible) continue;

            if (m.mesh.geometry === undefined)
                continue;
            const geom = m.mesh.geometry;
            const pos = geom.attributes.position;

            for (let i = 0; i < pos.count; i++) {
                const v = new THREE.Vector3().fromBufferAttribute(pos, i);
                const worldV = m.mesh.localToWorld(v);

                const dist = raycaster.ray.distanceToPoint(worldV);
                if (dist < 0.1) {   // clickable radius
                    pointHits.push({
                        modelName: m.mesh.name,
                        index: i,
                        pos: worldV
                    });
                }
            }
        }

        if (pointHits.length > 0) {
            const p = pointHits[0]; // nearest

            // If exists, unselect
            const idx = selectedPoints.findIndex(
                q => q.modelName === p.modelName && q.index === p.index
            );

            if (idx !== -1) {
                removePointMarker(selectedPoints[idx]);
                selectedPoints.splice(idx, 1);
            } else {
                if (!multiSelectCheckbox.checked)
                    clearSelection();
                selectedPoints.push(p);
                addPointMarker(p);
            }

            updateSelectionUI();
            return; // prevents triangle selection
        }
        // ----- END POINT PASS -----
        
        // ----- EDGE SELECTION PASS -----
        const edgeHits = [];
        const edgeThreshold = 0.08;

        for (const m of loadedModels) {
            if (!m.edges || !m.edges.visible) continue;

            const pos = m.edges.geometry.attributes.position;

            for (let i = 0; i < pos.count; i += 2) {
                const a = new THREE.Vector3().fromBufferAttribute(pos, i);
                const b = new THREE.Vector3().fromBufferAttribute(pos, i + 1);

                m.edges.localToWorld(a);
                m.edges.localToWorld(b);

                const dist = raycaster.ray.distanceSqToSegment(
                    a, b, null, null
                );

                if (dist < edgeThreshold * edgeThreshold) {
                    edgeHits.push({
                        modelName: m.edges.name || m.name,
                        index: i / 2,
                        a, b
                    });
                }
            }
        }

        if (edgeHits.length > 0) {
            const e = edgeHits[0];

            const idx = selectedEdges.findIndex(
                x => x.modelName === e.modelName && x.index === e.index
            );

            if (idx !== -1) {
                removeEdgeMarker(selectedEdges[idx]);
                selectedEdges.splice(idx, 1);
            } else {
                if (!multiSelectCheckbox.checked)
                    clearSelection();
                selectedEdges.push(e);
                addEdgeMarker(e);
            }

            updateSelectionUI();
            return;
        }
        // ----- END EDGE PASS -----
        
        const visibleMeshes = loadedModels
            .filter(m => m.mesh && m.mesh.visible)
            .map(m => m.mesh);

        const inter = raycaster.intersectObjects(visibleMeshes, true);
        if (inter.length === 0) {
            clearSelection();
            updateSelectionUI();
            return;
        }

        let hit = null;
        for (const i of inter) {
            if (i.face && i.object.visible) {
                hit = i;
                break;
            }
        }

        if (!hit) {
            clearSelection();
            updateSelectionUI();
            return;
        }

        const face = hit.face;
        const geom = hit.object.geometry;
        const pos = geom.attributes.position;
        const a = face.a, b = face.b, c = face.c;
        const va = new THREE.Vector3().fromBufferAttribute(pos, a);
        const vb = new THREE.Vector3().fromBufferAttribute(pos, b);
        const vc = new THREE.Vector3().fromBufferAttribute(pos, c);

        const triIndex = Math.floor(hit.faceIndex);

        // Retrieve metadata stored on the mesh
        let meta = null;
        if (hit.object.userData.triangles && hit.object.userData.triangles[triIndex]) {
            meta = hit.object.userData.triangles[triIndex];
        }

        const newTri = {
            index: triIndex,
            verts: [va, vb, vc],
            modelName: hit.object.name,

            // include metadata if available:
            normals: meta ? meta.normals : null,
            dist: meta ? meta.d : null,
            xpFlags: meta ? meta.xpFlags : null,
            flags: meta ? meta.flags : null
        };

        // Check if triangle is already selected (match by index + modelName)
        const existingIndex = selectedTriangles.findIndex(
            t => t.index === newTri.index && t.modelName === newTri.modelName
        );

        if (existingIndex !== -1) {
            // It's already selected → remove it
            selectedTriangles.splice(existingIndex, 1);
            updateSelectionUI();
            removeSelectionMarker(newTri);
            return;
        }

        // If single-select mode is active, clear previous selections
        if (!multiSelectCheckbox.checked) {
            clearSelection();
        }

        selectedTriangles.push(newTri);
        addSelectionMarker(newTri);
        updateSelectionUI();
            
        const sample_tri = [{
            vtxs: [
                va,
                vb,
                vc
            ],
            normals: meta ? meta.normals : null,
            d: meta ? meta.d : null,
            xpFlags: meta ? meta.xpFlags : null,
            flags: meta ? meta.flags : null
        }];
        
        if ((game == "OOT" || game == "MM" || game == "OOT3D" || game == "MM3D") && samplePointsEnabled && meta) {
            // --- AUTO-DELETE OLD POINTS MODEL ---
            const existing = loadedModels.find(m => m.name === "Points");
            if (existing) {
                // Find the UI container for this model and click its delete button.
                const section = document.querySelector('.controls');
                const children = Array.from(section.children);

                for (const child of children) {
                    if (child.dataset && child.dataset.modelName === "Points") {
                        const delBtn = child.querySelector('.delete-btn');
                        if (delBtn) delBtn.click();
                        break;
                    }
                }
            }
            
            if(sample_tri[0].normals[1] > f32(0.0) && !isZero(sample_tri[0].normals[1]))
                drawSampledTriangles(scene, sample_tri, sampledStandableFootprint, Number(samplePointsResolution.value))
        }
    }

    function createFlatGroundMarker(verts) {
        const geom = new THREE.BufferGeometry();
        const arr = new Float32Array([
            verts[0].x, verts[0].y, verts[0].z,
            verts[1].x, verts[1].y, verts[1].z,
            verts[2].x, verts[2].y, verts[2].z
        ]);
        geom.setAttribute("position", new THREE.BufferAttribute(arr, 3));
        geom.setIndex([0, 1, 2]);

        const mat = new THREE.MeshBasicMaterial({
            color: flatGroundColor,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.9,
            polygonOffset: true,
            polygonOffsetFactor: -1,
            polygonOffsetUnits: -1
        });

        // --- mesh ---
        const mesh = new THREE.Mesh(geom, mat);
        mesh.renderOrder = 1;    // ensures edges draw on top
        scene.add(mesh);
        flatGroundMarkers.push(mesh);

        // -------------------------------------
        // Add always-visible edges (same as SNM)
        // -------------------------------------
        const edgeGeom = new THREE.BufferGeometry();
        edgeGeom.setAttribute(
            "position",
            new THREE.Float32BufferAttribute([
                // edge AB
                verts[0].x, verts[0].y, verts[0].z,
                verts[1].x, verts[1].y, verts[1].z,
                // edge BC
                verts[1].x, verts[1].y, verts[1].z,
                verts[2].x, verts[2].y, verts[2].z,
                // edge CA
                verts[2].x, verts[2].y, verts[2].z,
                verts[0].x, verts[0].y, verts[0].z
            ], 3)
        );

        const edgeMat = new THREE.LineBasicMaterial({
            color: 0x000000,  // black edges (clear visibility)
            transparent: false,
            linewidth: 1.5
        });

        const edges = new THREE.LineSegments(edgeGeom, edgeMat);
        edges.renderOrder = 999; // draw edges last
        scene.add(edges);

        // store edges so they can be cleaned later
        flatGroundMarkers.push(edges);
    }

    function scanAndBuildFlatGroundMarkers() {
        clearFlatGroundMarkers();
        if (!flatGroundEnabled) return;

        // Find Main Model
        const mainModel = loadedModels.find(m => m.name === "Main Model");
        if (!mainModel || !mainModel.mesh) return;

        const mesh = mainModel.mesh;
        const triData = mesh.userData.triangles;
        if (!triData || triData.length === 0) return;

        const geom = mesh.geometry;
        const pos = geom.attributes.position;
        const index = geom.index;

        // Each triData[i] corresponds to triangle i in the index buffer
        for (let i = 0; i < triData.length; i++) {

            // Pull real vertex indices from geometry
            const ia = index.getX(i*3);
            const ib = index.getX(i*3 + 1);
            const ic = index.getX(i*3 + 2);

            const va = new THREE.Vector3().fromBufferAttribute(pos, ia);
            const vb = new THREE.Vector3().fromBufferAttribute(pos, ib);
            const vc = new THREE.Vector3().fromBufferAttribute(pos, ic);

            // Test: are all Y equal?
            if (va.y !== vb.y || vb.y !== vc.y) continue;

            const y = Math.round(va.y);
            if (!flat_ground_clip_y_table.has(y)) continue;

            // Need to confirm upward-facing
            const edge1 = new THREE.Vector3().subVectors(vb, va);
            const edge2 = new THREE.Vector3().subVectors(vc, va);
            const normal = new THREE.Vector3().crossVectors(edge1, edge2).normalize();

            if (normal.y <= 0) continue;

            // This triangle is valid
            createFlatGroundMarker([va, vb, vc]);
        }
    }

      last = now;
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.0));

      if(controlMode !== 'orbit' && document.pointerLockElement === renderer.domElement){
        // Apply WASD movement in pointer-lock mode
        const dir = new THREE.Vector3();

        if(move.back) dir.z += 1;
        if(move.left) dir.x -= 1;
        if(move.right) dir.x += 1;
        if(move.up) dir.y += 1;
        if(move.down) dir.y -= 1;
        if(dir.lengthSq()>0){
          dir.normalize();
          const worldDir = dir.applyQuaternion(camera.quaternion).multiplyScalar(speed*dt);
          pointerControls.getObject().position.add(worldDir);
          camera.position.copy(pointerControls.getObject().position);

      // Update orbit controls if active
      if(orbitControls) orbitControls.update();

      // update edges transformation if any
      if(edges && mesh){ edges.position.copy(mesh.position); edges.rotation.copy(mesh.rotation); }

      renderer.render(scene,camera);

    ////////////////////////////////////////
    // System: Polygon Standable Surface Debugger
    ////////////////////////////////////////
    
    // ------------------------
    // Helper Functions
    // ------------------------

    function f32(v) { return Math.fround(v); }
    function isZero(f) { return Math.abs(f) < EPS; }

    // Distance squared from point (x0,z0) to segment (x1,z1)-(x2,z2)
    function pointDistSqToLine2D(z, x, z0, x0, z1, x1) {
        const dz = z1 - z0;
        const dx = x1 - x0;

        const lenSq = dz*dz + dx*dx;
        if (lenSq === 0) return { hit: false, d2: 0 };

        const t = ((z - z0) * dz + (x - x0) * dx) / lenSq;
        if (t < 0 || t > 1) return { hit: false, d2: 0 };

        const projZ = z0 + t * dz;
        const projX = x0 + t * dx;

        const dZ = projZ - z;
        const dX = projX - x;

        return { hit: true, d2: dZ*dZ + dX*dX };
    }

    // Cir-square vs tri-square
    function cirSquareVsTriSquare(x0,y0, x1,y1, x2,y2, cx,cy, r) {
        x0 = Math.fround(x0); 
        x1 = Math.fround(x1); 
        x2 = Math.fround(x2);
        y0 = Math.fround(y0);
        y1 = Math.fround(y1);
        y2 = Math.fround(y2);
        cx = Math.fround(cx);
        cy = Math.fround(cy);
        r  = Math.fround(r);

        let minX = Math.fround(x0);
        let maxX = Math.fround(x0);
        let minY = Math.fround(y0);
        let maxY = Math.fround(y0);

        if (x1 < minX) minX = Math.fround(x1); else if (maxX < x1) maxX = Math.fround(x1);
        if (y1 < minY) minY = Math.fround(y1); else if (maxY < y1) maxY = Math.fround(y1);

        if (x2 < minX) minX = Math.fround(x2); else if (maxX < x2) maxX = Math.fround(x2);
        if (y2 < minY) minY = Math.fround(y2); else if (maxY < y2) maxY = Math.fround(y2);

        return (Math.fround(minX - r) <= cx &&
                Math.fround(maxX + r) >= cx &&
                Math.fround(minY - r) <= cy &&
                Math.fround(maxY + r) >= cy);
    }
    
    // z,x order matches OoT exactly
    function triChkPointParaYImpl(v0, v1, v2, z, x, detMax, chkDist, ny) {
    
        //if (x > 842.25 && x < 842.35 && z > -2139.45 && z < -2139.35)
        //    console.log("test");
    
        if (isZero(ny)) {
            return false;
        }
    
        // ---- Cir-Square vs Tri-Square ----
        if (!cirSquareVsTriSquare(
            v0.z, v0.x,
            v1.z, v1.x,
            v2.z, v2.x,
            z, x,
            chkDist
        )) {
            return false;
        }

        const chkDistSq = chkDist * chkDist;

        // ---- Vertex distance check ----
        if (((v0.z - z) ** 2 + (v0.x - x) ** 2) < chkDistSq ||
            ((v1.z - z) ** 2 + (v1.x - x) ** 2) < chkDistSq ||
            ((v2.z - z) ** 2 + (v2.x - x) ** 2) < chkDistSq) {

            return true;
        }

        // ---- Determinant checks ----
        const detv0v1 = ((v0.z - z) * (v1.x - x)) - ((v0.x - x) * (v1.z - z));
        const detv1v2 = ((v1.z - z) * (v2.x - x)) - ((v1.x - x) * (v2.z - z));
        const detv2v0 = ((v2.z - z) * (v0.x - x)) - ((v2.x - x) * (v0.z - z));

        // Same logic as the real game: inside if all ≤ detMax OR all ≥ -detMax
        if (detMax >= detv0v1 && detMax >= detv1v2 && detMax >= detv2v0) return true;
        if (-detMax <= detv0v1 && -detMax <= detv1v2 && -detMax <= detv2v0) return true;

        // ---- Edge distance expansion for steep triangles ----
        if (Math.abs(ny) > 0.5) {

            // PointDistSqToLine2D matches Math3D_PointDistSqToLine2D
            let L;

            L = pointDistSqToLine2D(z, x, v0.z, v0.x, v1.z, v1.x);
            if (L.hit && L.d2 < chkDistSq) return true;

            L = pointDistSqToLine2D(z, x, v1.z, v1.x, v2.z, v2.x);
            if (L.hit && L.d2 < chkDistSq) return true;

            L = pointDistSqToLine2D(z, x, v2.z, v2.x, v0.z, v0.x);
            if (L.hit && L.d2 < chkDistSq) return true;
        }

        return false;
    }

    // Compute Y from plane
    function computeYFromPlane(nx,ny,nz,d,x,z) {
        if (isZero(ny)) return 0;
        //return f32((-(nx*x + nz*z) - d)/ny);
        return (f32)((((-nx * x) - (nz * z)) - d) / ny);
    }

    function sampledStandableFootprint(tri, resolution=0.25) {
        const v0 = tri.vtxs[0], v1 = tri.vtxs[1], v2 = tri.vtxs[2];
        const nx = tri.normals[0] * COLPOLY_NORMAL_FRAC;
        const ny = tri.normals[1] * COLPOLY_NORMAL_FRAC;
        const nz = tri.normals[2] * COLPOLY_NORMAL_FRAC;
        const d = tri.d;
        const chkDist = 1.0;

        // Compute bounds
        const xs = [v0.x, v1.x, v2.x], zs = [v0.z, v1.z, v2.z];
        const minX = Math.min(...xs) - chkDist, maxX = Math.max(...xs) + chkDist;
        const minZ = Math.min(...zs) - chkDist, maxZ = Math.max(...zs) + chkDist;

        const result = [];
        let total = Math.ceil((maxX - minX) / resolution) * Math.ceil((maxZ - minZ) / resolution);
        let count = 0;

        for (let x = minX; x <= maxX; x += resolution) {
            x = f32(x);
            for (let z = minZ; z <= maxZ; z += resolution) {
                z = f32(z);
                count++;
                if (count % Math.floor(total / 100) === 0) console.log("Sampling progress: " + Math.floor(count / total * 100) + "%");

                if (!triChkPointParaYImpl(v0, v1, v2, z, x, 0.0, chkDist, ny)) {
                    continue;
                }

                const y = computeYFromPlane(nx, ny, nz, d, x, z);

                // --- Vertex-Y early out ---
                const minVertexY = Math.min(v0.y, v1.y, v2.y);
                if (y < minVertexY) continue;

                result.push({x: f32(x), z: f32(z), y});
            }
        }

        console.log("Sampling complete: 100%");
        /*console.log(result)
        
        function jsonToCsv(arr) {
            if (!arr.length) return "";

            const headers = Object.keys(arr[0]);
            const rows = arr.map(obj =>
                headers.map(h => JSON.stringify(obj[h] ?? "")).join(",")
            );

            return headers.join(",") + "\n" + rows.join("\n");
        }

        console.log(jsonToCsv(result));*/
        
        return result;
    }
    
    function drawSampledTriangles(scene, allTriangleData, sampleFunc, sampleStep = 0.1) {
        // First, count total number of points
        let totalPoints = 0;
        allTriangleData.forEach(tri => {
            totalPoints += sampleFunc(tri, sampleStep).length;
        });

        // Pre-allocate Float32Array
        const vertices = new Float32Array(totalPoints * 3);
        let offset = 0;

        // Fill vertices
        let count = 0
        allTriangleData.forEach(tri => {
            const points = sampleFunc(tri, sampleStep);
            points.forEach(p => {
                vertices[offset++] = Math.fround(p.x);
                vertices[offset++] = Math.fround(p.y);
                vertices[offset++] = Math.fround(p.z);
            });
            count += 1;
            console.log("completed "+count+"/"+allTriangleData.length)
        });

        // Build BufferGeometry
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));

        // Single Points object
        const material = new THREE.PointsMaterial({ color: 0xff0000, size: 0.5 });
        const pts = new THREE.Points(geometry, material);

        scene.add(pts);
        
        loadedModels.push({ name: "Points", mesh: pts, edges: null });

        // Register in UI
        addModelCheckbox("Points", pts, null, false, true, "#ff0000", true);
        
        return pts;
    }

	// Exact target normal in 16-bit OoT format
	const TARGET_NORMAL = { x: 0, y: 32766, z: 0 };
