	// Renders all polygons as a single Three.js Points object (or LineLoop for analytic)
	function renderAllStandablePolygons(scene, allTriangleData, useSampled=true, resolution=0.25) {
		const points = [];

		// Loop through all polygons
		allTriangleData.forEach(tri => {
			let polyPoints;
			if (useSampled) {
				polyPoints = sampledStandableFootprint(tri, resolution);
			} else {
				polyPoints = analyticStandableFootprint(tri);
			}
			points.push(...polyPoints);
		});

		// Create single geometry
		const geometry = new THREE.BufferGeometry();
		const vertices = [];
		points.forEach(p => vertices.push(p.x, p.y, p.z));
		geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));

		// Choose material: points for sampled, line for analytic
		let object3D;
		if (useSampled) {
			const material = new THREE.PointsMaterial({ color: 0xff0000, size: 0.5 });
			object3D = new THREE.Points(geometry, material);
		} else {
			const material = new THREE.LineBasicMaterial({ color: 0x0000ff });
			object3D = new THREE.LineSegments(geometry, material);
		}

		scene.add(object3D);
		return object3D;
	}
	
	function triangulateAllPolygons(scene, allTriangleData) {
		const vertices = [];
		const indices = [];
		let indexOffset = 0;

		allTriangleData.forEach(tri => {
			// Analytic footprint (polygon with offsets)
			const footprint = analyticStandableFootprint(tri, 1.0);

			// Flatten X/Z for Earcut
			const flatXY = [];
			footprint.forEach(p => flatXY.push(p.x, p.z));

			// Triangulate
			const flatPoints = footprint.map(p => new THREE.Vector2(p.x, p.z));
			const holes = []; // no holes
			const tris = THREE.ShapeUtils.triangulateShape(flatPoints, holes);

			// Push vertices (X,Y,Z)
			footprint.forEach(p => vertices.push(p.x, p.y, p.z));

			// Push indices, offsetting by current vertex count
			tris.forEach(i => indices.push(i + indexOffset));

			indexOffset += footprint.length;
		});

		// Build geometry
		const geometry = new THREE.BufferGeometry();
		geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
		geometry.setIndex(indices);
		geometry.computeVertexNormals();

		// Material
		const material = new THREE.MeshStandardMaterial({
			color: 0x00ff00,
			side: THREE.DoubleSide,
			flatShading: true
		});

		const mesh = new THREE.Mesh(geometry, material);
		scene.add(mesh);
		return mesh;
	}
	

	/**
	 * Render all standable surfaces as a single mesh using sampled points and Delaunay triangulation.
	 * @param {THREE.Scene} scene
	 * @param {Array} allTriangleData - array of polygons {vtxs:[Vector3,Vector3,Vector3], normals:[nx,ny,nz], d:dist}
	 * @param {Number} resolution - sampling resolution
	 * @returns {THREE.Mesh}
	 */
	function renderSampledMesh(scene, allTriangleData, resolution=0.25) {
		const allPoints = [];

		// Sample each polygon
		allTriangleData.forEach(tri => {
			const sampled = sampledStandableFootprint(tri, resolution);
			allPoints.push(...sampled);
		});

		if (allPoints.length < 3) {
			console.warn("Not enough points to form a mesh");
			return null;
		}

		// Flatten X/Z for Delaunay
		const points2D = allPoints.map(p => [p.x, p.z]);

		// Delaunay triangulation
		const delaunay = d3.Delaunay.from(points2D);
		const triangles = delaunay.triangles; // flat array of indices

		// Build Three.js geometry
		const geometry = new THREE.BufferGeometry();
		const vertices = [];
		allPoints.forEach(p => vertices.push(p.x, p.y, p.z));
		geometry.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
		geometry.setIndex(Array.from(triangles));
		geometry.computeVertexNormals();

		// Material
		const material = new THREE.MeshStandardMaterial({
			color: 0x00ff00,
			side: THREE.DoubleSide,
			flatShading: true
		});

		const mesh = new THREE.Mesh(geometry, material);
		scene.add(mesh);
		return mesh;
	}
	
	function renderTriangulatedSampledPolygons(scene, allTriangleData, resolution=0.25) {
		const meshes = [];

		allTriangleData.forEach(tri => {
			// 1️⃣ Sample points for this polygon
			const sampled = sampledStandableFootprint(tri, resolution);
			if (sampled.length < 3) return;

			// 2️⃣ Flatten to X/Z plane for Delaunay
			const points2D = sampled.map(p => [p.x, p.z]);

			// 3️⃣ Delaunay triangulation
			const delaunay = d3.Delaunay.from(points2D);
			const triangles = delaunay.triangles;

			// 4️⃣ Build Three.js geometry
			const geometry = new THREE.BufferGeometry();
			const vertices = [];
			sampled.forEach(p => vertices.push(p.x, p.y, p.z));
			geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
			geometry.setIndex(Array.from(triangles));
			geometry.computeVertexNormals();

			// 5️⃣ Material
			const material = new THREE.MeshStandardMaterial({
				color: 0x00ff00,
				side: THREE.DoubleSide,
				flatShading: true
			});

			const mesh = new THREE.Mesh(geometry, material);
			scene.add(mesh);
			meshes.push(mesh);
		});

		return meshes; // array of meshes, one per polygon
	}
	
	function renderSampledMeshMerged(scene, allTriangleData, resolution = 0.25) {
		const finalVertices = [];
		const finalIndices = [];
		let vertexOffset = 0;

		allTriangleData.forEach(tri => {
			const sampled = sampledStandableFootprint(tri, resolution);
			if (sampled.length < 3) return;

			// Build grid map to triangulate only actual sampled points
			const grid = new Map();
			sampled.forEach(p => {
				const key = `${Math.round(p.x / resolution)},${Math.round(p.z / resolution)}`;
				grid.set(key, p);
			});

			const pointIndices = new Map(); // key -> local vertex index
			let localIdx = 0;

			sampled.forEach(p => {
				const key = `${Math.round(p.x / resolution)},${Math.round(p.z / resolution)}`;
				if (!pointIndices.has(key)) {
					pointIndices.set(key, localIdx++);
					finalVertices.push(p.x, p.y, p.z);
				}
			});

			// Triangulate this polygon using grid adjacency
			grid.forEach((p, key) => {
				const [gx, gz] = key.split(',').map(Number);
				const neighbors = [
					[gx + 1, gz],
					[gx, gz + 1],
					[gx + 1, gz + 1]
				];

				const keys = neighbors.map(n => `${n[0]},${n[1]}`);
				if (keys.every(k => grid.has(k))) {
					const i0 = pointIndices.get(key) + vertexOffset;
					const i1 = pointIndices.get(keys[0]) + vertexOffset;
					const i2 = pointIndices.get(keys[1]) + vertexOffset;
					const i3 = pointIndices.get(keys[2]) + vertexOffset;

					finalIndices.push(i0, i1, i2); // triangle 1
					finalIndices.push(i1, i3, i2); // triangle 2
				}
			});

			vertexOffset = finalVertices.length / 3; // update offset for next polygon
		});

		const geometry = new THREE.BufferGeometry();
		geometry.setAttribute('position', new THREE.Float32BufferAttribute(finalVertices, 3));
		geometry.setIndex(finalIndices);
		geometry.computeVertexNormals();

		const material = new THREE.MeshStandardMaterial({
			color: 0x00ff00,
			side: THREE.DoubleSide,
			flatShading: true
		});

		const mesh = new THREE.Mesh(geometry, material);
		scene.add(mesh);
		return mesh;
	}
	
	function meshFromSampledPoints(scene, sampled, resolution=0.5) {
		const vertices = [];
		const indices = [];
		const grid = new Map();
		
		// Build grid map: key = rounded X/Z
		sampled.forEach(p => {
			const key = `${Math.round(p.x/resolution)},${Math.round(p.z/resolution)}`;
			grid.set(key, p);
		});
		
		const pointIndices = new Map();
		let idx = 0;
		grid.forEach((p,key)=>{
			vertices.push(p.x,p.y,p.z);
			pointIndices.set(key, idx++);
		});

		// Make triangles from neighboring points
		grid.forEach((p,key)=>{
			const [gx,gz] = key.split(',').map(Number);
			const neighbors = [
				[gx+1,gz],
				[gx,gz+1],
				[gx+1,gz+1]
			];
			const keys = neighbors.map(n=>`${n[0]},${n[1]}`);
			if(keys.every(k=>grid.has(k))){
				const i0 = pointIndices.get(key);
				const i1 = pointIndices.get(keys[0]);
				const i2 = pointIndices.get(keys[1]);
				const i3 = pointIndices.get(keys[2]);
				indices.push(i0,i1,i2);
				indices.push(i1,i3,i2);
			}
		});

		const geometry = new THREE.BufferGeometry();
		geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices,3));
		geometry.setIndex(indices);
		geometry.computeVertexNormals();

		const material = new THREE.MeshStandardMaterial({
			color:0x00ff00,
			side:THREE.DoubleSide,
			flatShading:true
		});

		const mesh = new THREE.Mesh(geometry, material);
		scene.add(mesh);
		return mesh;
	}

	function renderCleanStandableMesh(scene, allTriangleData, resolution = 0.25) {
		const finalVertices = [];
		const finalIndices = [];
		let vertexOffset = 0;

		allTriangleData.forEach(tri => {
			// 1️⃣ Sample points
			const sampled = sampledStandableFootprint(tri, resolution);
			if (sampled.length < 3) return;

			// 2️⃣ Compute convex hull in X/Z
			const pts2D = sampled.map(p => new THREE.Vector2(p.x, p.z));
			const hull = getConvexHull2D(pts2D); // returns array of Vector2 points forming boundary

			// 3️⃣ Triangulate inside boundary
			const tris = THREE.ShapeUtils.triangulateShape(hull, []); // no holes

			// 4️⃣ Convert hull points to vertices with Y from nearest sampled point
			const hullVertices = hull.map(p2d => {
				let nearest = sampled[0];
				let minDist = (p2d.x - nearest.x)**2 + (p2d.y - nearest.z)**2;
				for (let pt of sampled) {
					const dist = (p2d.x - pt.x)**2 + (p2d.y - pt.z)**2;
					if (dist < minDist) {
						minDist = dist;
						nearest = pt;
					}
				}
				return new THREE.Vector3(p2d.x, nearest.y, p2d.y);
			});

			// 5️⃣ Add vertices to final array
			hullVertices.forEach(v => finalVertices.push(v.x, v.y, v.z));

			// 6️⃣ Add indices (adjusted by vertexOffset)
			tris.forEach(tri => {
				finalIndices.push(tri[0] + vertexOffset, tri[1] + vertexOffset, tri[2] + vertexOffset);
			});

			vertexOffset += hullVertices.length;
		});

		// 7️⃣ Build Three.js geometry
		const geometry = new THREE.BufferGeometry();
		geometry.setAttribute('position', new THREE.Float32BufferAttribute(finalVertices, 3));
		geometry.setIndex(finalIndices);
		geometry.computeVertexNormals();

		const material = new THREE.MeshStandardMaterial({
			color: 0x00ff00,
			side: THREE.DoubleSide,
			flatShading: true
		});

		const mesh = new THREE.Mesh(geometry, material);
		scene.add(mesh);
		return mesh;
	}

	/**
	 * Simple 2D convex hull (Graham scan) for X/Z plane
	 * Returns array of THREE.Vector2 in hull order
	 */
	function getConvexHull2D(points) {
		if (points.length < 3) return points.slice();

		// Sort points by X, then Z
		points = points.slice().sort((a,b)=>a.x !== b.x ? a.x-b.x : a.y-b.y);

		const lower = [];
		for (let p of points) {
			while (lower.length >= 2 && cross(lower[lower.length-2], lower[lower.length-1], p) <= 0) {
				lower.pop();
			}
			lower.push(p);
		}

		const upper = [];
		for (let i=points.length-1;i>=0;i--) {
			const p = points[i];
			while (upper.length >= 2 && cross(upper[upper.length-2], upper[upper.length-1], p) <= 0) {
				upper.pop();
			}
			upper.push(p);
		}

		// Concatenate lower and upper, remove last point of each (duplicate)
		lower.pop();
		upper.pop();
		return lower.concat(upper);

		function cross(a,b,c) {
			return (b.x - a.x)*(c.y - a.y) - (b.y - a.y)*(c.x - a.x);
		}
	}
	
	function renderGridMesh(scene, sampled, resolution=0.25) {
		const vertices = [];
		const indices = [];
		const grid = new Map(); // key = "gx,gz" -> point
		const pointIndices = new Map(); // key = vertex index

		// 1️⃣ Build grid map
		sampled.forEach(p => {
			const gx = Math.round(p.x / resolution);
			const gz = Math.round(p.z / resolution);
			const key = `${gx},${gz}`;
			grid.set(key, p);
		});

		// 2️⃣ Assign vertex indices
		let idx = 0;
		grid.forEach((p, key) => {
			vertices.push(p.x, p.y, p.z);
			pointIndices.set(key, idx++);
		});

		// 3️⃣ Generate triangles for each “quad” where all four points exist
		grid.forEach((p, key) => {
			const [gx, gz] = key.split(',').map(Number);

			const neighbors = [
				[gx + 1, gz],
				[gx, gz + 1],
				[gx + 1, gz + 1]
			];

			const neighborKeys = neighbors.map(n => `${n[0]},${n[1]}`);
			if (neighborKeys.every(k => grid.has(k))) {
				const i0 = pointIndices.get(key);
				const i1 = pointIndices.get(neighborKeys[0]);
				const i2 = pointIndices.get(neighborKeys[1]);
				const i3 = pointIndices.get(neighborKeys[2]);

				// two triangles per quad
				indices.push(i0, i1, i2);
				indices.push(i1, i3, i2);
			}
		});

		// 4️⃣ Build Three.js geometry
		const geometry = new THREE.BufferGeometry();
		geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
		geometry.setIndex(indices);
		geometry.computeVertexNormals();

		const material = new THREE.MeshStandardMaterial({
			color: 0x00ff00,
			side: THREE.DoubleSide,
			flatShading: true
		});

		const mesh = new THREE.Mesh(geometry, material);
		scene.add(mesh);
		return mesh;
	}
	
	function renderCleanNeighborMesh(scene, allTriangleData, resolution = 0.25) {
		const finalVertices = [];
		const finalIndices = [];
		let vertexOffset = 0;

		allTriangleData.forEach(tri => {
			const sampled = sampledStandableFootprint(tri, resolution);
			if (sampled.length < 3) return;

			// Map points to grid
			const grid = new Map(); // key -> sampled point
			const pointIndex = new Map(); // key -> local index
			let idx = 0;

			sampled.forEach(p => {
				const gx = Math.round(p.x / resolution);
				const gz = Math.round(p.z / resolution);
				const key = `${gx},${gz}`;
				if (!grid.has(key)) {
					grid.set(key, p);
					pointIndex.set(key, idx++);
					finalVertices.push(p.x, p.y, p.z);
				}
			});

			// Neighbor offsets for forming triangles
			const neighborOffsets = [
				[1,0],[0,1],[1,1],[-1,1]
			];

			// Form triangles only between neighbors
			grid.forEach((p, key) => {
				const [gx, gz] = key.split(',').map(Number);
				const i0 = pointIndex.get(key) + vertexOffset;

				neighborOffsets.forEach(([dx,dz])=>{
					const neighborKeys = [
						key,
						`${gx+dx},${gz}`,
						`${gx},${gz+dz}`,
						`${gx+dx},${gz+dz}`
					].filter(k => grid.has(k));

					if(neighborKeys.length >= 3){
						finalIndices.push(
							pointIndex.get(neighborKeys[0]) + vertexOffset,
							pointIndex.get(neighborKeys[1]) + vertexOffset,
							pointIndex.get(neighborKeys[2]) + vertexOffset
						);
						if(neighborKeys.length === 4){
							finalIndices.push(
								pointIndex.get(neighborKeys[0]) + vertexOffset,
								pointIndex.get(neighborKeys[2]) + vertexOffset,
								pointIndex.get(neighborKeys[3]) + vertexOffset
							);
						}
					}
				});
			});

			vertexOffset = finalVertices.length / 3;
		});

		// Build geometry
		const geometry = new THREE.BufferGeometry();
		geometry.setAttribute('position', new THREE.Float32BufferAttribute(finalVertices, 3));
		geometry.setIndex(finalIndices);
		geometry.computeVertexNormals();

		const material = new THREE.MeshStandardMaterial({
			color: 0x00ff00,
			side: THREE.DoubleSide,
			flatShading: true
		});

		const mesh = new THREE.Mesh(geometry, material);
		scene.add(mesh);
		return mesh;
	}
		
	function renderDistanceNeighborMesh(scene, allTriangleData, resolution = 0.25, neighborDistFactor = 1.5) {
		const finalVertices = [];
		const finalIndices = [];
		let vertexOffset = 0;

		allTriangleData.forEach(tri => {
			const sampled = sampledStandableFootprint(tri, resolution);
			if (sampled.length < 3) return;

			// Build vertices and vertex index map
			const vertexIndices = [];
			sampled.forEach(p => {
				finalVertices.push(p.x, p.y, p.z);
				vertexIndices.push(vertexOffset++);
			});

			// Build triangles based on neighbor distance
			const n = sampled.length;
			for (let i = 0; i < n; i++) {
				const p0 = sampled[i];
				for (let j = i + 1; j < n; j++) {
					const p1 = sampled[j];
					const dx01 = p0.x - p1.x;
					const dz01 = p0.z - p1.z;
					const dist01 = Math.sqrt(dx01*dx01 + dz01*dz01);

					if (dist01 > resolution * neighborDistFactor) continue;

					for (let k = j + 1; k < n; k++) {
						const p2 = sampled[k];
						const dx02 = p0.x - p2.x;
						const dz02 = p0.z - p2.z;
						const dist02 = Math.sqrt(dx02*dx02 + dz02*dz02);

						const dx12 = p1.x - p2.x;
						const dz12 = p1.z - p2.z;
						const dist12 = Math.sqrt(dx12*dx12 + dz12*dz12);

						// Only form triangle if all sides are within threshold
						if (dist02 <= resolution * neighborDistFactor && dist12 <= resolution * neighborDistFactor) {
							finalIndices.push(
								vertexIndices[i],
								vertexIndices[j],
								vertexIndices[k]
							);
						}
					}
				}
			}
		});

		// Build Three.js geometry
		const geometry = new THREE.BufferGeometry();
		geometry.setAttribute('position', new THREE.Float32BufferAttribute(finalVertices, 3));
		geometry.setIndex(finalIndices);
		geometry.computeVertexNormals();

		const material = new THREE.MeshStandardMaterial({
			color: 0x00ff00,
			side: THREE.DoubleSide,
			flatShading: true
		});

		const mesh = new THREE.Mesh(geometry, material);
		scene.add(mesh);
		return mesh;
	}
	
	function renderFastGridMesh(scene, allTriangleData, resolution=0.25) {
		const finalVertices = [];
		const finalIndices = [];
		let vertexOffset = 0;

		allTriangleData.forEach(tri => {
			const sampled = sampledStandableFootprint(tri, resolution);
			if (sampled.length < 3) return;

			const grid = new Map(); // key -> vertex index

			// 1️⃣ snap points to grid
			sampled.forEach(p => {
				const gx = Math.round(p.x / resolution);
				const gz = Math.round(p.z / resolution);
				const key = `${gx},${gz}`;
				if (!grid.has(key)) {
					grid.set(key, vertexOffset);
					finalVertices.push(p.x, p.y, p.z);
					vertexOffset++;
				}
			});

			// 2️⃣ neighbor offsets for triangles
			const neighborOffsets = [
				[1,0],[0,1],[1,1]
			];

			grid.forEach((idx, key) => {
				const [gx,gz] = key.split(',').map(Number);

				neighborOffsets.forEach(([dx,dz]) => {
					const k1 = `${gx+dx},${gz}`;
					const k2 = `${gx},${gz+dz}`;
					const k3 = `${gx+dx},${gz+dz}`;

					const neighbors = [k1,k2,k3].map(k => grid.get(k));
					if(neighbors.every(v => v !== undefined)){
						finalIndices.push(idx, neighbors[0], neighbors[1]);
						finalIndices.push(neighbors[0], neighbors[2], neighbors[1]);
					}
				});
			});
		});

		const geometry = new THREE.BufferGeometry();
		geometry.setAttribute('position', new THREE.Float32BufferAttribute(finalVertices,3));
		geometry.setIndex(finalIndices);
		geometry.computeVertexNormals();

		const material = new THREE.MeshStandardMaterial({
			color:0x00ff00,
			side:THREE.DoubleSide,
			flatShading:true
		});

		const mesh = new THREE.Mesh(geometry, material);
		scene.add(mesh);
		return mesh;
	}


	function renderStandableConcaveHull(scene, tri, sampleStep = 0.1, k = 10) {
		const f32 = Math.fround;
		const COLPOLY_NORMAL_FRAC = f32(1.0 / 32767.0);

		// -----------------------------
		// 1. Sample standable points
		// -----------------------------
		const points = sampledStandableFootprint2(tri, sampleStep);
		if (!points || points.length < 3) return null;

		// -----------------------------
		// 2. Compute concave hull in XZ
		// -----------------------------
		const outline = concaveHull(points, k);
		if (!outline || outline.length < 3) return null;

		// -----------------------------
		// 3. Build THREE.Shape for XZ plane
		// -----------------------------
		const shape = new THREE.Shape();
		shape.moveTo(outline[0].x, outline[0].z);
		for (let i = 1; i < outline.length; i++) {
			shape.lineTo(outline[i].x, outline[i].z);
		}
		shape.lineTo(outline[0].x, outline[0].z);

		// Triangulate into 2D polygon
		const geometry2D = new THREE.ShapeGeometry(shape);

		// -----------------------------
		// 4. Lift all vertices onto plane
		// -----------------------------
		const normals = tri.normals;
		const Nx = f32(normals[0] * COLPOLY_NORMAL_FRAC);
		const Ny = f32(normals[1] * COLPOLY_NORMAL_FRAC);
		const Nz = f32(normals[2] * COLPOLY_NORMAL_FRAC);
		const D  = f32(tri.d);

		function liftVertexXZ(x, z) {
			return f32(-(Nx*x + Nz*z + D) / Ny);
		}

		const pos = geometry2D.attributes.position;
		for (let i = 0; i < pos.count; i++) {
			const x = pos.getX(i);
			const z = pos.getY(i);
			const y = liftVertexXZ(x, z);

			pos.setXYZ(i, x, y, z);
		}
		pos.needsUpdate = true;

		geometry2D.computeVertexNormals();

		// -----------------------------
		// 5. Create mesh
		// -----------------------------
		const mesh = new THREE.Mesh(
			geometry2D,
			new THREE.MeshStandardMaterial({
				color: 0x00ff99,
				side: THREE.DoubleSide,
				flatShading: true
			})
		);

		// optional edges for debugging
		const edges = new THREE.LineSegments(
			new THREE.EdgesGeometry(geometry2D),
			new THREE.LineBasicMaterial({ color: 0x000000 })
		);

		const group = new THREE.Group();
		group.add(mesh);
		group.add(edges);
		scene.add(group);

		return group;
	}

	function dist2(a, b) {
		const dx = a.x - b.x;
		const dz = a.z - b.z;
		return dx*dx + dz*dz;
	}

	function segmentsIntersect(A, B, C, D) {
		function ccw(a, b, c) {
			return (c.z - a.z) * (b.x - a.x) > (b.z - a.z) * (c.x - a.x);
		}
		return (ccw(A, C, D) !== ccw(B, C, D)) && (ccw(A, B, C) !== ccw(A, B, D));
	}

	function concaveHull(points, k = 8) {
		if (points.length < 4) return points;
		points = points.slice();
		points.sort((a,b)=>a.x - b.x);

		const hull = [points.shift()];
		let current = hull[0];
		let previousAngle = Math.PI;

		while(true) {
			const neighbors = points
				.map(p => ({ p, d: dist2(current, p) }))
				.sort((a,b)=>a.d - b.d)
				.slice(0, k)
				.map(o => o.p);

			let best = null;
			let bestAngle = Infinity;

			for (const n of neighbors) {
				const angle = Math.atan2(n.z - current.z, n.x - current.x);
				let dAngle = previousAngle - angle;
				if (dAngle <= 0) dAngle += Math.PI * 2;
				if (dAngle < bestAngle) {
					bestAngle = dAngle;
					best = n;
				}
			}

			if (!best) break;

			const A = current;
			const B = best;

			let intersects = false;
			for (let i = 1; i < hull.length - 1; i++) {
				const C = hull[i-1], D = hull[i];
				if (segmentsIntersect(A,B,C,D)) {
					intersects = true;
					break;
				}
			}

			if (intersects) {
				k++;
				if (k > points.length) break;
				continue;
			}

			hull.push(best);
			points = points.filter(p => p !== best);

			previousAngle = Math.atan2(best.z - current.z, best.x - current.x);
			current = best;

			if (dist2(current, hull[0]) < 0.0001) break;
		}

		return hull;
	}
