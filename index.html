<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>3D Model Viewer</title>
  <style>
    :root{--sidebar-w:320px}
    html,body{height:100%;margin:0;font-family:Inter,Segoe UI,Roboto,Helvetica,Arial}
    #app{display:flex;height:100vh;overflow:hidden}
    #canvas-wrap{flex:1;position:relative;background:#111}
    canvas{display:block;width:100%;height:100%}
    #sidebar{width:var(--sidebar-w);background:#0f1720;color:#e6eef6;padding:12px;box-sizing:border-box;overflow:auto}
    h2{margin:4px 0 10px;font-size:16px}
    h3 {margin: 4px 0;padding: 0}
    label{display:block;margin-top:8px;font-size:13px}
    .row{display:flex;gap:8px;align-items:center}
    input[type=range]{width:100%}
    select, button{margin-top:8px;padding:8px;border-radius:6px;border:none;background:#2563eb;color:white;cursor:pointer}
    .muted{color:#9fb0c8;font-size:13px}
    .info{background:#071624;padding:8px;border-radius:6px;margin-top:8px;font-family:monospace;font-size:13px}
    .controls{margin-top:6px}
    .section{margin-bottom:12px}
    .select-info{background:#071624;padding:2px;border-radius:6px;font-size:13px}
    a.download-link{color:#9fe7ff;display:inline-block;margin-top:6px}
    .footer{margin-top:12px;font-size:12px;color:#9fb0c8}
    .sel-verts{overflow-wrap: anywhere;}
    #status{margin-top:8px;padding:8px;border-radius:6px;background:#221a11;color:#ffd;}
    #crosshair {position: absolute;left: 50%;top: 50%;width: 16px;height: 16px;margin-left: -8px;margin-top: -8px;pointer-events: none;z-index: 10;}
    #crosshair::before, #crosshair::after {content: '';position: absolute;background: white;}
    #crosshair::before {left: 7px;top: 0;width: 2px;height: 16px;}
    #crosshair::after {top: 7px;left: 0;width: 16px;height: 2px;}
    #mapDropdown {min-width: 200px;max-width: 250px;box-sizing: border-box;}
    #file {border-radius: 6px;padding-top: 8px;font-family: monospace;font-size: 13px;}
    #file::file-selector-button {background-color: #2564eb; /* button background */color: #fff; /* button text */border: none;border-radius: 4px;padding: 6px 10px;margin-right: 8px;cursor: pointer;transition: background-color 0.2s ease;}
    #selectionListEl {background-color: #1e1e1e;color: #efefef;border: 1px solid #555;border-radius: 6px;padding: 6px;font-family: monospace;font-size: 13px;resize: vertical;width: 100%;box-sizing: border-box;margin-top: 6px;margin-bottom: 8px;}
  </style>

</head>

    </div>

    <div id="sidebar">
      <h2>3D Model Viewer</h2>

      <div class="section">
        <!--<div class="muted">Game:</div>-->
        <select id="selected-game">
            <option value="BK">Banjo-Kazooie</option>
            <option value="BT">Banjo-Tooie</option>

        </select>
        <select id="mapDropdown"></select>
        <!--<label>Load model file (binary or text). Supported binary format:

        <button id="loadMap">Load Map</button>
        <input id="file" type="file" accept="*/*" />

            mapDropdown.appendChild(option);
          });
		  
		  EPS = 0.008;
      }

            option.value = map.name; // This will be the value when selected

            mapDropdown.appendChild(option);

		  EPS = 0.008;

            option.value = map.name; // This will be the value when selected
            option.textContent = map.name; // This is what’s shown to the user
            mapDropdown.appendChild(option);

    ////////////////////////////////////////

    ////////////////////////////////////////

    // Load selected map

                const buffer1 = await res1.arrayBuffer();
                console.log(mapFilename+": Binary file length:", buffer1.byteLength);
                parseBKModelBinary(buffer1, true);

				if (mapFilename2 === undefined) {

                if (game == "OOT" || game == "MM" || game == "OOT3D" || game == "MM3D") {
                    let mapFilename2 = getSeamsFileName(game, mapName);
					if (mapFilename2 === undefined) {
					
					}
                    else {
						let seams_path = "seams";

						if ((game == "OOT3D" || game == "MM3D") && false)

    ////////////////////////////////////////
    // System: File input (user-supplied file)
    ////////////////////////////////////////

    // File parsing
    fileInput.addEventListener('change', async (ev)=>{
      const f = ev.target.files[0];
      if(!f) return;
      const buf = await f.arrayBuffer();
      parseModel(buf);
    });
    
    ////////////////////////////////////////
    // System: Model Parsing (text vs binary dispatch)
    ////////////////////////////////////////

    // Detect binary vs text simple heuristic
    function parseModel(buffer){
      if(typeof buffer === 'string') { parseInvisibleSeams1D(buffer); return; }
      const uint8 = new Uint8Array(buffer);
      let isText = true;
      for(let i=0;i<Math.min(64,uint8.length);i++){
        const c = uint8[i];
        if(c===9||c===10||c===13) continue;
        if(c<32 || c>126){ isText=false; break; }
      }
      if(isText && (game == "OOT" || game == "MM")) parseZeldaModelTextTriangles(new TextDecoder().decode(buffer), true);
      else if(isText) parseInvisibleSeams1D(new TextDecoder().decode(buffer));
      else {
        if(game == "BK" || game == "BT")
            parseBKModelBinary(buffer, true);
        else if (game == "OOT" || game == "MM" || game == "OOT3D" || game == "MM3D")
            parseZeldaModelBinary(buffer, true);
        else
            parseModelBinary(buffer);
      }
    }

    // Text format: lines with "v x y z" and "f i j k" (1-based or 0-based)
    function parseModelText(text){
      const lines = text.split(/\r?\n/).map(s=>s.trim()).filter(s=>s&&s[0]!="#");
      const verts = [];
      const tris = [];
      for(const l of lines){
        const parts = l.split(/\s+/);
        if(parts[0].toLowerCase()==='v' && parts.length>=4){
          verts.push( [parseInt(parts[1],10),parseInt(parts[2],10),parseInt(parts[3],10)] );
        } else if((parts[0].toLowerCase()==='f'||parts[0].toLowerCase()==='t') && parts.length>=4){
          const a = parseInt(parts[1],10);
          const b = parseInt(parts[2],10);
          const c = parseInt(parts[3],10);
          tris.push([a,b,c]);
        }
      }
      if(verts.length>0 && tris.length>0){
        const allIdx = [].concat(...tris);
        const maxIdx = Math.max(...allIdx);
        const minIdx = Math.min(...allIdx);
        if(minIdx>=1 && maxIdx<=verts.length) {
          for(let i=0;i<tris.length;i++) tris[i]=tris[i].map(x=>x-1);
        }
      }
      buildGeometry(verts, tris, `Main Model`, true);
    }

    // Binary format: [uint16 vertexCount][uint16 triCount] then vertexCount*(int16 x,y,z) then triCount*(uint16 a,b,c)
    function parseModelBinary(buffer){
      const dv = new DataView(buffer);
      if(dv.byteLength<4){ alert('binary too small'); return; }
      let offset = 0;
      const vertexCount = dv.getUint16(offset,true); offset+=2;
      const triCount = dv.getUint16(offset,true); offset+=2;
      const verts = [];
      for(let i=0;i<vertexCount;i++){
        if(offset+6>dv.byteLength) break;
        const x = dv.getInt16(offset,true); offset+=2;
        const y = dv.getInt16(offset,true); offset+=2;
        const z = dv.getInt16(offset,true); offset+=2;
        verts.push([x,y,z]);
      }
      //console.log(verts)
      const tris = [];
      for(let i=0;i<triCount;i++){
        if(offset+6>dv.byteLength) break;
        const a = dv.getUint16(offset,true); offset+=2;
        const b = dv.getUint16(offset,true); offset+=2;
        const c = dv.getUint16(offset,true); offset+=2;
        tris.push([a,b,c]);
      }
      //console.log(tris)
      const allIdx = [].concat(...tris);
      const maxIdx = Math.max(...allIdx);
      const minIdx = Math.min(...allIdx);
      if(minIdx>=1 && maxIdx<=verts.length) {
        for(let i=0;i<tris.length;i++) tris[i]=tris[i].map(x=>x-1);
      }
      buildGeometry(verts, tris, `Main Model`, true);
    }
    
    function parseBKModelBinary(buffer, fresh){
      const dv = new DataView(buffer);
      if (dv.byteLength < 4) {
        alert('binary too small');
        return;
      }

      let vtx_list_offset = dv.getUint32(0x10, false);
      //console.log("vtx_list_offset is " + vtx_list_offset.toString(16));

      // original vertexCount is ignored now
      // const vertexCount = dv.getInt16(vtx_list_offset + 0x14, false);
      // console.log("vertexCount is " + vertexCount.toString(16));

      let offset = vtx_list_offset + 0x18;

      const verts = [];
      while (offset + 0x10 <= dv.byteLength) {
        const x = dv.getInt16(offset, false); offset += 2;
        const y = dv.getInt16(offset, false); offset += 2;
        const z = dv.getInt16(offset, false); offset += 2;

        // skip the remaining 10 bytes of this vertex record
        offset += 10;

        verts.push([x, y, z]);
      }

      //console.log(verts);
      
      let collision_list_offset = dv.getUint32(0x1C,false);
      //console.log("collision_list_offset is "+collision_list_offset.toString(16))
      const geoCount = dv.getInt16(collision_list_offset+0x10,false);

      const triCount = dv.getInt16(collision_list_offset+0x14,false);
      //console.log("triCount is "+triCount.toString(16))
      
      
      offset = collision_list_offset + 0x18 + geoCount * 4;
      //console.log("startTriList is "+offset.toString(16))
      const tris = [];
      for(let i=0;i<triCount;i++){
        if(offset+0xC>dv.byteLength) break;
        const a = dv.getInt16(offset,false)+1; offset+=2;
        const b = dv.getInt16(offset,false)+1; offset+=2;
        const c = dv.getInt16(offset,false)+1; offset+=2;
        offset+=6;
        tris.push([a,b,c]);
      }
      
      //console.log(tris);
      
      const allIdx = [].concat(...tris);
      const maxIdx = Math.max(...allIdx);
      const minIdx = Math.min(...allIdx);
      if(minIdx>=1 && maxIdx<=verts.length) {
        for(let i=0;i<tris.length;i++) tris[i]=tris[i].map(x=>x-1);
      }
      if(fresh)
        buildGeometry(verts, tris, `Main Model`, fresh);
      else
        buildGeometry(verts, tris, `Model ${loadedModels.length+1}`, fresh);
    }

	function parseInvisibleSeams2D(text) {
		const lines = text
			.split(/\r?\n/)
			.map(s => s.trim())
			.filter(s => s && s[0] !== "#");

		const verts = [];
		const vertMap = new Map();
		const tris = [];
		const quadEdges = []; // store edges for each quad

		function getVertIndex(v) {
			const key = v.join(",");
			if (vertMap.has(key)) return vertMap.get(key);
			const idx = verts.length;
			verts.push(v);
			vertMap.set(key, idx);
			return idx;
		}

		for (let i = 0; i < lines.length; i += 3) {
			const edges = [];

			for (let j = 0; j < 3; j++) {
				const parts = lines[i + j].split(",").map(Number);
				const bottom = parts.slice(0, 3);
				const top = parts.slice(3, 6);
				const iBottom = getVertIndex(bottom);
				const iTop = getVertIndex(top);
				edges.push([iBottom, iTop]); // [[A,A2],[B,B2],[C,C2]]
			}

			// Build 1 quad per edge (2 triangles each)
			function addQuad(edge) {
				const idx = edges.indexOf(edge);
				const [b, t] = edge; // bottom, top
				const nextEdge = edges[(idx + 1) % 3];
				const [bNext, tNext] = nextEdge;

				// Add triangles for this quad
				tris.push([b, tNext, t]);
				tris.push([b, bNext, tNext]);

				// Store edges for this quad (4 sides)
				quadEdges.push([b, t]);       // left vertical
				quadEdges.push([t, tNext]);   // top
				quadEdges.push([tNext, bNext]); // right vertical
				quadEdges.push([bNext, b]);   // bottom
			}

			edges.forEach(addQuad);
		}

		// -----------------------
		// Build mesh geometry
		// -----------------------
		const positions = new Float32Array(verts.length * 3);
		for (let i = 0; i < verts.length; i++) positions.set(verts[i], i * 3);

		const indices = new (verts.length > 65535 ? Uint32Array : Uint16Array)(tris.length * 3);
		tris.forEach((t, i) => indices.set(t, i * 3));

		const geom = new THREE.BufferGeometry();
		geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
		geom.setIndex(new THREE.BufferAttribute(indices, 1));
		geom.computeVertexNormals();

		const mat = new THREE.MeshBasicMaterial({
			color: 0x5cff90, // 0x00ff00,
			side: THREE.DoubleSide,
			polygonOffset: true,
			polygonOffsetFactor: 4,
			polygonOffsetUnits: 4
		});

		const mesh = new THREE.Mesh(geom, mat);
		scene.add(mesh);

		// -----------------------
		// Build edges for each quad
		// -----------------------
		const edgeMap = new Map(); // deduplicate edges
		for (const [i1, i2] of quadEdges) {
			const key = i1 < i2 ? `${i1},${i2}` : `${i2},${i1}`;
			edgeMap.set(key, [i1, i2]);
		}

		const edgePositions = [];
		for (const [i1, i2] of edgeMap.values()) {
			const v1 = verts[i1];
			const v2 = verts[i2];
			edgePositions.push(v1[0], v1[1], v1[2]);
			edgePositions.push(v2[0], v2[1], v2[2]);
		}

		const edgeGeom = new THREE.BufferGeometry();
		edgeGeom.setAttribute('position', new THREE.Float32BufferAttribute(edgePositions, 3));

		const edgeMaterial = new THREE.LineBasicMaterial({
			color: 0x3240a8,
			transparent: true,
			opacity: 1.0,
			depthTest: true
		});

		const edgesObj = new THREE.LineSegments(edgeGeom, edgeMaterial);
		scene.add(edgesObj);

		loadedModels.push({ name: "Invis Seams", mesh, edges: edgesObj });
		addModelCheckbox("Invis Seams", mesh, edgesObj, false, true);
	}

	function triangleNormalY(a, b, c) {
		const ax = b[0] - a[0];
		const ay = b[1] - a[1];
		const az = b[2] - a[2];

		const bx = c[0] - a[0];
		const by = c[1] - a[1];
		const bz = c[2] - a[2];

		const nx = ay * bz - az * by;
		const ny = az * bx - ax * bz;
		const nz = ax * by - ay * bx;

		const len = Math.sqrt(nx*nx + ny*ny + nz*nz) || 1;
		return ny / len;
	}
	
    function buildGeometry_fwc(verts, tris, name = "Main Model", clearFirst = true) {

		if ((!verts || !tris || verts.length === 0 || tris.length === 0) && clearFirst) {
			alert('No valid vertices or triangles found');
			return;
		}

		// Clear existing models
		if (clearFirst) {
			loadedModels.forEach(m => {
				scene.remove(m.mesh);
				scene.remove(m.edges);
			});
			loadedModels = [];

			loadedModels2.forEach(m => {
				scene.remove(m.mesh);
				scene.remove(m.edges);
			});
			loadedModels2 = [];

			removeAllModelCheckboxes();
			clearSelection();
		}

		// Build vertex buffer
		const positions = new Float32Array(verts.length * 3);
		for (let i = 0; i < verts.length; i++) {
			positions[i * 3 + 0] = verts[i][0];
			positions[i * 3 + 1] = verts[i][1];
			positions[i * 3 + 2] = verts[i][2];
		}

		// Build index buffer
		const indices = new (verts.length > 65535 ? Uint32Array : Uint16Array)(tris.length * 3);
		for (let i = 0; i < tris.length; i++) {
			indices[i * 3 + 0] = tris[i][0];
			indices[i * 3 + 1] = tris[i][1];
			indices[i * 3 + 2] = tris[i][2];
		}

		const geom = new THREE.BufferGeometry();
		geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
		geom.setIndex(new THREE.BufferAttribute(indices, 1));
		geom.clearGroups();

		// --- normal.y helper ---
		function triangleNormalY(a, b, c) {
			const ax = b[0] - a[0];
			const ay = b[1] - a[1];
			const az = b[2] - a[2];

			const bx = c[0] - a[0];
			const by = c[1] - a[1];
			const bz = c[2] - a[2];

			const nx = ay * bz - az * by;
			const ny = az * bx - ax * bz;
			const nz = ax * by - ay * bx;

			const len = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
			return ny / len;
		}

		// --- build geometry groups ---
		let groupStart = 0;
		let currentGroup = null;

		for (let i = 0; i < tris.length; i++) {
			const [ia, ib, ic] = tris[i];
			const ny = triangleNormalY(verts[ia], verts[ib], verts[ic]);

			let group;
			if (ny > 0.5) {
				group = 0;          // floor / gentle
			} else if (ny < -0.8) {
				group = 2;          // ceiling
			} else {
				group = 1;          // wall / steep
			}

			if (currentGroup === null) {
				currentGroup = group;
				groupStart = i * 3;
			}

			if (group !== currentGroup) {
				geom.addGroup(groupStart, (i * 3) - groupStart, currentGroup);
				groupStart = i * 3;
				currentGroup = group;
			}
		}

		// flush final group
		geom.addGroup(groupStart, tris.length * 3 - groupStart, currentGroup);

		// --- mesh ---
		const meshObj = new THREE.Mesh(
			geom,
			[
				material.clone(),   // group 0
				material2.clone(),  // group 1
				material3.clone()   // group 2
			]
		);

		meshObj.material.forEach(m => {
			m.polygonOffset = true;
			m.polygonOffsetFactor = 1;
			m.polygonOffsetUnits = 1;
		});

		if (!clearFirst) {
			meshObj.material.forEach(m => m.color.set(0x3aff78));
		}

		scene.add(meshObj);

		// --- wireframe edges ---
		const edgePositions = [];
		for (let i = 0; i < indices.length; i += 3) {
			const a = indices[i], b = indices[i + 1], c = indices[i + 2];
			const va = verts[a], vb = verts[b], vc = verts[c];
			edgePositions.push(
				va[0], va[1], va[2], vb[0], vb[1], vb[2],
				vb[0], vb[1], vb[2], vc[0], vc[1], vc[2],
				vc[0], vc[1], vc[2], va[0], va[1], va[2]
			);
		}

		const edgeGeom = new THREE.BufferGeometry();
		edgeGeom.setAttribute('position', new THREE.Float32BufferAttribute(edgePositions, 3));

		const edgesObj = new THREE.LineSegments(
			edgeGeom,
			new THREE.LineBasicMaterial({
				color: 0x3240a8,
				linewidth: 1,
				opacity: 0.8,
				transparent: true
			})
		);

		edgesObj.visible = wireframeCheckbox.checked;
		scene.add(edgesObj);

		// Register model
		loadedModels.push({ name, mesh: meshObj, edges: edgesObj });
		addModelCheckbox(name, meshObj, edgesObj, clearFirst, true);

		scanAndBuildFlatGroundMarkers();
		updateFlatGroundUIVisibility();
	}
	
	function buildGeometry(verts, tris, name = "Main Model", clearFirst = true) {

            removeAllModelCheckboxes();
            
            // Clear selection
            clearSelection();
        }

        // Create vertex positions
        const positions = new Float32Array(verts.length * 3);

            positions[3 * i + 1] = verts[i][1];
            positions[3 * i + 2] = verts[i][2];
        }

        // Create triangle indices
        const indices = new (verts.length > 65535 ? Uint32Array : Uint16Array)(tris.length * 3);

            indices[3 * i + 1] = tris[i][1];
            indices[3 * i + 2] = tris[i][2];
        }

        // Build geometry and mesh
        const geom = new THREE.BufferGeometry();
        geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geom.setIndex(new THREE.BufferAttribute(indices, 1));
		
        const meshObj = new THREE.Mesh(geom, material.clone());
        meshObj.material.polygonOffset = true;
        meshObj.material.polygonOffsetFactor = 1;
        meshObj.material.polygonOffsetUnits = 1;
        if(!clearFirst)
            meshObj.material.color.set(0x3aff78);
        scene.add(meshObj);

        // Build wireframe edges
        const edgePositions = [];
        for (let i = 0; i < indices.length; i += 3) {
            const a = indices[i], b = indices[i + 1], c = indices[i + 2];
            const va = verts[a], vb = verts[b], vc = verts[c];
            edgePositions.push(
                va[0], va[1], va[2], vb[0], vb[1], vb[2],
                vb[0], vb[1], vb[2], vc[0], vc[1], vc[2],
                vc[0], vc[1], vc[2], va[0], va[1], va[2]
            );
        }
        const edgeGeom = new THREE.BufferGeometry();
        edgeGeom.setAttribute('position', new THREE.Float32BufferAttribute(edgePositions, 3));
        const edgesObj = new THREE.LineSegments(
            edgeGeom,
            new THREE.LineBasicMaterial({ color: 0x3240a8, linewidth: 1, opacity: 0.8, transparent: true }) // 3240a8
        );
        edgesObj.visible = wireframeCheckbox.checked;
        scene.add(edgesObj);

        // Store and register in UI
        loadedModels.push({ name, mesh: meshObj, edges: edgesObj });
        //console.log(loadedModels);
        addModelCheckbox(name, meshObj, edgesObj, clearFirst, true);
		
		// After loading model
		scanAndBuildFlatGroundMarkers();
		updateFlatGroundUIVisibility();
    }
    
    function buildGeometryFromEdges(verts, edges, name = "Edge Model", clearFirst = true) {

        if ((!verts || !edges || verts.length === 0 || edges.length === 0) && clearFirst) {
            alert('No valid vertices or edges found');
            return;
        }

        // Clear existing models
        if (clearFirst) {
            loadedModels.forEach(m => {
                if(m.mesh) scene.remove(m.mesh);
                if(m.edges) scene.remove(m.edges);
            });
            loadedModels = [];
            removeAllModelCheckboxes();
            clearSelection();
        }

        // Flatten edge positions (original logic)
        const edgePositions = [];
        for (let i = 0; i < edges.length; i++) {
            const [a, b] = edges[i];
            const va = verts[a];
            const vb = verts[b];
            edgePositions.push(
                va[0], va[1], va[2],
                vb[0], vb[1], vb[2]
            );
        }

        const edgeGeom = new THREE.BufferGeometry();
        edgeGeom.setAttribute('position', new THREE.Float32BufferAttribute(edgePositions, 3));

        // Improve visibility
        const edgesObj = new THREE.LineSegments(
            edgeGeom,
            new THREE.LineBasicMaterial({
                color: 0x00ff00,   // green
                linewidth: 1,   // thickness in world units
                transparent: false,
                opacity: 0.8,
                depthTest: true
            })
        );

        edgesObj.visible = true;
        scene.add(edgesObj);

        loadedModels.push({ name, mesh: null, edges: edgesObj });

        // Register in UI
        addModelCheckbox(name, null, edgesObj, clearFirst, true);
    }
	
	function clipTriangleByMinY(verts, minY) {
		// verts = [{x,y,z}, ... 3 items]

		const out = [];

		for (let i = 0; i < 3; i++) {
			const a = verts[i];
			const b = verts[(i + 1) % 3];

			const aAbove = a.y >= minY;
			const bAbove = b.y >= minY;

			// Case 1: A is above → keep A
			if (aAbove) out.push(a);

			// Case 2: Edge AB crosses the minY plane → add intersection
			if (aAbove !== bAbove) {
				const t = (minY - a.y) / (b.y - a.y);  // param along AB
				out.push({
					x: a.x + (b.x - a.x) * t,
					y: minY,
					z: a.z + (b.z - a.z) * t,
				});
			}
		}

		return out;
	}
	
	function renderStandableSurfaceWithEdges(allTriangleData) {
		const f32 = Math.fround;
		const COLPOLY_NORMAL_FRAC = f32(1.0 / 32767.0);

		const positions = [];
		const indices = [];
		let vertexOffset = 0;

		allTriangleData.forEach(tri => {
			const vtxs = tri.vtxs;
			const normals = tri.normals;
			const D = f32(tri.d);

			const Nx = f32(normals[0] * COLPOLY_NORMAL_FRAC);
			const Ny = f32(normals[1] * COLPOLY_NORMAL_FRAC);
			const Nz = f32(normals[2] * COLPOLY_NORMAL_FRAC);

			if (Ny < f32(-0.8) || isZero(Ny)) return;

			// Find original lowest Y vertex
			let minY = Math.min(vtxs[0].y, vtxs[1].y, vtxs[2].y);

			function liftVertex(x, z) {
				if (Math.abs(Ny) < 1e-12) return 0.0;
				return f32(-(Nx * x + Nz * z + D) / Ny);
			}

			// Determine if we need to offset triangle
			let expandedVertices = vtxs.map(v => ({ x: f32(v.x), z: f32(v.z) }));

			if (Math.abs(Ny) > 0.5) {
				// Expand triangle by 1 unit on all sides with rounded corners
				// Simple approach: move each vertex away from centroid
				const centroid = {
					x: (expandedVertices[0].x + expandedVertices[1].x + expandedVertices[2].x) / 3,
					z: (expandedVertices[0].z + expandedVertices[1].z + expandedVertices[2].z) / 3
				};

				expandedVertices = expandedVertices.map(v => {
					const dx = v.x - centroid.x;
					const dz = v.z - centroid.z;
					const len = Math.sqrt(dx*dx + dz*dz);
					const factor = len > 0 ? (len + 1) / len : 1;
					return {
						x: centroid.x + dx * factor,
						z: centroid.z + dz * factor
					};
				});
			}

			const rawVerts = [];

			for (let i = 0; i < 3; i++) {
				const vx = expandedVertices[i].x;
				const vz = expandedVertices[i].z;
				const vy = liftVertex(vx, vz);
				rawVerts.push({ x: vx, y: vy, z: vz });
			}

			// Clip polygon against y = minY
			const clipped = clipTriangleByMinY(rawVerts, minY);

			// If clipped polygon has < 3 vertices, it is gone
			if (clipped.length < 3) return;

			// Triangulate the clipped polygon (fan)
			for (let i = 1; i < clipped.length - 1; i++) {
				const v0 = clipped[0];
				const v1 = clipped[i];
				const v2 = clipped[i + 1];

				positions.push(v0.x, v0.y, v0.z);
				positions.push(v1.x, v1.y, v1.z);
				positions.push(v2.x, v2.y, v2.z);

				indices.push(
					vertexOffset,
					vertexOffset + 1,
					vertexOffset + 2
				);
				vertexOffset += 3;
			}
		});

		// Create main mesh
		const geometry = new THREE.BufferGeometry();
		geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
		geometry.setIndex(indices);
		geometry.computeVertexNormals();

		const mesh = new THREE.Mesh(
			geometry,
			new THREE.MeshStandardMaterial({
				//color: 0x00ff99,
				color: 0xff0000,
				side: THREE.DoubleSide,
				flatShading: true,
				polygonOffset: true,
				polygonOffsetFactor: 4,
				polygonOffsetUnits: 4
			})
		);

		// Edges
		const edgesGeom = new THREE.EdgesGeometry(geometry);
		const edgesMat = new THREE.LineBasicMaterial({ color: 0x000000 });
		const edges = new THREE.LineSegments(edgesGeom, edgesMat);

		// Group
		const group = new THREE.Group();
		group.add(mesh);
		group.add(edges);

		return group;
	}
	
    function removeAllModelCheckboxes() {
        const section = document.querySelector('.controls');
        // Remove all containers that hold the model checkbox + color picker
        section.querySelectorAll('div').forEach(container => {
            const label = container.querySelector('label');
            if (label && label.textContent.trim().startsWith('Show ')) {
                container.remove();
            }
        });
    }

    function addModelCheckbox(name, meshObj, edgesObj, clearFirst, checked, color = null) {
        const section = document.querySelector('.controls');

        // Container
        const container = document.createElement('div');
        container.style.display = 'flex';
        container.style.alignItems = 'center';
        container.style.marginBottom = '4px';
        container.style.gap = '8px'; // space between checkbox+label and color picker

        // Visibility checkbox + label
        const label = document.createElement('label');
        label.style.display = 'flex';
        label.style.alignItems = 'center';
        const chk = document.createElement('input');
        chk.type = 'checkbox';
        chk.checked = checked;
		if (meshObj != null)
			meshObj.visible = checked;
		if (edgesObj != null)
			edgesObj.visible = checked;
        chk.addEventListener('change', () => {
            if (meshObj != null)
                meshObj.visible = chk.checked;
            if (edgesObj != null)
				edgesObj.visible = chk.checked && wireframeCheckbox.checked;
            clearSelection();
        });
        label.appendChild(chk);
        const labelText = document.createTextNode(` Show ${name}`);
        label.appendChild(labelText);

        // Color picker
        const colorInput = document.createElement('input');
        colorInput.type = 'color';
		if (color != null)
			colorInput.value = color;
		else
			colorInput.value = clearFirst ? '#3aa6ff' : '#3aff78';
        colorInput.addEventListener('input', () => {
            if (meshObj != null && meshObj.material) {
                meshObj.material.color.set(colorInput.value);
                meshObj.material.needsUpdate = true;
            }
            else {
                edgesObj.material.color.set(colorInput.value);
                edgesObj.material.needsUpdate = true;
            }
        });

        // Assemble
        container.appendChild(label);
        container.appendChild(colorInput);
        section.appendChild(container);
    }

	let selectedPoints = [];
	
    // Update selection UI
    function updateSelectionUI() {
		function formatNumber(v) {
			return (v % 1 === 0) ? v.toString() : v.toFixed(7);
		}

		const lines = [];

		for (const t of selectedTriangles) {
			const pts = t.verts.map(v => `${formatNumber(v.x)} ${formatNumber(v.y)} ${formatNumber(v.z)}`);
			lines.push(`TRI ${t.index}  ${pts.join(' ')}`);
		}

		for (const p of selectedPoints) {
			const v = p.pos;
			lines.push(`PT  ${formatNumber(v.x)}, ${formatNumber(v.y)}, ${formatNumber(v.z)}`);
		}

		selectionListEl.value = lines.join("\n");
	}
    

    // Clear selection
    function clearSelection() {
		// Triangles
		selectedTriangles.forEach(sel => {
			const markerName = `selectionMarker_${sel.modelName}_${sel.index}`;
			const marker = scene.getObjectByName(markerName);
			if (marker) {
				scene.remove(marker);
				if (marker.geometry) marker.geometry.dispose();
				if (marker.material) marker.material.dispose();
			}
		});

		// Points
		selectedPoints.forEach(p => removePointMarker(p));

		selectedTriangles.length = 0;
		selectedPoints.length = 0;

		selectionListEl.value = '';
		updateSelectionUI();
	}
    
    function addSelectionMarker(tri) {
        const selGeom = new THREE.BufferGeometry();
        const arr = new Float32Array([
            tri.verts[0].x, tri.verts[0].y, tri.verts[0].z,
            tri.verts[1].x, tri.verts[1].y, tri.verts[1].z,
            tri.verts[2].x, tri.verts[2].y, tri.verts[2].z
        ]);
        selGeom.setAttribute('position', new THREE.BufferAttribute(arr, 3));
        selGeom.setIndex([0, 1, 2]);

        const selMat = new THREE.MeshBasicMaterial({
            color: 0xffff66,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 1.0,
            polygonOffset: true,
            polygonOffsetFactor: -1,
            polygonOffsetUnits: -1
        });

        const selMesh = new THREE.Mesh(selGeom, selMat);
        selMesh.name = `selectionMarker_${tri.modelName}_${tri.index}`;
        scene.add(selMesh);
    }

    function removeSelectionMarker(tri) {
        const markerName = `selectionMarker_${tri.modelName}_${tri.index}`;
        const marker = scene.getObjectByName(markerName);
        if (marker) scene.remove(marker);
    }
	
	function addPointMarker(pointObj) {
		const geo = new THREE.SphereGeometry(0.08, 12, 12);
		const mat = new THREE.MeshBasicMaterial({
			color: 0x44ff44,
			transparent: true,
			opacity: 1.0
		});
		const mesh = new THREE.Mesh(geo, mat);
		mesh.position.copy(pointObj.pos);
		mesh.name = `pointMarker_${pointObj.modelName}_${pointObj.index}_${pointObj.vertex}`;
		scene.add(mesh);
	}

	function removePointMarker(pointObj) {
		const name = `pointMarker_${pointObj.modelName}_${pointObj.index}_${pointObj.vertex}`;
		const m = scene.getObjectByName(name);
		if (m) {
			scene.remove(m);
			m.geometry.dispose();
			m.material.dispose();
		}
	}

    // Handle triangle selection
    function performSelection(ev) {
        if (!loadedModels.length) return;

        if (document.pointerLockElement === renderer.domElement) {
            mouse.x = 0;
            mouse.y = 0;
        } else {
            const rect = renderer.domElement.getBoundingClientRect();
            const x = ev.clientX - rect.left;
            const y = ev.clientY - rect.top;
            mouse.x = (x / rect.width) * 2 - 1;
            mouse.y = -(y / rect.height) * 2 + 1;
        }

        raycaster.setFromCamera(mouse, camera);
		
		// ----- POINT SELECTION PASS -----
		{
			// Collect every visible vertex of every model
			const pointHits = [];

			for (const m of loadedModels) {
				if (!m.mesh || !m.mesh.visible) continue;

				if (m.mesh.geometry === undefined)
					continue;
				const geom = m.mesh.geometry;
				const pos = geom.attributes.position;

				for (let i = 0; i < pos.count; i++) {
					const v = new THREE.Vector3().fromBufferAttribute(pos, i);
					const worldV = m.mesh.localToWorld(v);

					const dist = raycaster.ray.distanceToPoint(worldV);
					if (dist < 0.1) {   // clickable radius
						pointHits.push({
							modelName: m.mesh.name,
							index: i,
							pos: worldV
						});
					}
				}
			}

			if (pointHits.length > 0) {
				const p = pointHits[0]; // nearest

				// If exists, unselect
				const idx = selectedPoints.findIndex(
					q => q.modelName === p.modelName && q.index === p.index
				);

				if (idx !== -1) {
					removePointMarker(selectedPoints[idx]);
					selectedPoints.splice(idx, 1);
				} else {
					if (!multiSelectCheckbox.checked)
						clearSelection();
					selectedPoints.push(p);
					addPointMarker(p);
				}

				updateSelectionUI();
				return; // prevents triangle selection
			}
		}
		// ----- END POINT PASS -----

        const visibleMeshes = loadedModels
            .filter(m => m.mesh && m.mesh.visible)
            .map(m => m.mesh);

        const inter = raycaster.intersectObjects(visibleMeshes, true);
        if (inter.length === 0) {
            clearSelection();
            updateSelectionUI();
            return;
        }

        let hit = null;
        for (const i of inter) {
            if (i.face && i.object.visible) {
                hit = i;
                break;
            }
        }

        if (!hit) {
            clearSelection();
            updateSelectionUI();
            return;
        }

        const face = hit.face;
        const geom = hit.object.geometry;
        const pos = geom.attributes.position;
        const a = face.a, b = face.b, c = face.c;
        const va = new THREE.Vector3().fromBufferAttribute(pos, a);
        const vb = new THREE.Vector3().fromBufferAttribute(pos, b);
        const vc = new THREE.Vector3().fromBufferAttribute(pos, c);

        const newTri = {
            index: Math.floor(hit.faceIndex),
            verts: [va, vb, vc],
            modelName: hit.object.name
        };

        // Check if triangle is already selected (match by index + modelName)
        const existingIndex = selectedTriangles.findIndex(
            t => t.index === newTri.index && t.modelName === newTri.modelName
        );

        if (existingIndex !== -1) {
            // It's already selected → remove it
            selectedTriangles.splice(existingIndex, 1);
            updateSelectionUI();
            removeSelectionMarker(newTri);
            return;
        }

        // If single-select mode is active, clear previous selections
        if (!multiSelectCheckbox.checked) {
            clearSelection();
        }

        selectedTriangles.push(newTri);
        addSelectionMarker(newTri);
        updateSelectionUI();
    }

	let flatGroundEnabled = false;
	let flatGroundColor = 0xff00ff; // default
	let flatGroundMarkers = [];     // stored meshes

	// UI elements (create them somewhere in your sidebar)
	const flatGroundContainer = document.getElementById("flatGroundContainer"); 
	const flatGroundCheckbox  = document.getElementById("flatGroundCheckbox");
	const flatGroundColorPicker = document.getElementById("flatGroundColorPicker");

	// UI logic
	function updateFlatGroundUIVisibility() {
		if (["OOT","MM","OOT3D","MM3D"].includes(game)) {
			flatGroundContainer.style.display = "flex";
		} else {
			flatGroundContainer.style.display = "none";
			clearFlatGroundMarkers();
		}

	flatGroundCheckbox.addEventListener("change", () => {
		flatGroundEnabled = flatGroundCheckbox.checked;
		if (flatGroundEnabled) {
			scanAndBuildFlatGroundMarkers();

			clearFlatGroundMarkers();
		}

		recolorFlatGroundMarkers();

	////////////////////////////////////////
	// Building / clearing markers
	////////////////////////////////////////

	function clearFlatGroundMarkers() {
		for (const m of flatGroundMarkers) {
			scene.remove(m);
			if (m.geometry) m.geometry.dispose();
			if (m.material) m.material.dispose();
		}
		flatGroundMarkers.length = 0;
	}

	function recolorFlatGroundMarkers() {
		for (const m of flatGroundMarkers) {
			m.material.color.setHex(flatGroundColor);
		}
	}

	function createFlatGroundMarker(verts) {
		const geom = new THREE.BufferGeometry();
		const arr = new Float32Array([
			verts[0].x, verts[0].y, verts[0].z,
			verts[1].x, verts[1].y, verts[1].z,
			verts[2].x, verts[2].y, verts[2].z
		]);
		geom.setAttribute("position", new THREE.BufferAttribute(arr, 3));
		geom.setIndex([0,1,2]);

		const mat = new THREE.MeshBasicMaterial({
			color: flatGroundColor,
			side: THREE.DoubleSide,
			transparent: true,
			opacity: 0.9,
			polygonOffset: true,
			polygonOffsetFactor: -1,
			polygonOffsetUnits: -1
		});

		const mesh = new THREE.Mesh(geom, mat);
		scene.add(mesh);
		flatGroundMarkers.push(mesh);
	}

	////////////////////////////////////////
	// Scan loaded models for flat ground
	////////////////////////////////////////

	function scanAndBuildFlatGroundMarkers() {
		clearFlatGroundMarkers();
		if (!flatGroundEnabled) return;

		for (const model of loadedModels) {
			if (!model.mesh || !model.mesh.visible) continue;

			const geom = model.mesh.geometry;
			const pos = geom.attributes.position;
			const index = geom.index;

			for (let i = 0; i < index.count; i += 3) {
				const a = index.getX(i);
				const b = index.getX(i + 1);
				const c = index.getX(i + 2);

				const va = new THREE.Vector3().fromBufferAttribute(pos, a);
				const vb = new THREE.Vector3().fromBufferAttribute(pos, b);
				const vc = new THREE.Vector3().fromBufferAttribute(pos, c);
				
				const edge1 = new THREE.Vector3().subVectors(vb, va);
				const edge2 = new THREE.Vector3().subVectors(vc, va);
				const normal = new THREE.Vector3().crossVectors(edge1, edge2).normalize();

				// All y equal?
				if (va.y === vb.y && vb.y === vc.y && normal.y > 0) {
					// In table?
					if (flat_ground_clip_y_table.has(Math.round(va.y))) {
						createFlatGroundMarker([va, vb, vc]);
					}
				}
			}
		}
	}
    
    ////////////////////////////////////////
    // System: Canvas / Pointer interactions
    ////////////////////////////////////////
    
    renderer.domElement.addEventListener('click', (ev)=>{
      // If user explicitly selected Orbit mode, always treat click as selection (no pointer lock)
      if(controlMode === 'orbit'){
        performSelection(ev);
        return;
      }

      // If pointer already locked on our canvas, treat click as selection
      if(document.pointerLockElement === renderer.domElement){
        performSelection(ev);
        return;
      }

      // If user chose Pointer mode or Auto, try to acquire pointer lock on canvas
      if(controlMode === 'pointer' /*|| controlMode === 'auto'*/){
        try{
          // Attempt to lock; this may throw in sandboxed frames.
          pointerControls.lock();
          setStatus('requesting pointer lock...');
        }catch(err){
          // SecurityError when iframe sandbox blocks pointer lock
          console.warn('Pointer lock request failed:', err);
          pointerLockBlocked = true;
          //setStatus('Pointer lock blocked (sandbox or permission). Falling back to orbit controls.', 'warn');
          //enableOrbitControls();
        }
      }
    });

    // Listen for pointerlockchange/pointerlockerror to update status
    document.addEventListener('pointerlockchange', ()=>{
      if(document.pointerLockElement === renderer.domElement){
        setStatus('Pointer locked. WASD to fly. Click again to select triangles. Press Esc to unlock.');
      } else {
        setStatus('Pointer unlocked.');
      }
    });
    document.addEventListener('pointerlockerror', (ev)=>{
      console.warn('pointerlockerror', ev);
      pointerLockBlocked = true;
      //setStatus('Pointer lock error — falling back to orbit controls.', 'error');
      //enableOrbitControls();
    });

    // Control mode selector
    controlModeSel.addEventListener('change',(e)=>{
      controlMode = e.target.value;
      if(controlMode === 'orbit'){
        enableOrbitControls();
      }else if(controlMode === 'pointer'){
        // try to exit orbit and enable pointer behavior
        disableOrbitControls();
        setStatus('Pointer mode selected. Click the canvas to request pointer lock.');
      }else{ // auto
        if(pointerLockBlocked){
          enableOrbitControls();
        } else {
          disableOrbitControls();
          setStatus('Auto mode: click canvas to request pointer lock.');
        }
      }
    });
    
    ////////////////////////////////////////
    // System: Orbit controls
    ////////////////////////////////////////
    
    function enableOrbitControls(){
      if(orbitControls) return;
      try{
        if(document.pointerLockElement === renderer.domElement) document.exitPointerLock?.();
      }catch(e){ console.warn('exitPointerLock failed', e); }
      orbitControls = new OrbitControls(camera, renderer.domElement);
      orbitControls.enableDamping = true;
      orbitControls.dampingFactor = 0.08;
      orbitControls.screenSpacePanning = false;
      orbitControls.enablePan = true;
      
      // Hide crosshair in orbit mode
      if (crosshair) crosshair.style.display = 'none';
      if (hint) hint.style.display = 'none';
      
      setStatus('Orbit controls active (drag to rotate, scroll to zoom).');
    }
    function disableOrbitControls(){
      if(!orbitControls) return;
      orbitControls.dispose();
      orbitControls = null;
      
      // Show crosshair in fly mode
      if (crosshair) crosshair.style.display = 'block';
      if (hint) hint.style.display = 'block';
      
      setStatus('Orbit controls disabled.');
    }

    ////////////////////////////////////////
    // System: Movement input (WASD)
    ////////////////////////////////////////
    
    // Movement keyboard (only affects pointer-lock / fly mode)
    document.addEventListener('keydown',(e)=>{
      if(e.code==='KeyW') move.forward=true;
      if(e.code==='KeyS') move.back=true;
      if(e.code==='KeyA') move.left=true;
      if(e.code==='KeyD') move.right=true;
      if(e.code==='Space') move.up=true;
      if(e.code==='KeyC') move.down=true;
    });
    document.addEventListener('keyup',(e)=>{
      if(e.code==='KeyW') move.forward=false;
      if(e.code==='KeyS') move.back=false;
      if(e.code==='KeyA') move.left=false;
      if(e.code==='KeyD') move.right=false;
      if(e.code==='Space') move.up=false;
      if(e.code==='KeyC') move.down=false;
    });
    
    ////////////////////////////////////////
    // System: Resize / Camera / Renderer sizing
    ////////////////////////////////////////
    
    function onWindowResize(){
      const w = renderer.domElement.clientWidth || window.innerWidth - 320;
      const h = renderer.domElement.clientHeight || window.innerHeight;
      if(h===0 || w===0) return;
      camera.aspect = w/h;
      camera.updateProjectionMatrix();
      renderer.setSize(w,h,false);
    }
    window.addEventListener('resize', onWindowResize);

    ////////////////////////////////////////
    // System: Rendering loop
    ////////////////////////////////////////
    
    let last = performance.now();
    
    function animate(){
      requestAnimationFrame(animate);
      const now = performance.now();
      const dt = Math.min(0.05,(now-last)/1000);
      last = now;
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.0));

      if(controlMode !== 'orbit' && document.pointerLockElement === renderer.domElement){
        // Apply WASD movement in pointer-lock mode
        const dir = new THREE.Vector3();
        if(move.forward) dir.z -= 1;
        if(move.back) dir.z += 1;
        if(move.left) dir.x -= 1;
        if(move.right) dir.x += 1;
        if(move.up) dir.y += 1;
        if(move.down) dir.y -= 1;
        if(dir.lengthSq()>0){
          dir.normalize();
          const worldDir = dir.applyQuaternion(camera.quaternion).multiplyScalar(speed*dt);
          pointerControls.getObject().position.add(worldDir);
          camera.position.copy(pointerControls.getObject().position);
        }
      }

      // Update UI
      camPosEl.textContent = `${camera.position.x.toFixed(2)}, ${camera.position.y.toFixed(2)}, ${camera.position.z.toFixed(2)}`;
      const euler = new THREE.Euler().setFromQuaternion(camera.quaternion);
      camRotEl.textContent = `${THREE.MathUtils.radToDeg(euler.x).toFixed(1)}, ${THREE.MathUtils.radToDeg(euler.y).toFixed(1)}, ${THREE.MathUtils.radToDeg(euler.z).toFixed(1)}`;

      // Update orbit controls if active
      if(orbitControls) orbitControls.update();

      // update edges transformation if any
      if(edges && mesh){ edges.position.copy(mesh.position); edges.rotation.copy(mesh.rotation); }

      renderer.render(scene,camera);
    }
    onWindowResize();
    animate();
    
    ////////////////////////////////////////
    // System: Test model & dev helpers
    ////////////////////////////////////////
    
    // initial scene: build a small test cube if user hasn't loaded
    function buildTest(){
      const verts = [[-200,-200,-200],[200,-200,-200],[200,200,-200],[-200,200,-200],[-200,-200,200],[200,-200,200],[200,200,200],[-200,200,200]];
      const tris = [[0,1,2],[0,2,3],[4,7,6],[4,6,5],[0,4,5],[0,5,1],[1,5,6],[1,6,2],[2,6,7],[2,7,3],[3,7,4],[3,4,0]];
      buildGeometry(verts, tris, `Main Model`, true);
    }
    buildTest();

    // expose a tiny helpful function on window for quick testing
    window.__3dv = { parseModelText, parseModelBinary };
    
    ////////////////////////////////////////
    // System: Initialization checks
    ////////////////////////////////////////
    
    // Initial status: determine starting mode
    (function initStatus(){
      // If the environment is clearly sandboxed (iframe), we cannot reliably request pointer lock.
      try{
        // Some browsers throw immediately when calling requestPointerLock in a sandbox; we don't call it here — just detect availability.
        const supported = 'requestPointerLock' in Element.prototype;
        if(!supported){ pointerLockBlocked = true; setStatus('Pointer lock not supported in this environment; orbit controls enabled.', 'warn'); enableOrbitControls(); return; }
        setStatus('Ready. Click canvas to request pointer lock (Auto).');
      }catch(e){
        pointerLockBlocked = true;
        setStatus('Pointer lock appears unavailable; orbit controls enabled.', 'warn');
        enableOrbitControls();
      }
    })();
	
	// ===============================================================
	// OoT Polygon Standable Surface Debugger
	// JavaScript (Three.js compatible)
	// ===============================================================

	// Constants
	const COLPOLY_NORMAL_FRAC = 1.0 / 32767.0;
	let EPS = 0.008;
	// ------------------------
	// Helper Functions
	// ------------------------

	function f32(v) { return Math.fround(v); }
	function isZero(f) { return Math.abs(f) < EPS; }

	// Distance squared from point (x0,z0) to segment (x1,z1)-(x2,z2)
	function pointDistSqToLine2D(z, x, z0, x0, z1, x1) {
		const dz = z1 - z0;
		const dx = x1 - x0;

		const lenSq = dz*dz + dx*dx;
		if (lenSq === 0) return { hit: false, d2: 0 };

		const t = ((z - z0) * dz + (x - x0) * dx) / lenSq;
		if (t < 0 || t > 1) return { hit: false, d2: 0 };

		const projZ = z0 + t * dz;
		const projX = x0 + t * dx;

		const dZ = projZ - z;
		const dX = projX - x;

		return { hit: true, d2: dZ*dZ + dX*dX };
	}

	// Cir-square vs tri-square
	function cirSquareVsTriSquare(x0,y0, x1,y1, x2,y2, cx,cy, r) {
		x0 = Math.fround(x0); 
		x1 = Math.fround(x1); 
		x2 = Math.fround(x2);
		y0 = Math.fround(y0);
		y1 = Math.fround(y1);
		y2 = Math.fround(y2);
		cx = Math.fround(cx);
		cy = Math.fround(cy);
		r  = Math.fround(r);

		let minX = Math.fround(x0);
		let maxX = Math.fround(x0);
		let minY = Math.fround(y0);
		let maxY = Math.fround(y0);

		if (x1 < minX) minX = Math.fround(x1); else if (maxX < x1) maxX = Math.fround(x1);
		if (y1 < minY) minY = Math.fround(y1); else if (maxY < y1) maxY = Math.fround(y1);

		if (x2 < minX) minX = Math.fround(x2); else if (maxX < x2) maxX = Math.fround(x2);
		if (y2 < minY) minY = Math.fround(y2); else if (maxY < y2) maxY = Math.fround(y2);

		return (Math.fround(minX - r) <= cx &&
				Math.fround(maxX + r) >= cx &&
				Math.fround(minY - r) <= cy &&
				Math.fround(maxY + r) >= cy);
	}

	// Compute Y from plane
	function computeYFromPlane(nx,ny,nz,d,x,z) {
		if (isZero(ny)) return 0;
		//return f32((-(nx*x + nz*z) - d)/ny);
		return (f32)((((-nx * x) - (nz * z)) - d) / ny);
	}

	// ------------------------
	// Game-accurate Sampling
	// ------------------------
	function sampledStandableFootprint(tri, resolution=0.25) {
		const v0 = tri.vtxs[0], v1 = tri.vtxs[1], v2 = tri.vtxs[2];
		const nx = tri.normals[0] * COLPOLY_NORMAL_FRAC;
		const ny = tri.normals[1] * COLPOLY_NORMAL_FRAC;
		const nz = tri.normals[2] * COLPOLY_NORMAL_FRAC;
		const d = tri.d;
		const chkDist = 1.0;

		// Compute bounds
		const xs = [v0.x, v1.x, v2.x], zs = [v0.z, v1.z, v2.z];
		const minX = Math.min(...xs) - chkDist, maxX = Math.max(...xs) + chkDist;
		const minZ = Math.min(...zs) - chkDist, maxZ = Math.max(...zs) + chkDist;

		const result = [];
		let total = Math.ceil((maxX - minX) / resolution) * Math.ceil((maxZ - minZ) / resolution);
		let count = 0;

		for (let x = minX; x <= maxX; x += resolution) {
			x = f32(x);
			for (let z = minZ; z <= maxZ; z += resolution) {
				z = f32(z);
				count++;
				if (count % Math.floor(total / 100) === 0) console.log("Sampling progress: " + Math.floor(count / total * 100) + "%");

				if (!triChkPointParaYImpl(v0, v1, v2, z, x, 0.0, chkDist, ny)) {
					continue;
				}

				const y = computeYFromPlane(nx, ny, nz, d, x, z);

				// --- Vertex-Y early out ---
				const minVertexY = Math.min(v0.y, v1.y, v2.y);
				if (y < minVertexY) continue;

				result.push({x: f32(x), z: f32(z), y});
			}
		}

		console.log("Sampling complete: 100%");
		/*console.log(result)
		
		function jsonToCsv(arr) {
			if (!arr.length) return "";

			const headers = Object.keys(arr[0]);
			const rows = arr.map(obj =>
				headers.map(h => JSON.stringify(obj[h] ?? "")).join(",")
			);

			return headers.join(",") + "\n" + rows.join("\n");
		}

		console.log(jsonToCsv(result));*/
		
		return result;
	}
	
	// z,x order matches OoT exactly
	function triChkPointParaYImpl(v0, v1, v2, z, x, detMax, chkDist, ny) {
	
		//if (x > 842.25 && x < 842.35 && z > -2139.45 && z < -2139.35)
		//	console.log("test");
	
		if (isZero(ny)) {
			return false;
		}
	
		// ---- Cir-Square vs Tri-Square ----
		if (!cirSquareVsTriSquare(
			v0.z, v0.x,
			v1.z, v1.x,
			v2.z, v2.x,
			z, x,
			chkDist
		)) {
			return false;
		}

		const chkDistSq = chkDist * chkDist;

		// ---- Vertex distance check ----
		if (((v0.z - z) ** 2 + (v0.x - x) ** 2) < chkDistSq ||
			((v1.z - z) ** 2 + (v1.x - x) ** 2) < chkDistSq ||
			((v2.z - z) ** 2 + (v2.x - x) ** 2) < chkDistSq) {

			return true;
		}

		// ---- Determinant checks ----
		const detv0v1 = ((v0.z - z) * (v1.x - x)) - ((v0.x - x) * (v1.z - z));
		const detv1v2 = ((v1.z - z) * (v2.x - x)) - ((v1.x - x) * (v2.z - z));
		const detv2v0 = ((v2.z - z) * (v0.x - x)) - ((v2.x - x) * (v0.z - z));

		// Same logic as the real game: inside if all ≤ detMax OR all ≥ -detMax
		if (detMax >= detv0v1 && detMax >= detv1v2 && detMax >= detv2v0) return true;
		if (-detMax <= detv0v1 && -detMax <= detv1v2 && -detMax <= detv2v0) return true;

		// ---- Edge distance expansion for steep triangles ----
		if (Math.abs(ny) > 0.5) {

			// PointDistSqToLine2D matches Math3D_PointDistSqToLine2D
			let L;

			L = pointDistSqToLine2D(z, x, v0.z, v0.x, v1.z, v1.x);
			if (L.hit && L.d2 < chkDistSq) return true;

			L = pointDistSqToLine2D(z, x, v1.z, v1.x, v2.z, v2.x);
			if (L.hit && L.d2 < chkDistSq) return true;

			L = pointDistSqToLine2D(z, x, v2.z, v2.x, v0.z, v0.x);
			if (L.hit && L.d2 < chkDistSq) return true;
		}

		return false;
	}
	
	// ------------------------
	// Optional: draw in Three.js
	// Example: sampled (red)
	
	function drawSampledTriangles(scene, allTriangleData, sampleFunc, sampleStep = 0.1) {
		// First, count total number of points
		let totalPoints = 0;
		allTriangleData.forEach(tri => {
			totalPoints += sampleFunc(tri, sampleStep).length;
		});

		// Pre-allocate Float32Array
		const vertices = new Float32Array(totalPoints * 3);
		let offset = 0;

		// Fill vertices
		let count = 0
		allTriangleData.forEach(tri => {
			const points = sampleFunc(tri, sampleStep);
			points.forEach(p => {
				vertices[offset++] = Math.fround(p.x);
				vertices[offset++] = Math.fround(p.y);
				vertices[offset++] = Math.fround(p.z);
			});
			count += 1;
			console.log("completed "+count+"/"+allTriangleData.length)
		});

		// Build BufferGeometry
		const geometry = new THREE.BufferGeometry();
		geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));

		// Single Points object
		const material = new THREE.PointsMaterial({ color: 0xff0000, size: 0.5 });
		const pts = new THREE.Points(geometry, material);

		scene.add(pts);
		
		loadedModels.push({ name: "Points", mesh: pts, edges: null });

		// Register in UI
		addModelCheckbox("Points", pts, null, false, true, "#ff0000");
		
		return pts;
	}
