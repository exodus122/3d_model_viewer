<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>3D Model Viewer</title>
  <style>
    :root{--sidebar-w:320px}
    html,body{height:100%;margin:0;font-family:Inter,Segoe UI,Roboto,Helvetica,Arial}
    #app{display:flex;height:100vh;overflow:hidden}
    #canvas-wrap{flex:1;position:relative;background:#111}
    canvas{display:block;width:100%;height:100%}
    #sidebar{width:var(--sidebar-w);background:#0f1720;color:#e6eef6;padding:12px;box-sizing:border-box;overflow:auto}
    h2{margin:4px 0 10px;font-size:16px}
    h3 {margin: 4px 0;padding: 0}
    label{display:block;margin-top:8px;font-size:13px}
    .row{display:flex;gap:8px;align-items:center}
    input[type=range]{width:100%}
    select, button{margin-top:8px;padding:8px;border-radius:6px;border:none;background:#2563eb;color:white;cursor:pointer}
    .muted{color:#9fb0c8;font-size:13px}
    .info{background:#071624;padding:8px;border-radius:6px;margin-top:8px;font-family:monospace;font-size:13px}
    .controls{margin-top:6px}
    .section{margin-bottom:12px}
    .select-info{background:#071624;padding:2px;border-radius:6px;font-size:13px}

    .sel-verts{overflow-wrap: anywhere;}
    #status{margin-top:8px;padding:8px;border-radius:6px;background:#221a11;color:#ffd;}
    #crosshair {position: absolute;left: 50%;top: 50%;width: 16px;height: 16px;margin-left: -8px;margin-top: -8px;pointer-events: none;z-index: 10;}
    #crosshair::before, #crosshair::after {content: '';position: absolute;background: white;}
    #crosshair::before {left: 7px;top: 0;width: 2px;height: 16px;}
    #crosshair::after {top: 7px;left: 0;width: 16px;height: 2px;}
    #mapDropdown {min-width: 200px;max-width: 250px;box-sizing: border-box;}
    #file {border-radius: 6px;padding-top: 8px;font-family: monospace;font-size: 13px;}
    #file::file-selector-button {background-color: #2564eb; /* button background */color: #fff; /* button text */border: none;border-radius: 4px;padding: 6px 10px;margin-right: 8px;cursor: pointer;transition: background-color 0.2s ease;}
    #selectionListEl {background-color: #1e1e1e;color: #efefef;border: 1px solid #555;border-radius: 6px;padding: 6px;font-family: monospace;font-size: 13px;resize: vertical;width: 100%;box-sizing: border-box;margin-top: 6px;margin-bottom: 8px;}
  </style>

    </div>

            <option value="BK">Banjo-Kazooie</option>

		  EPS = 0.008;

    ////////////////////////////////////////

                console.log(mapFilename+": Binary file length:", buffer1.byteLength);

				if (mapFilename2 === undefined) {

					if (mapFilename2 === undefined) {

    ////////////////////////////////////////
    // System: File input (user-supplied file)

    // File parsing
    fileInput.addEventListener('change', async (ev)=>{

      if(!f) return;
      const buf = await f.arrayBuffer();
      parseModel(buf);
    });
    
    ////////////////////////////////////////
    // System: Model Parsing (text vs binary dispatch)
    ////////////////////////////////////////

    // Detect binary vs text simple heuristic
    function parseModel(buffer){
      if(typeof buffer === 'string') { parseInvisibleSeams1D(buffer); return; }
      const uint8 = new Uint8Array(buffer);
      let isText = true;
      for(let i=0;i<Math.min(64,uint8.length);i++){
        const c = uint8[i];
        if(c===9||c===10||c===13) continue;
        if(c<32 || c>126){ isText=false; break; }
      }
      if(isText && (game == "OOT" || game == "MM")) parseZeldaModelTextTriangles(new TextDecoder().decode(buffer), true);
      else if(isText) parseInvisibleSeams1D(new TextDecoder().decode(buffer));
      else {
        if(game == "BK" || game == "BT")
            parseBKModelBinary(buffer, true);
        else if (game == "OOT" || game == "MM" || game == "OOT3D" || game == "MM3D")
            parseZeldaModelBinary(buffer, true);
        else
            parseModelBinary(buffer);
      }
    }

    // Text format: lines with "v x y z" and "f i j k" (1-based or 0-based)
    function parseModelText(text){
      const lines = text.split(/\r?\n/).map(s=>s.trim()).filter(s=>s&&s[0]!="#");
      const verts = [];
      const tris = [];
      for(const l of lines){
        const parts = l.split(/\s+/);
        if(parts[0].toLowerCase()==='v' && parts.length>=4){
          verts.push( [parseInt(parts[1],10),parseInt(parts[2],10),parseInt(parts[3],10)] );
        } else if((parts[0].toLowerCase()==='f'||parts[0].toLowerCase()==='t') && parts.length>=4){
          const a = parseInt(parts[1],10);
          const b = parseInt(parts[2],10);
          const c = parseInt(parts[3],10);
          tris.push([a,b,c]);
        }
      }
      if(verts.length>0 && tris.length>0){
        const allIdx = [].concat(...tris);
        const maxIdx = Math.max(...allIdx);
        const minIdx = Math.min(...allIdx);
        if(minIdx>=1 && maxIdx<=verts.length) {
          for(let i=0;i<tris.length;i++) tris[i]=tris[i].map(x=>x-1);
        }
      }
      buildGeometry(verts, tris, `Main Model`, true);
    }

    // Binary format: [uint16 vertexCount][uint16 triCount] then vertexCount*(int16 x,y,z) then triCount*(uint16 a,b,c)
    function parseModelBinary(buffer){
      const dv = new DataView(buffer);
      if(dv.byteLength<4){ alert('binary too small'); return; }
      let offset = 0;
      const vertexCount = dv.getUint16(offset,true); offset+=2;
      const triCount = dv.getUint16(offset,true); offset+=2;
      const verts = [];
      for(let i=0;i<vertexCount;i++){
        if(offset+6>dv.byteLength) break;
        const x = dv.getInt16(offset,true); offset+=2;
        const y = dv.getInt16(offset,true); offset+=2;
        const z = dv.getInt16(offset,true); offset+=2;
        verts.push([x,y,z]);
      }
      //console.log(verts)
      const tris = [];
      for(let i=0;i<triCount;i++){
        if(offset+6>dv.byteLength) break;
        const a = dv.getUint16(offset,true); offset+=2;
        const b = dv.getUint16(offset,true); offset+=2;
        const c = dv.getUint16(offset,true); offset+=2;
        tris.push([a,b,c]);
      }
      //console.log(tris)
      const allIdx = [].concat(...tris);
      const maxIdx = Math.max(...allIdx);
      const minIdx = Math.min(...allIdx);
      if(minIdx>=1 && maxIdx<=verts.length) {
        for(let i=0;i<tris.length;i++) tris[i]=tris[i].map(x=>x-1);
      }
      buildGeometry(verts, tris, `Main Model`, true);
    }
    
    function parseBKModelBinary(buffer, fresh){
      const dv = new DataView(buffer);
      if (dv.byteLength < 4) {
        alert('binary too small');
        return;
      }

      let vtx_list_offset = dv.getUint32(0x10, false);

	function parseInvisibleSeams2D(text) {
		const lines = text
			.split(/\r?\n/)
			.map(s => s.trim())
			.filter(s => s && s[0] !== "#");

		const verts = [];
		const vertMap = new Map();
		const tris = [];
		const edgeLines = []; // will store line segments for the edges

		function getVertIndex(v) {
			const key = v.join(",");
			if (vertMap.has(key)) return vertMap.get(key);
			const idx = verts.length;
			verts.push(v);
			vertMap.set(key, idx);
			return idx;
		}

		// Process in groups of 3 edges
		for (let i = 0; i < lines.length; i += 3) {
			const edges = [];

			for (let j = 0; j < 3; j++) {
				const parts = lines[i + j].split(",").map(Number);
				const v0 = parts.slice(0, 3);
				const v1 = parts.slice(3, 6);

				const i0 = getVertIndex(v0);
				const i1 = getVertIndex(v1);

				edges.push([i0, i1]); // edges = [[A,A2],[B,B2],[C,C2]]
			}

			// Helper to create a quad (2 triangles) and its outer edges
			function quad(e0, e1) {
				const [a, a2] = e0;
				const [b, b2] = e1;

				// Add triangles
				tris.push([a, b, b2]);
				tris.push([a, b2, a2]);

				// Add edges (perimeter)
				edgeLines.push([a, b]);
				edgeLines.push([b, b2]);
				edgeLines.push([b2, a2]);
				edgeLines.push([a2, a]);
			}

			// Shade quads 1↔2, 2↔3, 1↔3
			quad(edges[0], edges[1]);
			quad(edges[1], edges[2]);
			quad(edges[0], edges[2]);
		}

		// -----------------------
		// Build geometry for mesh
		// -----------------------
		const positions = new Float32Array(verts.length * 3);
		for (let i = 0; i < verts.length; i++) {
			positions.set(verts[i], i * 3);
		}

		const indices = new (verts.length > 65535 ? Uint32Array : Uint16Array)(tris.length * 3);
		tris.forEach((t, i) => indices.set(t, i * 3));

		const geom = new THREE.BufferGeometry();
		geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
		geom.setIndex(new THREE.BufferAttribute(indices, 1));
		geom.computeVertexNormals();

		const mat = new THREE.MeshBasicMaterial({
			color: 0x00ff00,
			side: THREE.DoubleSide,
            polygonOffset: true,
            polygonOffsetFactor: 4,
            polygonOffsetUnits: 4
		});

		const mesh = new THREE.Mesh(geom, mat);
		scene.add(mesh);

		// -----------------------
		// Build edges
		// -----------------------
		const edgePositions = [];
		for (const [i1, i2] of edgeLines) {
			const v1 = verts[i1];
			const v2 = verts[i2];
			edgePositions.push(v1[0], v1[1], v1[2]);
			edgePositions.push(v2[0], v2[1], v2[2]);
		}

		const edgeGeom = new THREE.BufferGeometry();
		edgeGeom.setAttribute('position', new THREE.Float32BufferAttribute(edgePositions, 3));

		const edgeMaterial = new THREE.LineBasicMaterial({
			color: 0x3240a8,
			transparent: true,
			opacity: 1.0,
            depthTest: true
		});

		const edgesObj = new THREE.LineSegments(edgeGeom, edgeMaterial);
		scene.add(edgesObj);

        loadedModels.push({ name: "Invis Seams", mesh: mesh, edges: edgesObj });

        // Register in UI
        addModelCheckbox("Invis Seams", mesh, edgesObj, false, true);
	}

		const verts = [];
		const vertMap = new Map();
		const tris = [];
		const quadEdges = []; // store edges for each quad

		function getVertIndex(v) {
			const key = v.join(",");
			if (vertMap.has(key)) return vertMap.get(key);
			const idx = verts.length;
			verts.push(v);
			vertMap.set(key, idx);
			return idx;
		}

		for (let i = 0; i < lines.length; i += 3) {
			const edges = [];

			for (let j = 0; j < 3; j++) {
				const parts = lines[i + j].split(",").map(Number);
				const bottom = parts.slice(0, 3);
				const top = parts.slice(3, 6);
				const iBottom = getVertIndex(bottom);
				const iTop = getVertIndex(top);
				edges.push([iBottom, iTop]); // [[A,A2],[B,B2],[C,C2]]
			}

			// Build 1 quad per edge (2 triangles each)
			function addQuad(edge) {
				const idx = edges.indexOf(edge);
				const [b, t] = edge; // bottom, top
				const nextEdge = edges[(idx + 1) % 3];
				const [bNext, tNext] = nextEdge;

				// Add triangles for this quad
				tris.push([b, tNext, t]);
				tris.push([b, bNext, tNext]);

				// Store edges for this quad (4 sides)
				quadEdges.push([b, t]);       // left vertical
				quadEdges.push([t, tNext]);   // top
				quadEdges.push([tNext, bNext]); // right vertical
				quadEdges.push([bNext, b]);   // bottom
			}

			edges.forEach(addQuad);
		}

		// -----------------------
		// Build mesh geometry
		// -----------------------
		const positions = new Float32Array(verts.length * 3);
		for (let i = 0; i < verts.length; i++) positions.set(verts[i], i * 3);

		const indices = new (verts.length > 65535 ? Uint32Array : Uint16Array)(tris.length * 3);
		tris.forEach((t, i) => indices.set(t, i * 3));

		});

		const mesh = new THREE.Mesh(geom, mat);
		scene.add(mesh);

		// -----------------------
		// Build edges for each quad
		// -----------------------
		const edgeMap = new Map(); // deduplicate edges
		for (const [i1, i2] of quadEdges) {
			const key = i1 < i2 ? `${i1},${i2}` : `${i2},${i1}`;
			edgeMap.set(key, [i1, i2]);
		}

		const edgePositions = [];
		for (const [i1, i2] of edgeMap.values()) {
			const v1 = verts[i1];
			const v2 = verts[i2];
			edgePositions.push(v1[0], v1[1], v1[2]);
			edgePositions.push(v2[0], v2[1], v2[2]);
		}

		const edgeGeom = new THREE.BufferGeometry();

		});

		scene.add(edgesObj);

		addModelCheckbox("Invis Seams", mesh, edgesObj, false, true);

	function parseInvisibleSeams2D_outerQuad(text) {
		const lines = text
			.split(/\r?\n/)
			.map(s => s.trim())
			.filter(s => s && s[0] !== "#");

		const verts = [];
		const vertMap = new Map();
		const tris = [];
		const quadEdges = [];

		function getVertIndex(v) {
			const key = v.join(",");
			if (vertMap.has(key)) return vertMap.get(key);
			const idx = verts.length;
			verts.push(v);
			vertMap.set(key, idx);
			return idx;
		}

				const parts = lines[i + j].split(",").map(Number);
				bottom.push(parts.slice(0, 3));
				top.push(parts.slice(3, 6));
			}

			// Pick the top 2 vertices (highest Y) to form the outer quad
			const topIndices = [0, 1, 2].sort((a, b) => bottom[b][1] - bottom[a][1]).slice(0, 2);
			const iBottom = topIndices.map(idx => getVertIndex(bottom[idx]));
			const iTop = topIndices.map(idx => getVertIndex(top[idx]));

			// Add exactly 2 triangles for the outer quad
			tris.push([iBottom[0], iTop[0], iTop[1]]);
			tris.push([iBottom[0], iTop[1], iBottom[1]]);

			// Add edges for the quad
			quadEdges.push([iBottom[0], iTop[0]]);
			quadEdges.push([iTop[0], iTop[1]]);
			quadEdges.push([iTop[1], iBottom[1]]);
			quadEdges.push([iBottom[1], iBottom[0]]);

		const positions = new Float32Array(verts.length * 3);
		for (let i = 0; i < verts.length; i++) positions.set(verts[i], i * 3);

		const indices = new (verts.length > 65535 ? Uint32Array : Uint16Array)(tris.length * 3);
		tris.forEach((t, i) => indices.set(t, i * 3));

		const geom = new THREE.BufferGeometry();
		geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
		geom.setIndex(new THREE.BufferAttribute(indices, 1));
		geom.computeVertexNormals();

		const mat = new THREE.MeshBasicMaterial({
			color: 0x00ff00,
			side: THREE.DoubleSide,
			polygonOffset: true,
			polygonOffsetFactor: 4,
			polygonOffsetUnits: 4
		});

		const mesh = new THREE.Mesh(geom, mat);
		scene.add(mesh);

		// --- Build edges ---
		const edgeMap = new Map();
		for (const [i1, i2] of quadEdges) {
			const key = i1 < i2 ? `${i1},${i2}` : `${i2},${i1}`;
			edgeMap.set(key, [i1, i2]);
		}

		const edgePositions = [];
		for (const [i1, i2] of edgeMap.values()) {
			const v1 = verts[i1];
			const v2 = verts[i2];
			edgePositions.push(v1[0], v1[1], v1[2], v2[0], v2[1], v2[2]);
		}

		const edgeGeom = new THREE.BufferGeometry();
		edgeGeom.setAttribute('position', new THREE.Float32BufferAttribute(edgePositions, 3));

		const edgeMat = new THREE.LineBasicMaterial({
			color: 0x3240a8,
			transparent: true,
			opacity: 1.0,
			depthTest: true
		});

		const edgesObj = new THREE.LineSegments(edgeGeom, edgeMat);
		scene.add(edgesObj);

		loadedModels.push({ name: "Invis Seams", mesh, edges: edgesObj });
		addModelCheckbox("Invis Seams", mesh, edgesObj, false, true);
	}
	
	function parseInvisibleSeams_Alt(text) {
		const lines = text.split(/\r?\n/)
			.map(s => s.trim())
			.filter(s => s && s[0] !== "#");

		if (lines.length % 3 !== 0) {
			console.warn("Warning: file does not contain 3-line groups");
		}

		const allVerts = [];
		const allTris = [];
		let offset = 0;

		for (let i = 0; i < lines.length; i += 3) {
			const pA = lines[i].split(",").map(Number);
			const pB = lines[i+1].split(",").map(Number);
			const pC = lines[i+2].split(",").map(Number);

			const A = pA.slice(0,3), A2 = pA.slice(3,6);
			const B = pB.slice(0,3), B2 = pB.slice(3,6);
			const C = pC.slice(0,3), C2 = pC.slice(3,6);

			// Vertices: bottom + top
			const shapeVerts = [A, B, C, A2, B2, C2];
			const bA = 0, bB = 1, bC = 2;
			const tA = 3, tB = 4, tC = 5;

			const shapeTris = [];

			// Side walls
			shapeTris.push([bA, bB, tB], [bA, tB, tA]); // side AB
			shapeTris.push([bB, bC, tC], [bB, tC, tB]); // side BC
			shapeTris.push([bC, bA, tA], [bC, tA, tC]); // side CA

			// Top triangle only (exclude bottom)
			shapeTris.push([tA, tB, tC]);

			// Append to global arrays
			for (const v of shapeVerts) allVerts.push(v);
			for (const t of shapeTris) allTris.push([t[0]+offset, t[1]+offset, t[2]+offset]);

			offset += shapeVerts.length;
		}

		buildGeometry(allVerts, allTris, "Extruded Shape Model", false);
	}

	function triangleNormalY(a, b, c) {
		const ax = b[0] - a[0];
		const ay = b[1] - a[1];
		const az = b[2] - a[2];

		const bx = c[0] - a[0];
		const by = c[1] - a[1];
		const bz = c[2] - a[2];

		const nx = ay * bz - az * by;
		const ny = az * bx - ax * bz;
		const nz = ax * by - ay * bx;

		const len = Math.sqrt(nx*nx + ny*ny + nz*nz) || 1;
		return ny / len;
	}
	
    function buildGeometry_fwc(verts, tris, name = "Main Model", clearFirst = true) {

		if ((!verts || !tris || verts.length === 0 || tris.length === 0) && clearFirst) {
			alert('No valid vertices or triangles found');
			return;
		}

		// Clear existing models
		if (clearFirst) {
			loadedModels.forEach(m => {
				scene.remove(m.mesh);
				scene.remove(m.edges);
			});
			loadedModels = [];

			loadedModels2.forEach(m => {
				scene.remove(m.mesh);
				scene.remove(m.edges);
			});
			loadedModels2 = [];

			removeAllModelCheckboxes();
			clearSelection();
		}

		// Build vertex buffer
		const positions = new Float32Array(verts.length * 3);
		for (let i = 0; i < verts.length; i++) {
			positions[i * 3 + 0] = verts[i][0];
			positions[i * 3 + 1] = verts[i][1];
			positions[i * 3 + 2] = verts[i][2];
		}

		// Build index buffer
		const indices = new (verts.length > 65535 ? Uint32Array : Uint16Array)(tris.length * 3);
		for (let i = 0; i < tris.length; i++) {
			indices[i * 3 + 0] = tris[i][0];
			indices[i * 3 + 1] = tris[i][1];
			indices[i * 3 + 2] = tris[i][2];
		}

		const geom = new THREE.BufferGeometry();
		geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
		geom.setIndex(new THREE.BufferAttribute(indices, 1));
		geom.clearGroups();

		// --- normal.y helper ---
		function triangleNormalY(a, b, c) {
			const ax = b[0] - a[0];
			const ay = b[1] - a[1];
			const az = b[2] - a[2];

			const bx = c[0] - a[0];
			const by = c[1] - a[1];
			const bz = c[2] - a[2];

			const nx = ay * bz - az * by;
			const ny = az * bx - ax * bz;
			const nz = ax * by - ay * bx;

			const len = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
			return ny / len;
		}

		// --- build geometry groups ---
		let groupStart = 0;
		let currentGroup = null;

		for (let i = 0; i < tris.length; i++) {
			const [ia, ib, ic] = tris[i];
			const ny = triangleNormalY(verts[ia], verts[ib], verts[ic]);

			let group;
			if (ny > 0.5) {
				group = 0;          // floor / gentle
			} else if (ny < -0.8) {
				group = 2;          // ceiling
			} else {
				group = 1;          // wall / steep
			}

			if (currentGroup === null) {
				currentGroup = group;
				groupStart = i * 3;
			}

			if (group !== currentGroup) {
				geom.addGroup(groupStart, (i * 3) - groupStart, currentGroup);
				groupStart = i * 3;
				currentGroup = group;
			}
		}

		// flush final group
		geom.addGroup(groupStart, tris.length * 3 - groupStart, currentGroup);

		// --- mesh ---
		const meshObj = new THREE.Mesh(
			geom,
			[
				material.clone(),   // group 0
				material2.clone(),  // group 1
				material3.clone()   // group 2
			]
		);

		meshObj.material.forEach(m => {
			m.polygonOffset = true;
			m.polygonOffsetFactor = 1;
			m.polygonOffsetUnits = 1;
		});

		if (!clearFirst) {
			meshObj.material.forEach(m => m.color.set(0x3aff78));
		}

		scene.add(meshObj);

		// --- wireframe edges ---
		const edgePositions = [];
		for (let i = 0; i < indices.length; i += 3) {
			const a = indices[i], b = indices[i + 1], c = indices[i + 2];
			const va = verts[a], vb = verts[b], vc = verts[c];
			edgePositions.push(
				va[0], va[1], va[2], vb[0], vb[1], vb[2],
				vb[0], vb[1], vb[2], vc[0], vc[1], vc[2],
				vc[0], vc[1], vc[2], va[0], va[1], va[2]
			);
		}

		const edgeGeom = new THREE.BufferGeometry();
		edgeGeom.setAttribute('position', new THREE.Float32BufferAttribute(edgePositions, 3));

		const edgesObj = new THREE.LineSegments(
			edgeGeom,
			new THREE.LineBasicMaterial({
				color: 0x3240a8,
				linewidth: 1,
				opacity: 0.8,
				transparent: true
			})
		);

		edgesObj.visible = wireframeCheckbox.checked;
		scene.add(edgesObj);

		// Register model
		loadedModels.push({ name, mesh: meshObj, edges: edgesObj });
		addModelCheckbox(name, meshObj, edgesObj, clearFirst, true);

		scanAndBuildFlatGroundMarkers();
		updateFlatGroundUIVisibility();
	}

		const vtxs = [

	function createInflatedTriangleMesh(v1, v2, v3, normals, d, offset = 1.0) {
		const COLPOLY_NORMAL_FRAC = 1.0 / 32767.0;

		// Normalize (x,z) vector
		function normalize2D(v) {
			const lx = v[0];
			const lz = v[1];
			const L = Math.hypot(lx, lz);
			if (L === 0) return [0, 0];
			return [lx / L, lz / L];
		}

		// Compute y from plane
		function y_from_plane(x, z, Nx, Ny, Nz, d) {
			return -(Nx * x + Nz * z + d) / Ny;
		}

		// Python offset_triangle_3points port
		function offset_triangle_3points(verts, offset) {
			const result = [];
			const V = verts;

			for (let i = 0; i < 3; i++) {
				const prev = V[(i + 2) % 3];
				const curr = V[i];
				const next = V[(i + 1) % 3];

				const v1 = normalize2D([prev[0] - curr[0], prev[1] - curr[1]]);
				const v2 = normalize2D([next[0] - curr[0], next[1] - curr[1]]);

				// bisector outward = normalize(-(v1 + v2))
				const bx = -(v1[0] + v2[0]);
				const bz = -(v1[1] + v2[1]);
				const Bnorm = normalize2D([bx, bz]);

				const inflated = [
					curr[0] + Bnorm[0] * offset,
					curr[1] + Bnorm[1] * offset
				];

				result.push(inflated);
			}

			return result;
		}

		// Extract plane normal
		const Nx = normals[0] * COLPOLY_NORMAL_FRAC;
		const Ny = normals[1] * COLPOLY_NORMAL_FRAC;
		const Nz = normals[2] * COLPOLY_NORMAL_FRAC;

		// Triangle XZ coordinates
		const verts2d = [
			[v1.x, v1.z],
			[v2.x, v2.z],
			[v3.x, v3.z]
		];

		// Inflate triangle in XZ
		const inflatedXZ = offset_triangle_3points(verts2d, offset);

		// Convert inflated XZ → 3D using plane
		const inflated3D = inflatedXZ.map(([x, z]) => {
			const y = y_from_plane(x, z, Nx, Ny, Nz, d);
			return new THREE.Vector3(x, y, z);
		});

		// Create geometry (triangle)
		const geom = new THREE.BufferGeometry();
		const pos = new Float32Array([
			inflated3D[0].x, inflated3D[0].y, inflated3D[0].z,
			inflated3D[1].x, inflated3D[1].y, inflated3D[1].z,
			inflated3D[2].x, inflated3D[2].y, inflated3D[2].z
		]);
		geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
		geom.computeVertexNormals();

		// Simple material
		const mat = new THREE.MeshStandardMaterial({
			color: 0x00ff88,
			side: THREE.DoubleSide
		});

		return new THREE.Mesh(geom, mat);
	}
	
	function createRoundedInflatedTriangleMesh(v1, v2, v3, normals, d, offset = 1.0, arcSegments = 12) {
		const COLPOLY_NORMAL_FRAC = 1.0 / 32767.0;

		function normalize2D(v) {
			const L = Math.hypot(v[0], v[1]);
			return L === 0 ? [0, 0] : [v[0] / L, v[1] / L];
		}

		function y_from_plane(x, z, Nx, Ny, Nz, d) {
			return -(Nx * x + Nz * z + d) / Ny;
		}

		function offset_triangle_3points(verts) {
			const result = [];
			for (let i = 0; i < 3; i++) {
				const prev = verts[(i + 2) % 3];
				const curr = verts[i];
				const next = verts[(i + 1) % 3];

				const v1 = normalize2D([prev[0] - curr[0], prev[1] - curr[1]]);
				const v2 = normalize2D([next[0] - curr[0], next[1] - curr[1]]);

				const bx = -(v1[0] + v2[0]);
				const bz = -(v1[1] + v2[1]);
				const Bnorm = normalize2D([bx, bz]);

				result.push([
					curr[0] + Bnorm[0] * offset,
					curr[1] + Bnorm[1] * offset
				]);
			}
			return result;
		}

		// Plane normal
		const Nx = normals[0] * COLPOLY_NORMAL_FRAC;
		const Ny = normals[1] * COLPOLY_NORMAL_FRAC;
		const Nz = normals[2] * COLPOLY_NORMAL_FRAC;

		// Original XZ triangle
		const verts2d = [
			[v1.x, v1.z],
			[v2.x, v2.z],
			[v3.x, v3.z]
		];

		// Get inflated (sharp) corners
		const inflated = offset_triangle_3points(verts2d);

		// Build rounded polygon in XZ
		const shape = new THREE.Shape();

		for (let i = 0; i < 3; i++) {
			const prev = inflated[(i + 2) % 3];
			const curr = inflated[i];
			const next = inflated[(i + 1) % 3];

			// Directions around the corner
			const d1 = normalize2D([prev[0] - curr[0], prev[1] - curr[1]]);
			const d2 = normalize2D([next[0] - curr[0], next[1] - curr[1]]);

			// Start/end angles for fillet
			let start = Math.atan2(d1[1], d1[0]);
			let end   = Math.atan2(d2[1], d2[0]);

			// Ensure correct winding for arc
			if (end < start) end += Math.PI * 2;

			// Add arc samples
			for (let s = 0; s <= arcSegments; s++) {
				const t = start + (end - start) * (s / arcSegments);
				const x = curr[0] + Math.cos(t) * offset;
				const z = curr[1] + Math.sin(t) * offset;

				if (i === 0 && s === 0)
					shape.moveTo(x, z);
				else
					shape.lineTo(x, z);
			}
		}

		// Convert shape points (x,z) → 3D (x,y,z)
		const pts = shape.getPoints(3 * arcSegments);
		const verts3d = pts.map(p => {
			const y = y_from_plane(p.x, p.y, Nx, Ny, Nz, d);
			return new THREE.Vector3(p.x, y, p.y);
		});

		// Build BufferGeometry
		const geom = new THREE.BufferGeometry();
		const flat = [];
		for (let v of verts3d) {
			flat.push(v.x, v.y, v.z);
		}
		geom.setAttribute('position', new THREE.Float32BufferAttribute(flat, 3));
		geom.computeVertexNormals();

		const mat = new THREE.MeshStandardMaterial({
			color: 0xffaa00,
			side: THREE.DoubleSide
		});

		return new THREE.Mesh(geom, mat);
	}

	// create rounded outer triangle
	function createInflatedRoundedTriangle(vtxs, normal, d, offset, radius) {

		const A = vtxs[0], B = vtxs[1], C = vtxs[2];

		// ----------------------------------------
		// Helpers
		// ----------------------------------------
		function normalize2(v) {
			const L = Math.hypot(v.x, v.y);
			return L === 0 ? new THREE.Vector2() : v.clone().multiplyScalar(1 / L);
		}

		// Make 2D basis for triangle plane
		function makeBasis(a, b, c) {
			const n = new THREE.Vector3()
				.subVectors(b, a)
				.cross(new THREE.Vector3().subVectors(c, a))
				.normalize();

			// match collision normal orientation
			if (n.dot(normal) < 0) n.negate();

			const u = new THREE.Vector3().subVectors(b, a).normalize();
			const v = new THREE.Vector3().crossVectors(n, u).normalize();

			return { origin: a.clone(), u, v, normal: n };
		}

		// Project vector to local 2D
		function project2D(p, basis) {
			const d = p.clone().sub(basis.origin);
			return new THREE.Vector2(d.dot(basis.u), d.dot(basis.v));
		}

		const basis = makeBasis(A, B, C);

		// ----------------------------------------
		// 1. Project to 2D
		// ----------------------------------------
		const v1 = project2D(A, basis);
		const v2 = project2D(B, basis);
		const v3 = project2D(C, basis);
		const pts = [v1, v2, v3];

		// ----------------------------------------
		// 2. Inflate using your Python bisector logic
		// ----------------------------------------
		function inflateTriangleXZ(pts, offset) {
			const out = [];
			for (let i = 0; i < 3; i++) {
				const prev = pts[(i + 2) % 3];
				const curr = pts[i];
				const next = pts[(i + 1) % 3];

				const v1 = normalize2(prev.clone().sub(curr));
				const v2 = normalize2(next.clone().sub(curr));

				const bis = normalize2(new THREE.Vector2(-(v1.x + v2.x), -(v1.y + v2.y)));
				out.push(curr.clone().add(bis.multiplyScalar(offset)));
			}
			return out;
		}

		const inflated = inflateTriangleXZ(pts, offset);

		// ----------------------------------------
		// 3. Apply fillets around inflated triangle
		// ----------------------------------------
		function roundedPolygonFromInflated(pts, r) {
			const shape = new THREE.Shape();
			const N = pts.length;

			function dir(a, b) {
				return b.clone().sub(a).normalize();
			}

			for (let i = 0; i < N; i++) {
				const prev = pts[(i + N - 1) % N];
				const curr = pts[i];
				const next = pts[(i + 1) % N];

				const v1 = dir(curr, prev);
				const v2 = dir(curr, next);

				const angle = Math.acos(v1.dot(v2));
				const t = r / Math.tan(angle / 2);

				const start = curr.clone().add(v1.clone().multiplyScalar(t));
				const end   = curr.clone().add(v2.clone().multiplyScalar(t));

				if (i === 0) shape.moveTo(start.x, start.y);
				else shape.lineTo(start.x, start.y);

				shape.quadraticCurveTo(curr.x, curr.y, end.x, end.y);
			}

			shape.closePath();
			return shape;
		}

		const shape2D = roundedPolygonFromInflated(inflated, radius);
		const geom2D = new THREE.ShapeGeometry(shape2D);

		// ----------------------------------------
		// 4. Map back to 3D
		// ----------------------------------------
		const basisMatrix = new THREE.Matrix4().makeBasis(basis.u, basis.v, basis.normal);
		geom2D.applyMatrix4(basisMatrix);
		geom2D.applyMatrix4(new THREE.Matrix4().makeTranslation(
			basis.origin.x, basis.origin.y, basis.origin.z
		));

		// ----------------------------------------
		// 5. Mesh
		// ----------------------------------------
		return new THREE.Mesh(
			geom2D,
			new THREE.MeshStandardMaterial({
				color: 0xffffff,
				side: THREE.DoubleSide
			})
		);
	}


	function createRoundedInflatedTriangleMesh2(v1, v2, v3, normals, d, offset = 1.0, arcSegments = 8) {

		}

			const result = [];
			for (let i = 0; i < 3; i++) {

				const curr = verts[i];

				const v1 = normalize2D([prev[0]-curr[0], prev[1]-curr[1]]);
				const v2 = normalize2D([next[0]-curr[0], next[1]-curr[1]]);

				const bx = -(v1[0]+v2[0]);
				const bz = -(v1[1]+v2[1]);
				const Bnorm = normalize2D([bx,bz]);

				result.push([
					curr[0] + Bnorm[0]*offset,
					curr[1] + Bnorm[1]*offset
				]);
			}
			return result;
		}

		// Plane normal
		const Nx = normals[0]*COLPOLY_NORMAL_FRAC;
		const Ny = normals[1]*COLPOLY_NORMAL_FRAC;
		const Nz = normals[2]*COLPOLY_NORMAL_FRAC;

		// Original XZ triangle
		const verts2d = [
			[v1.x,v1.z],
			[v2.x,v2.z],
			[v3.x,v3.z]

		const inflated = offset_triangle_3points(verts2d);

		// 2️⃣ Round corners properly in XZ

		for (let i = 0; i < 3; i++) {
			const prev = inflated[(i+2)%3];
			const curr = inflated[i];
			const next = inflated[(i+1)%3];

			// Edge directions
			const v1 = normalize2D([curr[0]-prev[0], curr[1]-prev[1]]);
			const v2 = normalize2D([next[0]-curr[0], next[1]-curr[1]]);

			// Bisector
			let bis = [-(v1[0]+v2[0]), -(v1[1]+v2[1])];
			bis = normalize2D(bis);

			// Compute angle between edges
			const angle = Math.acos(v1[0]*v2[0]+v1[1]*v2[1]);

			// Distance along edges to tangent points
			const t = offset / Math.tan(angle/2);

			// Tangent points along edges
			const start = [curr[0]+v1[0]*t, curr[1]+v1[1]*t];
			const end   = [curr[0]+v2[0]*t, curr[1]+v2[1]*t];

			// Arc center = curr + bis*offset
			const cx = curr[0] + bis[0]*offset;
			const cz = curr[1] + bis[1]*offset;

			// Compute start/end angles for arc
			const startAngle = Math.atan2(start[1]-cz, start[0]-cx);
			const endAngle   = Math.atan2(end[1]-cz, end[0]-cx);

			// Draw arc
			for (let s = 0; s <= arcSegments; s++) {
				const alpha = startAngle + (endAngle-startAngle)*(s/arcSegments);
				const x = cx + Math.cos(alpha)*offset;
				const z = cz + Math.sin(alpha)*offset;
				if (i===0 && s===0) shape.moveTo(x,z);

		verts3D.forEach(v=>flat.push(v.x,v.y,v.z));
		geom.setAttribute('position', new THREE.Float32BufferAttribute(flat,3));
		geom.computeVertexNormals();

		// 5️⃣ Mesh
		return new THREE.Mesh(geom,new THREE.MeshStandardMaterial({color:0xffaa00,side:THREE.DoubleSide}));
	}

	function renderRoundedInflatedTriangle(vtxs, normals, d, offset = 1.0, arcSegments = 12) {
		const COLPOLY_NORMAL_FRAC = 1.0 / 32767.0;

		function normalize2D(v) {
			const L = Math.hypot(v[0], v[1]);
			if (!isFinite(L) || L < 1e-6) return [0,0];
			return [v[0]/L, v[1]/L];
		}

		function y_from_plane(x,z,Nx,Ny,Nz,d){
			if (Math.abs(Ny) < 1e-6) return 0;
			return -(Nx*x + Nz*z + d)/Ny;
		}

		// Inflate triangle in XZ
		function offset_triangle_3points(verts){
			const result=[];
			for(let i=0;i<3;i++){
				const prev = verts[(i+2)%3];
				const curr = verts[i];
				const next = verts[(i+1)%3];

				const v1 = normalize2D([prev[0]-curr[0], prev[1]-curr[1]]);
				const v2 = normalize2D([next[0]-curr[0], next[1]-curr[1]]);

				let bx = -(v1[0]+v2[0]);
				let bz = -(v1[1]+v2[1]);
				let B = normalize2D([bx,bz]);

				result.push([
					curr[0] + B[0]*offset,
					curr[1] + B[1]*offset
				]);
			}
			return result;
		}

		const Nx = normals[0] * COLPOLY_NORMAL_FRAC;
		const Ny = normals[1] * COLPOLY_NORMAL_FRAC;
		const Nz = normals[2] * COLPOLY_NORMAL_FRAC;

		// Skip steep downward-facing triangles
		if (Ny < -0.8) {
			return null; // tell caller to ignore it
		}
		
		const verts2d = vtxs.map(v=>[v.x, v.z]);
		const inflated = offset_triangle_3points(verts2d);

		const shape = new THREE.Shape();

		for(let i=0;i<3;i++){
			const prev = inflated[(i+2)%3];
			const curr = inflated[i];
			const next = inflated[(i+1)%3];

			const v1 = normalize2D([curr[0]-prev[0], curr[1]-prev[1]]);
			const v2 = normalize2D([next[0]-curr[0], next[1]-curr[1]]);

			let dot = v1[0]*v2[0] + v1[1]*v2[1];
			dot = Math.min(Math.max(dot, -1), 1);
			let angle = Math.acos(dot);

				if (i===0) shape.moveTo(curr[0], curr[1]);
				else shape.lineTo(curr[0], curr[1]);
				continue;
			}

			const t = offset / tanHalf;

			const start = [curr[0]+v1[0]*t, curr[1]+v1[1]*t];
			const end   = [curr[0]+v2[0]*t, curr[1]+v2[1]*t];

			let bis = normalize2D([-(v1[0]+v2[0]), -(v1[1]+v2[1])]);
			const cx = curr[0] + bis[0]*offset;
			const cz = curr[1] + bis[1]*offset;

				if (i===0) shape.moveTo(curr[0], curr[1]);
				else shape.lineTo(curr[0], curr[1]);

			const endAngle   = Math.atan2(end[1]-cz, end[0]-cx);

		}

				const v2 = normalize2D([next[0]-curr[0], next[1]-curr[1]]);

				let bx = Math.fround(-(v1[0]+v2[0]));
				let bz = Math.fround(-(v1[1]+v2[1]));
				const B = normalize2D([bx, bz]);

				result.push([
					Math.fround(curr[0] + B[0]*offset),
					Math.fround(curr[1] + B[1]*offset),
				]);

		const Ny = f32(normals[1] * COLPOLY_NORMAL_FRAC);
		const Nz = f32(normals[2] * COLPOLY_NORMAL_FRAC);

			const v1 = normalize2D([curr[0]-prev[0], curr[1]-prev[1]]);
			const v2 = normalize2D([next[0]-curr[0], next[1]-curr[1]]);

			let dot = f32(v1[0]*v2[0] + v1[1]*v2[1]);

			const endAngle   = Math.atan2(end[1]-cz,   end[0]-cx);

				const t = s / arcSegments;
				const alpha = f32(startAngle + (endAngle-startAngle)*t);

				const x = f32(cx + Math.cos(alpha)*offset);
				const z = f32(cz + Math.sin(alpha)*offset);

			geom2D,
			new THREE.MeshStandardMaterial({

				side: THREE.DoubleSide
			})

	function renderStandableTriangle(vtxs, normals, d) {

		// Convert vertices to float32 AND ensure exact Y via plane
		function liftVertex(x, z) {
			if (Math.abs(Ny) < 1e-12) return 0.0;
			return f32(-(Nx*x + Nz*z + D) / Ny);
		}

		// Build Float32Array geometry (3 vertices)
		const pos = new Float32Array(9);

		for (let i = 0; i < 3; i++) {
			const vx = f32(vtxs[i].x);
			const vz = f32(vtxs[i].z);
			const vy = liftVertex(vx, vz);

			pos[i*3+0] = vx;
			pos[i*3+1] = vy;
			pos[i*3+2] = vz;
		}

		const geom = new THREE.BufferGeometry();
		geom.setAttribute("position", new THREE.BufferAttribute(pos, 3));
		geom.computeVertexNormals();

		const mesh = new THREE.Mesh(
			geom,
			new THREE.MeshStandardMaterial({
				color: 0x00ff99,
				side: THREE.DoubleSide,
			})
		);

		return mesh;
	}

	function renderStandableSurfaceWithEdges(allTriangleData) {
		const f32 = Math.fround;
		const COLPOLY_NORMAL_FRAC = f32(1.0 / 32767.0);

		const positions = [];
		const indices = [];
		let vertexOffset = 0;

		allTriangleData.forEach(tri => {
			const vtxs = tri.vtxs;
			const normals = tri.normals;
			const D = f32(tri.d);

			const Nx = f32(normals[0] * COLPOLY_NORMAL_FRAC);
			const Ny = f32(normals[1] * COLPOLY_NORMAL_FRAC);
			const Nz = f32(normals[2] * COLPOLY_NORMAL_FRAC);

			if (Ny <= f32(0.0)) return;

			function liftVertex(x, z) {
				if (Math.abs(Ny) < 1e-12) return 0.0;
				return f32(-(Nx*x + Nz*z + D) / Ny);
			}

			for (let i = 0; i < 3; i++) {
				const vx = f32(vtxs[i].x);
				const vz = f32(vtxs[i].z);
				const vy = liftVertex(vx, vz);
				positions.push(vx, vy, vz);
			}

			indices.push(vertexOffset, vertexOffset + 1, vertexOffset + 2);
			vertexOffset += 3;
		});

		// Main mesh
		const geometry = new THREE.BufferGeometry();
		geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
		geometry.setIndex(indices);
		geometry.computeVertexNormals();

		const mesh = new THREE.Mesh(
			geometry,
			new THREE.MeshStandardMaterial({
				//color: 0x00ff99,
				color: 0xff0000,
				side: THREE.DoubleSide,
				flatShading: true,
				polygonOffset: true,
				polygonOffsetFactor: 4,
				polygonOffsetUnits: 4
			})
		);

		// Edges
		const edgesGeom = new THREE.EdgesGeometry(geometry);
		const edgesMat = new THREE.LineBasicMaterial({ color: 0x000000 });
		const edges = new THREE.LineSegments(edgesGeom, edgesMat);

		// Create a group containing both mesh and edges
		const group = new THREE.Group();
		group.add(mesh);
		group.add(edges);

		return group;
	}
	
	function renderStandableSurfaceWithEdgesV2(allTriangleData) {
		const f32 = Math.fround;
		const COLPOLY_NORMAL_FRAC = f32(1.0 / 32767.0);

		const positions = [];
		const indices = [];
		let vertexOffset = 0;

		allTriangleData.forEach(tri => {
			const vtxs = tri.vtxs;
			const normals = tri.normals;
			const D = f32(tri.d);

			const Nx = f32(normals[0] * COLPOLY_NORMAL_FRAC);
			const Ny = f32(normals[1] * COLPOLY_NORMAL_FRAC);
			const Nz = f32(normals[2] * COLPOLY_NORMAL_FRAC);

			if (Ny <= f32(0.0)) return;

			// Find original lowest Y vertex
			let minY = Math.min(vtxs[0].y, vtxs[1].y, vtxs[2].y);

			function liftVertex(x, z) {
				if (Math.abs(Ny) < 1e-12) return 0.0;
				return f32(-(Nx * x + Nz * z + D) / Ny);
			}

			// Determine if we need to offset triangle
			let expandedVertices = vtxs.map(v => ({ x: f32(v.x), z: f32(v.z) }));

			if (Math.abs(Ny) > 0.5) {
				// Expand triangle by 1 unit on all sides with rounded corners
				// Simple approach: move each vertex away from centroid
				const centroid = {
					x: (expandedVertices[0].x + expandedVertices[1].x + expandedVertices[2].x) / 3,
					z: (expandedVertices[0].z + expandedVertices[1].z + expandedVertices[2].z) / 3
				};

				expandedVertices = expandedVertices.map(v => {
					const dx = v.x - centroid.x;
					const dz = v.z - centroid.z;
					const len = Math.sqrt(dx*dx + dz*dz);
					const factor = len > 0 ? (len + 1) / len : 1;
					return {
						x: centroid.x + dx * factor,
						z: centroid.z + dz * factor
					};
				});
			}

			for (let i = 0; i < 3; i++) {
				const vx = expandedVertices[i].x;
				const vz = expandedVertices[i].z;
				let vy = liftVertex(vx, vz);

				// Clamp to original lowest vertex
				vy = Math.max(vy, minY);

				positions.push(vx, vy, vz);
			}

			indices.push(vertexOffset, vertexOffset + 1, vertexOffset + 2);
			vertexOffset += 3;
		});

		// Create main mesh
		const geometry = new THREE.BufferGeometry();
		geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
		geometry.setIndex(indices);
		geometry.computeVertexNormals();

		const mesh = new THREE.Mesh(
			geometry,
			new THREE.MeshStandardMaterial({
				//color: 0x00ff99,
				color: 0xff0000,
				side: THREE.DoubleSide,
				flatShading: true,
				polygonOffset: true,
				polygonOffsetFactor: 4,
				polygonOffsetUnits: 4
			})
		);

		// Edges
		const edgesGeom = new THREE.EdgesGeometry(geometry);
		const edgesMat = new THREE.LineBasicMaterial({ color: 0x000000 });
		const edges = new THREE.LineSegments(edgesGeom, edgesMat);

		// Group
		const group = new THREE.Group();
		group.add(mesh);
		group.add(edges);

		return group;
	}
	
	function renderRoundedInflatedTriangleWithMinThickness(vtxs, normals, d, offset = 1.0, arcSegments = 12, minThickness = 0.05) {
		const mesh = renderRoundedInflatedTriangle(vtxs, normals, d, offset, arcSegments);

		// Extrude along plane normal by a small amount
		const Nx = normals[0]/32767, Ny = normals[1]/32767, Nz = normals[2]/32767;
		const normal = new THREE.Vector3(Nx, Ny, Nz).normalize();

		const geom = mesh.geometry;
		const pos = geom.attributes.position;
		const count = pos.count;

		// Duplicate vertices and offset along normal to create a thin "extruded" solid
		const newPos = [];
		for(let i=0;i<count;i++){
			const x = pos.getX(i);
			const y = pos.getY(i);
			const z = pos.getZ(i);
			newPos.push(x,y,z);
		}
		for(let i=0;i<count;i++){
			const x = pos.getX(i) + normal.x * minThickness;
			const y = pos.getY(i) + normal.y * minThickness;
			const z = pos.getZ(i) + normal.z * minThickness;
			newPos.push(x,y,z);
		}

		const newGeom = new THREE.BufferGeometry();
		newGeom.setAttribute('position', new THREE.Float32BufferAttribute(newPos,3));

		// Optional: compute faces for top/bottom (or just render as lines)
		newGeom.computeVertexNormals();

		return new THREE.Mesh(newGeom, new THREE.MeshStandardMaterial({color:0xffaa00, side:THREE.DoubleSide}));
	}

	function validate2DPolygon(points, label="poly") {
		for (let i = 0; i < points.length; i++) {
			const [x, z] = points[i];

			if (!isFinite(x) || !isFinite(z)) {
				console.error("❌ NaN point in polygon:", label, "point:", i, points[i]);
				return false;
			}

			if (i > 0) {
				const [px, pz] = points[i - 1];
				const dx = x - px, dz = z - pz;
				if (Math.hypot(dx, dz) < 1e-6) {
					console.warn("⚠ Degenerate edge in", label, "between points", i-1, "and", i);
					return false;
				}
			}
		}

		// also check last → first
		const [fx, fz] = points[0];
		const [lx, lz] = points[points.length - 1];
		if (Math.hypot(fx - lx, fz - lz) < 1e-6) {
			console.warn("⚠ Degenerate closing edge in", label);
			return false;
		}

		return true;
	}

	function renderRoundedInflatedTriangleAdaptive(vtxs, normals, d, offset = 1.0, arcSegments = 12, minSize = 0.1) {
		const COLPOLY_NORMAL_FRAC = 1.0 / 32767.0;

		function normalize2D(v) {
			const L = Math.hypot(v[0], v[1]);
			return L === 0 ? [0,0] : [v[0]/L, v[1]/L];
		}

		function y_from_plane(x,z,Nx,Ny,Nz,d){
			return -(Nx*x + Nz*z + d)/Ny;
		}

		function offset_triangle_3points(verts){
			const result=[];
			for(let i=0;i<3;i++){
				const prev = verts[(i+2)%3];
				const curr = verts[i];
				const next = verts[(i+1)%3];

				const v1 = normalize2D([prev[0]-curr[0], prev[1]-curr[1]]);
				const v2 = normalize2D([next[0]-curr[0], next[1]-curr[1]]);

				const bx = -(v1[0]+v2[0]);
				const bz = -(v1[1]+v2[1]);
				const Bnorm = normalize2D([bx,bz]);

				result.push([curr[0]+Bnorm[0]*offset, curr[1]+Bnorm[1]*offset]);
			}
			return result;
		}

		const Nx = normals[0]*COLPOLY_NORMAL_FRAC;
		const Ny = normals[1]*COLPOLY_NORMAL_FRAC;
		const Nz = normals[2]*COLPOLY_NORMAL_FRAC;

		const verts2d = vtxs.map(v=>[v.x,v.z]);

		const inflated = offset_triangle_3points(verts2d);

		// Create rounded shape
		const shape = new THREE.Shape();
		for(let i=0;i<3;i++){
			const prev = inflated[(i+2)%3];
			const curr = inflated[i];
			const next = inflated[(i+1)%3];

			const v1 = normalize2D([curr[0]-prev[0], curr[1]-prev[1]]);
			const v2 = normalize2D([next[0]-curr[0], next[1]-curr[1]]);

			let bis = [-(v1[0]+v2[0]), -(v1[1]+v2[1])];
			bis = normalize2D(bis);

			const angle = Math.acos(Math.min(Math.max(v1[0]*v2[0]+v1[1]*v2[1],-1),1));
			const t = offset / Math.tan(angle / 2);

			const start = [curr[0]+v1[0]*t, curr[1]+v1[1]*t];
			const end   = [curr[0]+v2[0]*t, curr[1]+v2[1]*t];

			const cx = curr[0]+bis[0]*offset;
			const cz = curr[1]+bis[1]*offset;

			const startAngle = Math.atan2(start[1]-cz, start[0]-cx);
			const endAngle   = Math.atan2(end[1]-cz, end[0]-cx);

			for(let s=0;s<=arcSegments;s++){
				const alpha = startAngle + (endAngle-startAngle)*(s/arcSegments);
				const x = cx + Math.cos(alpha)*offset;
				const z = cz + Math.sin(alpha)*offset;
				if(i===0 && s===0) shape.moveTo(x,z);
				else shape.lineTo(x,z);
			}
		}

		// Check 2D bounding box size
		const pts2D = shape.getPoints(arcSegments*3);
		let minX=Infinity,maxX=-Infinity,minZ=Infinity,maxZ=-Infinity;
		pts2D.forEach(p=>{
			minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x);
			minZ=Math.min(minZ,p.y); maxZ=Math.max(maxZ,p.y);
		});
		const sizeX = maxX-minX, sizeZ=maxZ-minZ;

		if(sizeX<minSize || sizeZ<minSize){
			// Too small → render as edges
			const geom = new THREE.BufferGeometry();
			const flat = [];
			pts2D.forEach(p=>{
				const y = y_from_plane(p.x,p.y,Nx,Ny,Nz,d);
				flat.push(p.x,y,p.y);
			});
			// Close the loop
			const y0 = y_from_plane(pts2D[0].x, pts2D[0].y, Nx,Ny,Nz,d);
			flat.push(pts2D[0].x,y0,pts2D[0].y);

			geom.setAttribute('position', new THREE.Float32BufferAttribute(flat,3));
			return new THREE.Line(geom,new THREE.LineBasicMaterial({color:0x000000}));
		} else {
			// Normal filled mesh
			const geom2D = new THREE.ShapeGeometry(shape);
			const posAttr = geom2D.getAttribute('position');
			for(let i=0;i<posAttr.count;i++){
				const x = posAttr.getX(i);
				const z = posAttr.getY(i);
				const y = y_from_plane(x,z,Nx,Ny,Nz,d);
				posAttr.setXYZ(i,x,y,z);
			}
			geom2D.computeVertexNormals();
			return new THREE.Mesh(geom2D,new THREE.MeshStandardMaterial({color:0xffaa00, side:THREE.DoubleSide}));
		}
	}
	
	function getStandableTestPoints(vtxs, normals, d, offset = 1.0, numPoints = 7) {
		const COLPOLY_NORMAL_FRAC = 1.0 / 32767.0;

		function normalize2D(v) {
			const L = Math.hypot(v[0], v[1]);
			return L === 0 ? [0,0] : [v[0]/L, v[1]/L];
		}

		function y_from_plane(x,z,Nx,Ny,Nz,d){
			return -(Nx*x + Nz*z + d)/Ny;
		}

		function offset_triangle_3points(verts){
			const result=[];
			for(let i=0;i<3;i++){
				const prev = verts[(i+2)%3];
				const curr = verts[i];
				const next = verts[(i+1)%3];

				const v1 = normalize2D([prev[0]-curr[0], prev[1]-curr[1]]);
				const v2 = normalize2D([next[0]-curr[0], next[1]-curr[1]]);

				const bx = -(v1[0]+v2[0]);
				const bz = -(v1[1]+v2[1]);
				const Bnorm = normalize2D([bx,bz]);

				result.push([curr[0]+Bnorm[0]*offset, curr[1]+Bnorm[1]*offset]);
			}
			return result;
		}

		const Nx = normals[0]*COLPOLY_NORMAL_FRAC;
		const Ny = normals[1]*COLPOLY_NORMAL_FRAC;
		const Nz = normals[2]*COLPOLY_NORMAL_FRAC;

		// Project triangle to XZ and inflate
		const verts2d = vtxs.map(v=>[v.x,v.z]);
		const inflated = offset_triangle_3points(verts2d);

		// Barycentric sampling
		const [v0,v1,v2] = inflated;
		const points = [];

		// include corners
		points.push(v0.slice(), v1.slice(), v2.slice());

		for(let i=0;i<numPoints-3;i++){
			let r1 = Math.random();
			let r2 = Math.random();
			if(r1+r2>1){ r1=1-r1; r2=1-r2; }
			const x = v0[0]+r1*(v1[0]-v0[0])+r2*(v2[0]-v0[0]);
			const z = v0[1]+r1*(v1[1]-v0[1])+r2*(v2[1]-v0[1]);
			points.push([x,z]);
		}

		// Map to 3D
		const points3D = points.map(p=>{
			const x = p[0];
			const z = p[1];
			const y = y_from_plane(x,z,Nx,Ny,Nz,d);
			return new THREE.Vector3(
				Math.fround(x),
				Math.fround(y),
				Math.fround(z)
			);
		});

		// Print for in-game testing
		console.log("Standable test points (f32):");
		points3D.forEach((p,i)=>{
			console.log(`Point ${i}: x=${p.x}, y=${p.y}, z=${p.z}`);
		});

		return points3D;
	}
	
    function removeAllModelCheckboxes() {
        const section = document.querySelector('.controls');
        // Remove all containers that hold the model checkbox + color picker
        section.querySelectorAll('div').forEach(container => {
            const label = container.querySelector('label');
            if (label && label.textContent.trim().startsWith('Show ')) {

            }
        });

    function addModelCheckbox(name, meshObj, edgesObj, clearFirst, checked, color = null) {
        const section = document.querySelector('.controls');

        // Container
        const container = document.createElement('div');
        container.style.display = 'flex';
        container.style.alignItems = 'center';
        container.style.marginBottom = '4px';
        container.style.gap = '8px'; // space between checkbox+label and color picker

        // Visibility checkbox + label
        const label = document.createElement('label');
        label.style.display = 'flex';
        label.style.alignItems = 'center';
        const chk = document.createElement('input');
        chk.type = 'checkbox';
        chk.checked = checked;
		if (meshObj != null)
			meshObj.visible = checked;
		if (edgesObj != null)
			edgesObj.visible = checked;
        chk.addEventListener('change', () => {
            if (meshObj != null)
                meshObj.visible = chk.checked;
            if (edgesObj != null)
				edgesObj.visible = chk.checked && wireframeCheckbox.checked;
            clearSelection();
        });
        label.appendChild(chk);
        const labelText = document.createTextNode(` Show ${name}`);
        label.appendChild(labelText);

        // Color picker
        const colorInput = document.createElement('input');
        colorInput.type = 'color';
		if (color != null)
			colorInput.value = color;
		else
			colorInput.value = clearFirst ? '#3aa6ff' : '#3aff78';
        colorInput.addEventListener('input', () => {
            if (meshObj != null && meshObj.material) {
                meshObj.material.color.set(colorInput.value);
                meshObj.material.needsUpdate = true;
            }
            else {
                edgesObj.material.color.set(colorInput.value);
                edgesObj.material.needsUpdate = true;
            }
        });

        // Assemble
        container.appendChild(label);
        container.appendChild(colorInput);
        section.appendChild(container);
    }

    // Clear selection
    function clearSelection() {
        // Remove all selection markers from the scene
        selectedTriangles.forEach(sel => {
            const markerName = `selectionMarker_${sel.modelName}_${sel.index}`;
            const marker = scene.getObjectByName(markerName);
            if (marker) {
                scene.remove(marker);
                if (marker.geometry) marker.geometry.dispose();
                if (marker.material) marker.material.dispose();
            }
        });

        selectedTriangles.length = 0; // Empty the selection array
        selectionListEl.value = ''; // Clear selection text box
        updateSelectionUI(); // Update UI state
    }
    
    function addSelectionMarker(tri) {
        const selGeom = new THREE.BufferGeometry();
        const arr = new Float32Array([
            tri.verts[0].x, tri.verts[0].y, tri.verts[0].z,
            tri.verts[1].x, tri.verts[1].y, tri.verts[1].z,
            tri.verts[2].x, tri.verts[2].y, tri.verts[2].z
        ]);
        selGeom.setAttribute('position', new THREE.BufferAttribute(arr, 3));
        selGeom.setIndex([0, 1, 2]);

        const selMat = new THREE.MeshBasicMaterial({
            color: 0xffff66,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 1.0,
            polygonOffset: true,
            polygonOffsetFactor: -1,
            polygonOffsetUnits: -1
        });

        const selMesh = new THREE.Mesh(selGeom, selMat);
        selMesh.name = `selectionMarker_${tri.modelName}_${tri.index}`;
        scene.add(selMesh);
    }

    function removeSelectionMarker(tri) {
        const markerName = `selectionMarker_${tri.modelName}_${tri.index}`;
        const marker = scene.getObjectByName(markerName);
        if (marker) scene.remove(marker);
    }

    // Handle triangle selection
    function performSelection(ev) {
        if (!loadedModels.length) return;

        if (document.pointerLockElement === renderer.domElement) {
            mouse.x = 0;
            mouse.y = 0;
        } else {
            const rect = renderer.domElement.getBoundingClientRect();
            const x = ev.clientX - rect.left;
            const y = ev.clientY - rect.top;
            mouse.x = (x / rect.width) * 2 - 1;
            mouse.y = -(y / rect.height) * 2 + 1;
        }

        raycaster.setFromCamera(mouse, camera);

        const visibleMeshes = loadedModels
            .filter(m => m.mesh && m.mesh.visible)
            .map(m => m.mesh);

        const inter = raycaster.intersectObjects(visibleMeshes, true);
        if (inter.length === 0) {
            clearSelection();
            updateSelectionUI();
            return;
        }

        let hit = null;
        for (const i of inter) {
            if (i.face && i.object.visible) {
                hit = i;
                break;
            }
        }

        if (!hit) {
            clearSelection();
            updateSelectionUI();
            return;
        }

        const face = hit.face;
        const geom = hit.object.geometry;
        const pos = geom.attributes.position;
        const a = face.a, b = face.b, c = face.c;
        const va = new THREE.Vector3().fromBufferAttribute(pos, a);
        const vb = new THREE.Vector3().fromBufferAttribute(pos, b);
        const vc = new THREE.Vector3().fromBufferAttribute(pos, c);

        const newTri = {
            index: Math.floor(hit.faceIndex),
            verts: [va, vb, vc],
            modelName: hit.object.name
        };

        // Check if triangle is already selected (match by index + modelName)
        const existingIndex = selectedTriangles.findIndex(
            t => t.index === newTri.index && t.modelName === newTri.modelName
        );

        if (existingIndex !== -1) {
            // It's already selected → remove it
            selectedTriangles.splice(existingIndex, 1);
            updateSelectionUI();
            removeSelectionMarker(newTri);
            return;
        }

        // If single-select mode is active, clear previous selections
        if (!multiSelectCheckbox.checked) {
            clearSelection();
        }

        selectedTriangles.push(newTri);
        addSelectionMarker(newTri);
        updateSelectionUI();
    }

	////////////////////////////////////////

	////////////////////////////////////////

	function clearFlatGroundMarkers() {
		for (const m of flatGroundMarkers) {
			scene.remove(m);
			if (m.geometry) m.geometry.dispose();
			if (m.material) m.material.dispose();
		}
		flatGroundMarkers.length = 0;
	}

	function recolorFlatGroundMarkers() {
		for (const m of flatGroundMarkers) {
			m.material.color.setHex(flatGroundColor);
		}
	}

	function createFlatGroundMarker(verts) {
		const geom = new THREE.BufferGeometry();
		const arr = new Float32Array([
			verts[0].x, verts[0].y, verts[0].z,
			verts[1].x, verts[1].y, verts[1].z,
			verts[2].x, verts[2].y, verts[2].z
		]);
		geom.setAttribute("position", new THREE.BufferAttribute(arr, 3));
		geom.setIndex([0,1,2]);

		const mat = new THREE.MeshBasicMaterial({
			color: flatGroundColor,
			side: THREE.DoubleSide,
			transparent: true,
			opacity: 0.9,
			polygonOffset: true,
			polygonOffsetFactor: -1,
			polygonOffsetUnits: -1
		});

		const mesh = new THREE.Mesh(geom, mat);
		scene.add(mesh);
		flatGroundMarkers.push(mesh);
	}

	////////////////////////////////////////
	// Scan loaded models for flat ground
	////////////////////////////////////////

	function scanAndBuildFlatGroundMarkers() {
		clearFlatGroundMarkers();
		if (!flatGroundEnabled) return;

		for (const model of loadedModels) {
			if (!model.mesh || !model.mesh.visible) continue;

			const geom = model.mesh.geometry;
			const pos = geom.attributes.position;
			const index = geom.index;

			for (let i = 0; i < index.count; i += 3) {
				const a = index.getX(i);
				const b = index.getX(i + 1);
				const c = index.getX(i + 2);

				const va = new THREE.Vector3().fromBufferAttribute(pos, a);
				const vb = new THREE.Vector3().fromBufferAttribute(pos, b);
				const vc = new THREE.Vector3().fromBufferAttribute(pos, c);
				
				const edge1 = new THREE.Vector3().subVectors(vb, va);
				const edge2 = new THREE.Vector3().subVectors(vc, va);
				const normal = new THREE.Vector3().crossVectors(edge1, edge2).normalize();

				// All y equal?
				if (va.y === vb.y && vb.y === vc.y && normal.y > 0) {
					// In table?
					if (flat_ground_clip_y_table.has(Math.round(va.y))) {
						createFlatGroundMarker([va, vb, vc]);
					}
				}
			}
		}
	}

      if(h===0 || w===0) return;

    ////////////////////////////////////////

    let last = performance.now();
    
    function animate(){
      requestAnimationFrame(animate);
      const now = performance.now();
      const dt = Math.min(0.05,(now-last)/1000);
      last = now;
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.0));

      if(controlMode !== 'orbit' && document.pointerLockElement === renderer.domElement){
        // Apply WASD movement in pointer-lock mode
        const dir = new THREE.Vector3();
        if(move.forward) dir.z -= 1;
        if(move.back) dir.z += 1;
        if(move.left) dir.x -= 1;
        if(move.right) dir.x += 1;
        if(move.up) dir.y += 1;
        if(move.down) dir.y -= 1;
        if(dir.lengthSq()>0){
          dir.normalize();
          const worldDir = dir.applyQuaternion(camera.quaternion).multiplyScalar(speed*dt);
          pointerControls.getObject().position.add(worldDir);
          camera.position.copy(pointerControls.getObject().position);
        }
      }

      // Update UI
      camPosEl.textContent = `${camera.position.x.toFixed(2)}, ${camera.position.y.toFixed(2)}, ${camera.position.z.toFixed(2)}`;
      const euler = new THREE.Euler().setFromQuaternion(camera.quaternion);
      camRotEl.textContent = `${THREE.MathUtils.radToDeg(euler.x).toFixed(1)}, ${THREE.MathUtils.radToDeg(euler.y).toFixed(1)}, ${THREE.MathUtils.radToDeg(euler.z).toFixed(1)}`;

      // Update orbit controls if active
      if(orbitControls) orbitControls.update();

      // update edges transformation if any
      if(edges && mesh){ edges.position.copy(mesh.position); edges.rotation.copy(mesh.rotation); }

      renderer.render(scene,camera);
    }
    onWindowResize();
    animate();

	// ===============================================================
	// OoT Polygon Standable Surface Debugger
	// JavaScript (Three.js compatible)
	// ===============================================================

	// Constants
	const COLPOLY_NORMAL_FRAC = 1.0 / 32767.0;
	let EPS = 0.008;
	// ------------------------
	// Helper Functions
	// ------------------------

	function f32(v) { return Math.fround(v); }
	function isZero(f) { return Math.abs(f) < EPS; }

	// Distance squared from point (x0,z0) to segment (x1,z1)-(x2,z2)
	function pointDistSqToLine2D(x0,z0, x1,z1, x2,z2) {
		const dx = x2-x1, dz = z2-z1;
		const distSq = dx*dx + dz*dz;
		if (isZero(distSq)) return {hit:false, d2:0};
		const t = ((x0-x1)*dx + (z0-z1)*dz)/distSq;
		const hit = t >= 0 && t <= 1;
		const px = x1 + dx*t;
		const pz = z1 + dz*t;
		const d2 = (px-x0)*(px-x0) + (pz-z0)*(pz-z0);
		return {hit, d2};
	}

	// Cir-square vs tri-square
	function cirSquareVsTriSquare(x0,y0, x1,y1, x2,y2, cx,cy, r) {
		let minX = Math.min(x0,x1,x2), maxX = Math.max(x0,x1,x2);
		let minY = Math.min(y0,y1,y2), maxY = Math.max(y0,y1,y2);
		return (minX-r)<=cx && (maxX+r)>=cx && (minY-r)<=cy && (maxY+r)>=cy;
	}

	// Determinant test for point-in-triangle
	function detTestXZ(v0,v1,v2,x,z) {
		const d0 = (v0.z - z)*(v1.x - x) - (v0.x - x)*(v1.z - z);
		const d1 = (v1.z - z)*(v2.x - x) - (v1.x - x)*(v2.z - z);
		const d2 = (v2.z - z)*(v0.x - x) - (v2.x - x)*(v0.z - z);
		return (d0>=0 && d1>=0 && d2>=0) || (d0<=0 && d1<=0 && d2<=0);
	}

	// Compute Y from plane
	function computeYFromPlane(nx,ny,nz,d,x,z) {
		if (isZero(ny)) return 0;
		return f32((-(nx*x + nz*z) - d)/ny);
	}

	// ------------------------
	// Analytic Standable Footprint
	// Minkowski sum triangle ⊕ circle(radius)
	// ------------------------
	function analyticStandableFootprint(tri, radius=1.0, samplesPerArc=5) {
		const pts = tri.vtxs.map(v => ({x:v.x, z:v.z}));
		// Compute outward edge normals
		const N = [];
		for (let i=0;i<3;i++){
			const a=pts[i], b=pts[(i+1)%3];
			const ex = b.x-a.x, ez = b.z-a.z;
			const len = Math.hypot(ez,-ex);
			N.push({nx: ez/len, nz:-ex/len});
		}
		// Vertex offsets
		const expanded = [];
		for (let i=0;i<3;i++){
			const prev=N[(i+2)%3], next=N[i];
			let nx = prev.nx + next.nx, nz = prev.nz + next.nz;
			const len = Math.hypot(nx,nz); if(len>1e-6){ nx/=len; nz/=len;}
			expanded.push({x: pts[i].x + nx*radius, z: pts[i].z + nz*radius});
		}
		// Compute Y per vertex
		const nx = tri.normals[0]*COLPOLY_NORMAL_FRAC;
		const ny = tri.normals[1]*COLPOLY_NORMAL_FRAC;
		const nz = tri.normals[2]*COLPOLY_NORMAL_FRAC;
		const d = tri.d;
		return expanded.map(p => ({x:p.x, z:p.z, y: computeYFromPlane(nx,ny,nz,d,p.x,p.z)}));
	}

	// ------------------------
	// Game-accurate Sampling
	// ------------------------
	function sampledStandableFootprint(tri, resolution=0.25) {
		const v0 = tri.vtxs[0], v1=tri.vtxs[1], v2=tri.vtxs[2];
		const nx = tri.normals[0]*COLPOLY_NORMAL_FRAC;
		const ny = tri.normals[1]*COLPOLY_NORMAL_FRAC;
		const nz = tri.normals[2]*COLPOLY_NORMAL_FRAC;
		const d = tri.d;
		const chkDist = 1.0;

		// Compute bounds
		const xs=[v0.x,v1.x,v2.x], zs=[v0.z,v1.z,v2.z];
		const minX=Math.min(...xs)-chkDist, maxX=Math.max(...xs)+chkDist;
		const minZ=Math.min(...zs)-chkDist, maxZ=Math.max(...zs)+chkDist;

		const result = [];
		let total = Math.ceil((maxX-minX)/resolution) * Math.ceil((maxZ-minZ)/resolution);
		let count = 0;

		for (let x=minX;x<=maxX;x+=resolution){
			for (let z=minZ;z<=maxZ;z+=resolution){
				count++;
				if(count % Math.floor(total/100) === 0) console.log("Sampling progress: "+Math.floor(count/total*100)+"%");

				// Cir-square vs tri-square
				if(!cirSquareVsTriSquare(v0.x,v0.z,v1.x,v1.z,v2.x,v2.z,x,z,chkDist)) continue;

				// Vertex distance check
				const chkDistSq = chkDist*chkDist;
				if(((v0.x-x)**2+(v0.z-z)**2)<chkDistSq || ((v1.x-x)**2+(v1.z-z)**2)<chkDistSq || ((v2.x-x)**2+(v2.z-z)**2)<chkDistSq){
					result.push({x:f32(x), z:f32(z), y:computeYFromPlane(nx,ny,nz,d,x,z)});
					continue;
				}

				// Determinant check
				if(detTestXZ(v0,v1,v2,x,z)){
					result.push({x:f32(x), z:f32(z), y:computeYFromPlane(nx,ny,nz,d,x,z)});
					continue;
				}

				// Edge distance check if |ny|>0.5
				if(Math.abs(ny)>0.5){
					const L0=pointDistSqToLine2D(x,z,v0.x,v0.z,v1.x,v1.z);
					const L1=pointDistSqToLine2D(x,z,v1.x,v1.z,v2.x,v2.z);
					const L2=pointDistSqToLine2D(x,z,v2.x,v2.z,v0.x,v0.z);
					if((L0.hit && L0.d2<chkDistSq)||(L1.hit && L1.d2<chkDistSq)||(L2.hit && L2.d2<chkDistSq)){
						result.push({x:f32(x), z:f32(z), y:computeYFromPlane(nx,ny,nz,d,x,z)});
					}
				}
			}
		}
		console.log("Sampling complete: 100%");
		return result;
	}

	function sampledStandableFootprint2(tri, resolution=0.25) {
		const v0 = tri.vtxs[0], v1 = tri.vtxs[1], v2 = tri.vtxs[2];
		const nx = tri.normals[0] * COLPOLY_NORMAL_FRAC;
		const ny = tri.normals[1] * COLPOLY_NORMAL_FRAC;
		const nz = tri.normals[2] * COLPOLY_NORMAL_FRAC;
		const d = tri.d;
		const chkDist = 1.0;

		// Compute bounds
		const xs = [v0.x, v1.x, v2.x], zs = [v0.z, v1.z, v2.z];
		const minX = Math.min(...xs) - chkDist, maxX = Math.max(...xs) + chkDist;
		const minZ = Math.min(...zs) - chkDist, maxZ = Math.max(...zs) + chkDist;

		const result = [];
		let total = Math.ceil((maxX - minX) / resolution) * Math.ceil((maxZ - minZ) / resolution);
		let count = 0;

		for (let x = minX; x <= maxX; x += resolution) {
			for (let z = minZ; z <= maxZ; z += resolution) {
				count++;
				//if (count % Math.floor(total / 100) === 0) console.log("Sampling progress: " + Math.floor(count / total * 100) + "%");

				const y = computeYFromPlane(nx, ny, nz, d, x, z);

				// --- NEW: vertex-Y early out (match OoT) ---
				const minVertexY = Math.min(v0.y, v1.y, v2.y);
				if (y < minVertexY) continue;

				// Cir-square vs tri-square
				if (!cirSquareVsTriSquare(v0.x, v0.z, v1.x, v1.z, v2.x, v2.z, x, z, chkDist)) continue;

				// Vertex distance check
				const chkDistSq = chkDist * chkDist;
				if (((v0.x - x) ** 2 + (v0.z - z) ** 2) < chkDistSq ||
					((v1.x - x) ** 2 + (v1.z - z) ** 2) < chkDistSq ||
					((v2.x - x) ** 2 + (v2.z - z) ** 2) < chkDistSq) {
					result.push({ x: f32(x), z: f32(z), y });
					continue;
				}

				// Determinant check (point inside triangle)
				if (detTestXZ(v0, v1, v2, x, z)) {
					result.push({ x: f32(x), z: f32(z), y });
					continue;
				}

				// Edge distance check if |ny| > 0.5
				if (Math.abs(ny) > 0.5) {
					const L0 = pointDistSqToLine2D(x, z, v0.x, v0.z, v1.x, v1.z);
					const L1 = pointDistSqToLine2D(x, z, v1.x, v1.z, v2.x, v2.z);
					const L2 = pointDistSqToLine2D(x, z, v2.x, v2.z, v0.x, v0.z);
					if ((L0.hit && L0.d2 < chkDistSq) || (L1.hit && L1.d2 < chkDistSq) || (L2.hit && L2.d2 < chkDistSq)) {
						result.push({ x: f32(x), z: f32(z), y });
					}
				}
			}
		}

		//console.log("Sampling complete: 100%");
		//console.log(result)
		return result;
	}
	
	function sampledStandableFootprintMesh(tri, resolution = 0.25, radius = 1.0) {
		const [v0, v1, v2] = tri.vtxs;
		const nx = tri.normals[0] * COLPOLY_NORMAL_FRAC;
		const ny = tri.normals[1] * COLPOLY_NORMAL_FRAC;
		const nz = tri.normals[2] * COLPOLY_NORMAL_FRAC;
		const d = tri.d;

		const points = [];

		// --- Helper to sample a vertex blob ---
		function sampleVertex(v) {
			const minX = v.x - radius, maxX = v.x + radius;
			const minZ = v.z - radius, maxZ = v.z + radius;

			for (let x = minX; x <= maxX; x += resolution) {
				for (let z = minZ; z <= maxZ; z += resolution) {
					const dx = x - v.x, dz = z - v.z;
					if (dx*dx + dz*dz > radius*radius) continue; // circle filter
					const y = computeYFromPlane(nx, ny, nz, d, x, z);
					if (y < v.y) continue; // OoT vertex-Y early out
					points.push(new THREE.Vector3(x, y, z));
				}
			}
		}

		// --- Sample triangle body ---
		function sampleTriangleBody() {
			const xs = [v0.x, v1.x, v2.x], zs = [v0.z, v1.z, v2.z];
			const minX = Math.min(...xs) - radius, maxX = Math.max(...xs) + radius;
			const minZ = Math.min(...zs) - radius, maxZ = Math.max(...zs) + radius;

			for (let x = minX; x <= maxX; x += resolution) {
				for (let z = minZ; z <= maxZ; z += resolution) {
					const y = computeYFromPlane(nx, ny, nz, d, x, z);
					if (y < Math.min(v0.y, v1.y, v2.y)) continue;
					if (detTestXZ(v0, v1, v2, x, z)) {
						points.push(new THREE.Vector3(x, y, z));
					}
				}
			}
		}

		// --- Generate points ---
		sampleVertex(v0);
		sampleVertex(v1);
		sampleVertex(v2);
		sampleTriangleBody();

		// --- Create geometry ---
		const geometry = new THREE.BufferGeometry();
		const vertices = new Float32Array(points.length * 3);
		points.forEach((p, i) => {
			vertices[i * 3 + 0] = p.x;
			vertices[i * 3 + 1] = p.y;
			vertices[i * 3 + 2] = p.z;
		});
		geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
		
		geometry.computeVertexNormals();

		// --- Create mesh ---
		const material = new THREE.MeshStandardMaterial({
			color: 0x88cc88,
			side: THREE.DoubleSide,
			flatShading: false
		});

		return new THREE.Mesh(geometry, material);
	}
	
	function fastStandableFootprint2(tri, radius = 1.0, samplesPerEdge = 100) {
		const v = tri.vtxs;
		const nx = tri.normals[0] * COLPOLY_NORMAL_FRAC;
		const ny = tri.normals[1] * COLPOLY_NORMAL_FRAC;
		const nz = tri.normals[2] * COLPOLY_NORMAL_FRAC;
		const d = tri.d;

		// Step 1: compute outward edge normals in XZ
		const N = [];
		for (let i = 0; i < 3; i++) {
			const a = v[i], b = v[(i + 1) % 3];
			const ex = b.x - a.x, ez = b.z - a.z;
			const len = Math.hypot(ez, -ex);
			N.push({ nx: ez / len, nz: -ex / len });
		}

		// Step 2: expand vertices
		const expanded = [];
		for (let i = 0; i < 3; i++) {
			const prev = N[(i + 2) % 3], next = N[i];
			let nx2 = prev.nx + next.nx, nz2 = prev.nz + next.nz;
			const len = Math.hypot(nx2, nz2);
			if (len > 1e-6) { nx2 /= len; nz2 /= len; }
			expanded.push({ x: v[i].x + nx2 * radius, z: v[i].z + nz2 * radius });
		}

		const result = [];

		// Step 3: sample along edges
		for (let i = 0; i < 3; i++) {
			const a = expanded[i], b = expanded[(i + 1) % 3];
			for (let s = 0; s <= samplesPerEdge; s++) {
				const t = s / samplesPerEdge;
				const x = a.x * (1 - t) + b.x * t;
				const z = a.z * (1 - t) + b.z * t;
				const y = computeYFromPlane(nx, ny, nz, d, x, z);
				result.push({ x: f32(x), y, z: f32(z) });
			}
		}

		// Step 4: interior coverage (centroid)
		const cx = (expanded[0].x + expanded[1].x + expanded[2].x) / 3;
		const cz = (expanded[0].z + expanded[1].z + expanded[2].z) / 3;
		const cy = computeYFromPlane(nx, ny, nz, d, cx, cz);
		result.push({ x: f32(cx), y: cy, z: f32(cz) });

		// Optional: add midpoints of edges for better interior accuracy
		for (let i = 0; i < 3; i++) {
			const a = expanded[i], b = expanded[(i + 1) % 3];
			const mx = (a.x + b.x) / 2, mz = (a.z + b.z) / 2;
			const my = computeYFromPlane(nx, ny, nz, d, mx, mz);
			result.push({ x: f32(mx), y: my, z: f32(mz) });
		}

		return result;
	}
	
	function fastStandableFootprint(tri, radius=1.0, samplesPerEdge=5) {
		const v = tri.vtxs;
		const nx = tri.normals[0]*COLPOLY_NORMAL_FRAC;
		const ny = tri.normals[1]*COLPOLY_NORMAL_FRAC;
		const nz = tri.normals[2]*COLPOLY_NORMAL_FRAC;
		const d = tri.d;

		// Step 1: compute outward normals in XZ
		const N = [];
		for (let i=0;i<3;i++){
			const a=v[i], b=v[(i+1)%3];
			const ex=b.x-a.x, ez=b.z-a.z;
			const len=Math.hypot(ez,-ex);
			N.push({nx:ez/len, nz:-ex/len});
		}

		// Step 2: expand vertices
		const expanded = [];
		for (let i=0;i<3;i++){
			const prev=N[(i+2)%3], next=N[i];
			let nx2 = prev.nx + next.nx, nz2 = prev.nz + next.nz;
			const len=Math.hypot(nx2,nz2); if(len>1e-6){ nx2/=len; nz2/=len;}
			expanded.push({x:v[i].x + nx2*radius, z:v[i].z + nz2*radius});
		}

		// Step 3: sample along edges
		const result = [];
		for (let i=0;i<3;i++){
			const a=expanded[i], b=expanded[(i+1)%3];
			for (let s=0;s<=samplesPerEdge;s++){
				const t=s/samplesPerEdge;
				const x=a.x*(1-t)+b.x*t;
				const z=a.z*(1-t)+b.z*t;
				const y = computeYFromPlane(nx, ny, nz, d, x, z);
				result.push({x: f32(x), y, z: f32(z)});
			}
		}

		// Optional: add interior point at centroid
		const cx=(expanded[0].x+expanded[1].x+expanded[2].x)/3;
		const cz=(expanded[0].z+expanded[1].z+expanded[2].z)/3;
		const cy = computeYFromPlane(nx, ny, nz, d, cx, cz);
		result.push({x:f32(cx), y:cy, z:f32(cz)});

		return result;
	}

	function drawSampledPoints(scene, allTriangleData, sampleFunc, sampleStep = 0.1) {
