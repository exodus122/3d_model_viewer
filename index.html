<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>3D Model Viewer</title>
  <link style="text/css" rel="stylesheet" href="stylesheet.css"/>
</head>
<body>
  <div id="app">
    <div id="canvas-wrap">
      <canvas id="gl"></canvas>
      <div id="crosshair"></div>
      <div id="hint" style="position:absolute;left:10px;top:10px;background:rgba(0,0,0,0.4);padding:6px;border-radius:6px;color:#dbeafe;font-family:monospace;font-size:13px">Click canvas to lock mouse &amp; fly (WASD + SPACE/C to move up/down). Press Esc to unlock mouse</div>
    </div>

    <div id="sidebar">
      <h2>3D Model Viewer</h2>

      <div class="section">
        <!--<div class="muted">Game:</div>-->
        <select id="selected-game">
            <option value="BK">Banjo-Kazooie</option>
            <option value="BT">Banjo-Tooie</option>
            <option value="OOT">OOT</option>
            <option value="OOT3D">OOT3D</option>
            <option value="MM">MM</option>
            <option value="MM3D">MM3D</option>
            <!--<option value="Default">Default</option>-->
        </select>
        <select id="mapDropdown"></select>
        <!--<label>Load model file (binary or text). Supported binary format:
          <div class="muted">[uint16 vertexCount][uint16 triCount][int16 x,y,z ...][uint16 i,j,k ...]</div>-->
        </label>
        <button id="loadMap">Load Map</button>
        <input id="file" type="file" accept="*/*" />
      </div>

      <div class="section controls">
        <h3>Options</h3>
        <!--<div class="muted">Control mode:</div>-->
        <select id="control-mode">
          <!--<option value="auto">Auto (try Pointer Lock, fallback to Orbit)</option>-->
          <option value="pointer">Fly Mode (WASD)</option>
          <option value="orbit">Orbit (mouse drag + wheel)</option>
        </select>
        <div id="status" role="status" aria-live="polite">Status: starting...</div>
        <label>Flying Speed <input id="movementSpeedSlider" type="range" min="50" max="3850" step="200" value="1500"></label>
        <label id="display_fwc_label" style="display:none;"><input id="display_fwc" type="checkbox"> Display floors/walls/ceilings on load</label>
        <label><input id="wireframe" type="checkbox" checked> Draw triangle edges</label>
        <label><input id="backface" type="checkbox"> Double-sided</label>
        <div style="display: flex; align-items: center; margin-bottom: 4px; gap: 8px;" id="samplePointsContainer"><label id="samplePointsLabel"><input type="checkbox" id="samplePointsCheckbox">Sample Standable Points</label><input type="range" id="samplePointsResolution" value="0.1" min="0.001" max="0.12" step="0.01"></div>
        <label style="display:none;"><input id="translucent" type="checkbox" checked> Translucent (opacity)</label>
        <label style="display:none;">Opacity <input id="opacity" type="range" min="0" max="1" step="0.01" value="1.0"></label>
        <label style="display:none;"><input id="grid" type="checkbox"> Draw grid</label>
      </div>
      
      <div class="section">
        <h3>Selected Triangles</h3>
        <div class="select-info">
          <label><input id="multiSelect" type="checkbox"> Multi-select</label>
          <textarea id="selectionListEl" rows="6" cols="40" readonly></textarea>
        </div>
      </div>

      <div class="section">
        <h3>Camera</h3>
        <div class="info">
          <div>pos: <span id="cam-pos">0,0,0</span></div>
          <div>rot (deg): <span id="cam-rot">0,0,0</span></div>
        </div>
      </div>

      <!--<div class="section footer muted">
      </div>-->
    </div>
  </div>  
  <!-- Import map to allow bare "three" imports from example modules. -->
  <script src="https://cdn.jsdelivr.net/npm/d3-delaunay@6.0.4/dist/d3-delaunay.min.js"></script>
  <script type="importmap">
  {
    "imports": {
        "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/"
    }
  }
  </script>
  <script type="text/javascript" src="js/model_list.js"></script>
  <script type="text/javascript" src="js/global.js"></script>
  <script type="module" src="js/selection.js"></script>
  <script type="module" src="js/render.js"></script>
  <script type="module" src="js/subdivisions.js"></script>
  <script type="module" src="js/sample_points.js"></script>
  <script type="module" src="js/standable_surfaces.js"></script>
  <script type="module" src="js/ground_clips.js"></script>
  <script type="module" src="js/parse_model.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
