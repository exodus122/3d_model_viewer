<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>3D Model Viewer</title>
  <link style="text/css" rel="stylesheet" href="stylesheet.css"/>
</head>
<body>
  <div id="app">
    <div id="canvas-wrap">
      <canvas id="gl"></canvas>
      <div id="crosshair"></div>
      <div id="loading" hidden><div class="spinner"></div><div id="loadingText">Loading…</div></div>
      <div id="hint" style="position:absolute;left:10px;top:10px;background:rgba(0,0,0,0.4);padding:6px;border-radius:6px;color:#dbeafe;font-family:monospace;font-size:13px">Click canvas to lock mouse &amp; fly (WASD + SPACE/C to move up/down). Press Esc to unlock mouse</div>
    </div>

    <div id="sidebar">
      <div class="sidebar-title">
        <h2>3D Model Viewer</h2>
        <button id="resetDefaults" type="button" title="Forget every saved choice (the sidebar groups' checkboxes and collapsed state, auto-import settings) and reload the page with the defaults.">Reset to defaults</button>
      </div>

      <div class="section map-picker">
        <label class="picker-row">Game <select id="selected-game">
            <option value="BK">Banjo-Kazooie</option>
            <option value="BT">Banjo-Tooie</option>
            <option value="DK64">Donkey Kong 64</option>
            <option value="OOT">OOT</option>
            <option value="OOT3D">OOT3D</option>
            <option value="MM">MM</option>
            <option value="MM3D">MM3D</option>
        </select></label>
        <label class="picker-row">Map <select id="mapDropdown"></select></label>
        <!--<label>Load model file (binary or text). Supported binary format:
          <div class="muted">[uint16 vertexCount][uint16 triCount][int16 x,y,z ...][uint16 i,j,k ...]</div>
        </label>-->
        <label id="setupDropdownDiv" class="picker-row" style="display:none;" title="OOT / MM: the scene setup (layer) whose actors are drawn: every actor in its spawn lists, with its model where the viewer knows it, else as a marker, plus the collision of the dynapoly ones. Choose what each actor row draws under Options, Actor display.">Setup <select id="setupDropdown"></select></label>
        <div class="picker-actions">
          <button id="loadMap">Load Map</button>
          <label class="file-button" title="Load a model file (binary or text)">Choose file<input id="file" type="file" accept="*/*" hidden></label>
          <span id="fileName" class="file-name"></span>
        </div>
        <!-- (hidden for now: loading a single actor by id) -->
        <select id="actorDropdown" style="display:none;"></select>
        <button id="loadActor" style="display:none;">Load Actor</button>
      </div>

      <div class="section controls">
        <h3>Options</h3>
        <label class="picker-row">Mode <select id="control-mode">
          <!--<option value="auto">Auto (try Pointer Lock, fallback to Orbit)</option>-->
          <option value="pointer">Fly (WASD)</option>
          <option value="orbit">Orbit (mouse drag + wheel)</option>
        </select></label>
        <!-- Status bar removed: it only reported pointer-lock state. setStatus()
             in main.js no-ops without this element, so restoring it is just a
             matter of putting this div back. -->
        <label id="movementSpeedRow" class="picker-row" title="Flying speed (Fly mode)">Speed <input id="movementSpeedSlider" type="range" min="50" max="3050" step="200" value="850"></label>
        <label id="display_fwc_label" style="display:none;"><input id="display_fwc" type="checkbox"> Display floors/walls/ceilings on load</label>
        <label><input id="wireframe" type="checkbox" checked> Draw triangle/cube edges</label>
        <label style="display:none;"><input id="backface" type="checkbox"> Double-sided triangles</label>
        <div id="bkViewModeLabel"><label title="Maps, model props and actors drawn with their in-game textures and vertex colours (decoded from the display lists). Off: the map's collision mesh and the props' geometry in flat colours."><input id="bkTextures" type="checkbox" checked> Textures</label><label id="bkPropCollisionLabel" title="Draw each model prop's / actor's collision list (often just a hitbox-sized shape, quite different from its display list). With textures on it is drawn translucent over the textured model; with textures off it replaces the prop's display-list triangles. Props with no collision list keep showing their display list, and say so in their description ('visual')."><input id="bkPropCollision" type="checkbox"> Prop/actor collision</label></div>
        <details id="actorDisplay" class="actor-display" style="display:none;" title="What every row in the Actors group draws. The row checkboxes still show or hide an actor type as a whole.">
          <summary>Actor display</summary>
          <div class="actor-display-content">
            <label title="The actor's model: textured, or flat orange with Textures off."><input id="actorLayer_model" type="checkbox" checked> Model</label>
            <label title="Dynapoly collision: tangible orange, intangible green, waterboxes cyan."><input id="actorLayer_collision" type="checkbox" checked> Collision</label>
            <label title="Standable surface of the dynapoly collision (dynapoly determinant tolerance)."><input id="actorLayer_standable" type="checkbox"> Standable surface</label>
            <label title="Seams of the dynapoly collision's standable surface."><input id="actorLayer_seams" type="checkbox"> Seams</label>
          </div>
        </details>
        <div id="bkActorHitboxesLabel" style="margin-top:8px; font-size:13px" title="Draw actors' hitboxes: what the game tests Banjo against (BK func_803322F0, BT core2 0x801099D0). Most model actors carry a hit volume list in the model (boxes, cylinders and spheres, often one per body part) and are tested against those; the rest use the model's bounding sphere (vertex list centre and local_norm, times the actor's scale). A sprite actor's is half the sprite size, centred half a sprite up. Volumes pinned to a bone are shown in the rest pose. Enemies = contact hurts Banjo (red). Touch = things that react when touched: collectibles, pads, switches, doors, NPCs (cyan). Scenery actors like stairs and signs have a sphere nothing checks and are never drawn (in BT: actors whose info struct gives the marker no touch callbacks, see BT_Actor_Hitboxes).">Actor hitboxes: <label style="display:inline; margin:0 8px 0 0"><input id="bkActorHitboxesEnemy" type="checkbox"> enemies</label><label style="display:inline; margin:0"><input id="bkActorHitboxesTouch" type="checkbox"> touch</label></div>
        <label id="groundClipBandsLabel" style="display:none;" title="Blue = the portion of the surface below its lowest vertex. Red = safe standable ground. Yellow = a ground-clippable band (the raycast-through-floor bug is present there). Cyan = the entire surface is ground-clippable. Unchecking this skips computing the yellow/cyan bands and renders those areas as plain red instead."><input id="groundClipBandsCheckbox" type="checkbox"> Ground-clippable standable surface on load</label>
        <div id="samplePointsContainer"><label id="samplePointsLabel"><input type="checkbox" id="samplePointsCheckbox"> Sample standable points</label><input type="range" id="samplePointsResolution" value="0.02" min="0.005" max="0.03" step="0.005" title="Sample spacing"></div>
        <div id="wallClipContainer" class="clip-region" style="display:none;">
          <div class="clip-region-title">Clipfinder integration</div>
          <div class="clip-buttons">
            <button id="wallClipImport" title="Load one clipfinder results file for the loaded map">Import</button><input id="wallClipImportFile" type="file" accept=".json,application/json" style="display:none">
            <button id="wallClipExport" title="Write the shown points out as JSON (clipfinder's format, for wall_clip_tester.lua): the clip kinds whose rows are ticked, filtered by Reachable and |Y velocity|">Export JSON</button>
            <button id="wallClipExportSelected" title="Write just the selected clip points out as JSON (the same format as Export JSON): click a dot to select it, tick Multi-select to pick several">Export selected</button>
            <button id="wallClipDynaExportAll" title="Every map's dynapoly actors, for every setup, in one file (nothing is drawn), for clipfinder --all --dyna. Setups with the same dynapolys are written once.">Export all dynapolys</button>
          </div>
          <label class="clip-line" title="When a map loads, import every clipfinder results file for it from this folder (served by the viewer's server): files named by --out-dir, for this map, that are static scans or scans with the loaded setup's dynapolys. They're merged."><input id="wallClipAutoImport" type="checkbox" checked> Auto-import <input id="wallClipAutoDir" type="text" value="tools/clipfinder/results"></label>
          <div class="clip-line">
            <label title="Only show points whose speed in the results file is this or less (actor speed; on the N64 he moves 1.5x that a frame): clipfinder --min-speed's lowest speed when the file has it, else the clip's own move. Defaults to the form's run speed, until you change it."><input id="wallClipReachable" type="checkbox"> Reachable, speed &le; <input id="wallClipMaxSpeed" type="number" min="0" max="100" step="0.5" value="6"></label>
          </div>
          <div class="clip-line">
            <label title="Max move per frame: how far Link can move in one frame (clipfinder --max-move, default 40: speed 26.67 on the N64, 40 on OoT3D / MM3D). Imported results set it to what their scan used; Export JSON writes it.">Max move <input id="wallClipMaxMove" type="number" min="1" max="150" step="0.5" value="40"></label>
          </div>
          <div class="clip-line">
            <label title="Only show clips Link can do falling at this y velocity or slower (as a positive number: 14 means velocity.y -14 or above). Falling clips need their fall / 1.5 (with Reachable ticked, the fall from the reachable start; else the clip's own), ground clips their vy (-20). Clips that don't use y velocity (walking acute / extended, slope) are never hidden."><input id="wallClipVyFilter" type="checkbox"> |Y velocity| &le; <input id="wallClipMaxVy" type="number" min="0" max="100" step="0.5" value="20"></label>
          </div>
          <div class="clip-line"><label title="Draw the clip points and their lines in front of everything. Off: walls and floors in front of them hide them, like the rest of the scene."><input id="wallClipOnTop" type="checkbox" checked> Points on top</label></div>
          <span id="wallClipStatus" style="font-size:12px"></span>
        </div>
        <div class="surface-row">
          <div class="dropdown" id="surfaceDropdown" style="display:none;">
            <button class="dropdown-btn">Surface flags ▾</button>
            <div class="dropdown-content" id="surfaceDropdownContent"></div>
          </div>
          <label id="waterboxCheckboxDiv" style="display:none;"><input type="checkbox" id="showFullWaterboxDepth"> Full waterbox depth</label>
        </div>
        <div id="subdivisionSelectorContainer" style="display:none;">
            <label class="subdivision-row">Subdivision <select id="subdivisionSelector"></select></label>
        </div>
        <label style="display:none;"><input id="translucent" type="checkbox" checked> Translucent (opacity)</label>
        <label style="display:none;">Opacity <input id="opacity" type="range" min="0" max="1" step="0.01" value="1.0"></label>
        <label style="display:none;"><input id="grid" type="checkbox"> Draw grid</label>
      </div>
      
      <div class="section">
        <div class="section-heading">
          <h3>Selected Entities</h3>
          <label><input id="multiSelect" type="checkbox"> Multi-select</label>
        </div>
        <div class="select-info">
          <textarea id="selectionListEl" rows="5" cols="40" readonly></textarea>
        </div>
      </div>

      <div class="section">
        <h3>Camera</h3>
        <div class="info camera-info">
          <div>pos: <span id="cam-pos">0,0,0</span></div>
          <div>rot (deg): <span id="cam-rot">0,0,0</span></div>
        </div>
      </div>

      <!--<div class="section footer muted">
      </div>-->
    </div>
  </div>  
  <!-- Import map to allow bare "three" imports from example modules. -->
  <script src="https://cdn.jsdelivr.net/npm/d3-delaunay@6.0.4/dist/d3-delaunay.min.js"></script>
  <script type="importmap">
  {
    "imports": {
        "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/"
    }
  }
  </script>
  <script type="text/javascript" src="js/model_list.js"></script>
  <script type="text/javascript" src="js/object_list.js"></script>
  <script type="text/javascript" src="js/bk_object_list.js"></script>
  <script type="text/javascript" src="js/bt_object_list.js"></script>
  <script type="text/javascript" src="js/dk64_map_list.js"></script>
  <script type="text/javascript" src="js/dk64_object_list.js"></script>
  <script type="text/javascript" src="js/oot_scene_data.js"></script>
  <script type="text/javascript" src="js/oot_object_list.js"></script>
  <script type="text/javascript" src="js/mm_object_list.js"></script>
  <script type="text/javascript" src="js/global.js"></script>
  <script type="module" src="js/selection.js"></script>
  <script type="module" src="js/render.js"></script>
  <script type="module" src="js/waterboxes.js"></script>
  <script type="module" src="js/subdivisions.js"></script>
  <script type="module" src="js/sample_points.js"></script>
  <script type="module" src="js/standable_surfaces.js"></script>
  <script type="module" src="js/render_walls.js"></script>
  <script type="module" src="js/poly_markers.js"></script>
  <script type="module" src="js/render_actors.js"></script>
  <script type="module" src="js/bk_model.js"></script>
  <script type="module" src="js/bk_textured.js"></script>
  <script type="module" src="js/bk_setup.js"></script>
  <script type="module" src="js/zelda_textured.js"></script>
  <script type="module" src="js/oot_actors.js"></script>
  <script type="module" src="js/parse_model.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
